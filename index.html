<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ChoVersi｜超バーシ</title>
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="ChoVersi（超バーシ）— 連鎖の快感を、しずかに。リバーシに異能を加えた戦略ボードゲーム。">
<meta property="og:title" content="ChoVersi｜超バーシ">
<meta property="og:description" content="連鎖の快感を、しずかに。リバーシに異能を加えた戦略ゲーム。">
<meta property="og:image" content="logo.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ChoVersi">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F2EBE0;
    --cream-deep: #E8DCC4;
    --beige: #E8DCC4;
    --sage: #D4B36A;
    --sage-dark: #B49858;
    --dark: #3A3530;
    --light: #F5E8D0;
    --text: #4A443D;
    --muted: #9A9085;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    height: 100dvh;
  }
  body {
    font-family: 'Manrope', 'Noto Sans JP', sans-serif;
    background: var(--cream);
    color: var(--text);
    font-weight: 300;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  .start {
    min-height: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 24px 56px;
    gap: 24px;
  }

  /* ロゴ */
  .start-logo {
    text-align: center;
  }
  .start-logo img {
    width: 320px;
    max-width: 80vw;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .start-tagline {
    margin-top: 16px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    color: var(--text);
    letter-spacing: 0.3em;
    font-weight: 400;
  }
  .start-tagline-en {
    margin-top: 6px;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ボタン */
  .start-buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }

  /* === モード選択 === */
  .mode-picker {
    width: 100%;
    max-width: 360px;
    margin-bottom: 6px;
  }
  .mode-tabs {
    display: flex;
    background: rgba(58, 53, 48, 0.06);
    border-radius: 100px;
    padding: 4px;
    margin-bottom: 12px;
    gap: 4px;
  }
  .mode-tab {
    flex: 1;
    border: none;
    background: transparent;
    padding: 9px 8px;
    border-radius: 100px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.2s, color 0.2s;
  }
  .mode-tab.active {
    background: var(--dark);
    color: var(--cream);
  }
  .mode-panel {
    background: rgba(58, 53, 48, 0.04);
    border-radius: 14px;
    padding: 14px 16px;
    text-align: center;
  }
  .mode-panel.hidden { display: none; }
  .lv-display .lv-num {
    font-family: 'Manrope', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .lv-display .lv-num span { color: var(--sage-dark); font-size: 28px; }
  .xp-bar {
    height: 8px;
    background: rgba(58, 53, 48, 0.1);
    border-radius: 100px;
    overflow: hidden;
    margin: 6px 0;
  }
  .xp-bar .xp-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--sage), var(--sage-dark));
    border-radius: 100px;
    transition: width 0.4s ease;
  }
  .xp-text {
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  .mode-desc {
    margin-top: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }
  /* === ランクタイル（フリー対戦） === */
  .rank-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .rank-grid .rank-tile {
    background: rgba(255, 255, 255, 0.5);
    border: 1.5px solid transparent;
    border-radius: 10px;
    padding: 8px 4px 9px;
    text-align: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, border-color 0.15s, transform 0.12s;
    position: relative;
    user-select: none;
  }
  @media (hover: hover) {
    .rank-grid .rank-tile:hover {
      background: rgba(255, 255, 255, 0.85);
      transform: translateY(-1px);
    }
  }
  .rank-grid .rank-tile.active {
    background: var(--dark);
    border-color: var(--sage);
  }
  .rank-grid .rank-tile.active .rank-tile-num,
  .rank-grid .rank-tile.active .rank-tile-name {
    color: var(--cream);
  }
  .rank-grid .rank-tile.active .rank-tile-dots span {
    background: var(--sage);
  }
  .rank-grid .rank-tile.active::after {
    content: '✓';
    position: absolute;
    top: 2px;
    right: 5px;
    font-size: 10px;
    color: var(--sage);
    font-weight: 700;
  }
  .rank-tile-num {
    font-family: 'Manrope', sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--muted);
    line-height: 1;
    margin-bottom: 4px;
  }
  .rank-tile-name {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.1;
    margin-bottom: 4px;
  }
  .rank-tile-dots {
    display: flex;
    gap: 2px;
    justify-content: center;
  }
  .rank-tile-dots span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(58, 53, 48, 0.18);
  }
  .rank-tile-dots span.on { background: var(--sage-dark); }
  .rank-tile.center-7 {
    /* 鬼神 (07) を 03/04 の真下に配置：行2の3〜4列目を占有 */
    grid-column: 3 / span 2;
    grid-row: 2;
  }

  .rank-summary {
    text-align: center;
    margin-top: 4px;
  }
  .rank-summary-name {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--sage-dark);
    margin-bottom: 2px;
  }
  .rank-summary-meta {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .footer-links {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
  }
  .footer-links a {
    color: var(--muted);
    text-decoration: none;
    padding: 6px 4px;
  }
  .footer-links a:hover { color: var(--text); }
  .footer-links span { color: var(--muted); opacity: 0.4; }

  /* 先手選択（タイル型・大きめタッチターゲット） */
  .color-picker {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    width: 100%;
    max-width: 360px;
  }
  .color-picker-label {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.3em;
  }
  .color-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
  }
  .color-option {
    cursor: pointer;
    padding: 14px 6px 12px;
    border-radius: 14px;
    background: rgba(58, 53, 48, 0.05);
    border: 2px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: all 0.15s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  @media (hover: hover) {
    .color-option:hover {
      background: rgba(58, 53, 48, 0.09);
      transform: translateY(-1px);
    }
  }
  .color-option.active {
    background: rgba(212, 179, 106, 0.25);
    border-color: var(--sage);
  }
  .color-option.active::after {
    content: '✓';
    position: absolute;
    top: 4px;
    right: 8px;
    font-size: 12px;
    color: var(--sage-dark);
    font-weight: 700;
  }
  .color-option .stone-mark {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .color-option .stone-mark.dark  { background: var(--dark); }
  .color-option .stone-mark.light {
    background: var(--light);
    border: 1.5px solid rgba(58, 53, 48, 0.2);
  }
  .color-option .stone-mark.random {
    background: linear-gradient(135deg, var(--dark) 50%, var(--light) 50%);
    border: 1.5px solid rgba(58, 53, 48, 0.2);
  }
  .color-option .name {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
  }
  .color-option .sub {
    font-family: 'Manrope', sans-serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    line-height: 1;
  }

  /* 初心者モード */
  .beginner-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 18px;
    padding: 10px 14px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    background: rgba(58, 53, 48, 0.04);
    border-radius: 100px;
    -webkit-tap-highlight-color: transparent;
  }
  .beginner-toggle:has(input:checked) {
    background: rgba(212, 179, 106, 0.22);
  }
  .beginner-toggle input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--sage-dark);
  }
  .btn {
    font-family: 'Noto Sans JP', sans-serif;
    display: inline-block;
    background: var(--dark);
    color: var(--cream);
    padding: 18px 80px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.2s;
    min-width: 240px;
    text-align: center;
  }
  .btn.secondary {
    background: transparent;
    color: var(--text);
    padding: 16px 24px;
  }
  @media (hover: hover) {
    .btn:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }
  }
  .btn:active { transform: translateY(0); opacity: 0.9; }

  /* フッター */
  .start-footer {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: var(--muted);
    opacity: 0.6;
    letter-spacing: 0.3em;
    text-align: center;
    pointer-events: none;
  }

  /* 背景の微細なテクスチャ（飾り）— ゴールド系のゆっくり浮遊 */
  .bg-decoration {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 800px;
    height: 800px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0.18;
    z-index: 0;
  }
  .bg-decoration .stone {
    position: absolute;
    border-radius: 50%;
    will-change: transform;
  }
  .bg-decoration .s1 {
    width: 220px; height: 220px;
    background: #E0C679;
    top: 8%; left: 6%;
    animation: floatA 24s ease-in-out infinite;
  }
  .bg-decoration .s2 {
    width: 300px; height: 300px;
    background: var(--sage);
    bottom: 10%; right: 8%;
    animation: floatB 30s ease-in-out infinite;
  }
  .bg-decoration .s3 {
    width: 140px; height: 140px;
    background: #C9A85F;
    top: 55%; left: 65%;
    animation: floatC 36s ease-in-out infinite;
  }
  @keyframes floatA {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(40px, -30px) scale(1.05); }
    66%      { transform: translate(-25px, 20px) scale(0.95); }
  }
  @keyframes floatB {
    0%, 100% { transform: translate(0, 0) scale(1); }
    40%      { transform: translate(-35px, 25px) scale(1.08); }
    75%      { transform: translate(20px, -30px) scale(0.97); }
  }
  @keyframes floatC {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(30px, 30px) scale(1.1); }
  }

  .start > * { position: relative; z-index: 1; }

  /* モバイル */
  @media (max-width: 720px) {
    .start { gap: 18px; padding: 16px 20px 56px; }
    .start-logo img { width: 200px; }
    .start-tagline { margin-top: 10px; font-size: 12px; }
    .start-tagline-en { font-size: 10px; }
    .btn { padding: 14px 50px; min-width: 200px; font-size: 13px; }
    .mode-panel { padding: 12px 14px; }
    .lv-display .lv-num { font-size: 18px; }
    .lv-display .lv-num span { font-size: 24px; }
    .mode-desc { font-size: 10px; }
  }
</style>
</head>
<body>

<div class="bg-decoration">
  <div class="stone s1"></div>
  <div class="stone s2"></div>
  <div class="stone s3"></div>
</div>

<div class="start">
  <div class="start-logo">
    <img src="logo.png" alt="ChoVersi｜超バーシ">
    <div class="start-tagline">連鎖の快感を、しずかに</div>
    <div class="start-tagline-en">THE CHAIN HYPER REVERSI</div>
  </div>

  <div class="start-buttons">

    <!-- モード選択：ランク戦 / フリー対戦 -->
    <div class="mode-picker" id="mode-picker">
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="campaign">ランク戦</button>
        <button class="mode-tab" data-mode="single">フリー対戦</button>
      </div>
      <div class="mode-panel" id="campaign-panel">
        <div class="lv-display">
          <div class="lv-num">LV <span id="campaign-lv">1</span></div>
          <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
          <div class="xp-text"><span id="xp-text">0 / 5</span> XP — 次のLVまで</div>
        </div>
        <div class="mode-desc">勝てば強敵に、負ければ少し優しい敵に。最大 LV99。</div>
      </div>
      <div class="mode-panel hidden" id="single-panel">
        <div class="rank-grid" id="rank-grid">
          <!-- ランクタイルを JS で動的生成 -->
        </div>
        <div class="rank-summary">
          <div class="rank-summary-name" id="rank-name">中級</div>
          <div class="rank-summary-meta">内部 LV <span id="rank-lv">30</span> ／ 1戦のみ・経験値には影響なし</div>
        </div>
      </div>
    </div>

    <div class="color-picker" id="color-picker">
      <div class="color-picker-label">あなたの色を選ぶ</div>
      <div class="color-options">
        <div class="color-option active" data-color="D">
          <div class="stone-mark dark"></div>
          <div class="name">黒</div>
          <div class="sub">先手</div>
        </div>
        <div class="color-option" data-color="L">
          <div class="stone-mark light"></div>
          <div class="name">白</div>
          <div class="sub">後手</div>
        </div>
        <div class="color-option" data-color="random">
          <div class="stone-mark random"></div>
          <div class="name">おまかせ</div>
          <div class="sub">RANDOM</div>
        </div>
      </div>
    </div>
    <label class="beginner-toggle">
      <input type="checkbox" id="beginner-mode">
      <span>初心者向け（連鎖が起きやすいデッキ）</span>
    </label>
    <a href="#" id="start-btn" class="btn">はじめる</a>
    <div class="footer-links">
      <a href="rules.html">ルール</a>
      <span>·</span>
      <a href="badges.html">🏆 バッジ</a>
      <span>·</span>
      <a href="#" id="reset-progress">進捗リセット</a>
    </div>
  </div>
</div>

<script>
(function() {
  // === XPカーブ（game.htmlと同じ式） ===
  const MAX_LEVEL = 99;
  function xpToNext(lv) {
    if (lv < 10) return 5;
    if (lv < 30) return 8;
    if (lv < 50) return 14;
    if (lv < 70) return 18;
    if (lv < 90) return 22;
    return 24 + (lv - 90) * 2;
  }
  function xpToLevel(xp) {
    let lv = 1, remain = xp;
    while (lv < MAX_LEVEL && remain >= xpToNext(lv)) { remain -= xpToNext(lv); lv++; }
    return { lv, intoLv: remain, needForNext: lv < MAX_LEVEL ? xpToNext(lv) : 0 };
  }
  function ls(key, fallback) {
    try { const v = localStorage.getItem(key); return v != null ? v : fallback; }
    catch (e) { return fallback; }
  }

  // === 色選択 ===
  const picker = document.getElementById('color-picker');
  const startBtn = document.getElementById('start-btn');
  let selected = 'D';
  try { const s = localStorage.getItem('choversi.player'); if (s) selected = s; } catch (e) {}
  function updateColorUI() {
    picker.querySelectorAll('.color-option').forEach(el => {
      el.classList.toggle('active', el.dataset.color === selected);
    });
  }
  picker.addEventListener('click', (e) => {
    const opt = e.target.closest('.color-option');
    if (!opt) return;
    selected = opt.dataset.color;
    try { localStorage.setItem('choversi.player', selected); } catch (e) {}
    updateColorUI();
  });

  // === 初心者モード ===
  const begCheck = document.getElementById('beginner-mode');
  try {
    if (localStorage.getItem('choversi.beginner') === '1') begCheck.checked = true;
  } catch (e) {}
  begCheck.addEventListener('change', () => {
    try { localStorage.setItem('choversi.beginner', begCheck.checked ? '1' : '0'); } catch (e) {}
  });

  // === モード（campaign / single） ===
  let mode = ls('choversi.mode', '"campaign"');
  try { mode = JSON.parse(mode); } catch(e) { mode = 'campaign'; }
  const modePicker = document.getElementById('mode-picker');
  const tabs = modePicker.querySelectorAll('.mode-tab');
  const campaignPanel = document.getElementById('campaign-panel');
  const singlePanel = document.getElementById('single-panel');

  function updateModeUI() {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
    campaignPanel.classList.toggle('hidden', mode !== 'campaign');
    singlePanel.classList.toggle('hidden', mode !== 'single');
    try { localStorage.setItem('choversi.mode', JSON.stringify(mode)); } catch (e) {}
  }
  tabs.forEach(t => t.addEventListener('click', () => {
    mode = t.dataset.mode;
    updateModeUI();
  }));

  // === キャンペーン LV/XP表示 ===
  const xp = Number(ls('choversi.xp', '0'));
  const { lv, intoLv, needForNext } = xpToLevel(xp);
  document.getElementById('campaign-lv').textContent = lv;
  document.getElementById('xp-text').textContent =
    needForNext === 0 ? 'MAX' : `${intoLv} / ${needForNext}`;
  const fillPct = needForNext === 0 ? 100 : Math.round(intoLv / needForNext * 100);
  document.getElementById('xp-fill').style.width = fillPct + '%';

  // === フリー対戦 7段ランクピッカー ===
  const RANK_PRESETS = [
    { idx: 1, name: '入門', lv: 5,  dots: 1 },
    { idx: 2, name: '初級', lv: 15, dots: 2 },
    { idx: 3, name: '中級', lv: 30, dots: 3 },
    { idx: 4, name: '上級', lv: 50, dots: 4 },
    { idx: 5, name: '達人', lv: 70, dots: 5 },
    { idx: 6, name: '名人', lv: 85, dots: 6 },
    { idx: 7, name: '鬼神', lv: 99, dots: 7 },
  ];
  let singleLv = Math.max(1, Math.min(99, Number(ls('choversi.singleLv', '30'))));
  // 過去の任意LVを最も近い段に丸める
  const closest = RANK_PRESETS.reduce((a, b) =>
    Math.abs(b.lv - singleLv) < Math.abs(a.lv - singleLv) ? b : a);
  let selectedRank = closest;

  const rankGrid = document.getElementById('rank-grid');
  rankGrid.innerHTML = RANK_PRESETS.map(p => `
    <button class="rank-tile${p.idx === 7 ? ' center-7' : ''}" data-rank="${p.idx}">
      <div class="rank-tile-num">${p.idx.toString().padStart(2,'0')}</div>
      <div class="rank-tile-name">${p.name}</div>
      <div class="rank-tile-dots">${
        Array.from({length: 7}, (_, i) => `<span class="${i < p.dots ? 'on' : ''}"></span>`).join('')
      }</div>
    </button>
  `).join('');

  function updateRankUI() {
    rankGrid.querySelectorAll('.rank-tile').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.rank) === selectedRank.idx);
    });
    document.getElementById('rank-name').textContent = selectedRank.name;
    document.getElementById('rank-lv').textContent = selectedRank.lv;
    singleLv = selectedRank.lv;
    try {
      localStorage.setItem('choversi.singleLv', String(singleLv));
      localStorage.setItem('choversi.singleRank', String(selectedRank.idx));
    } catch (e) {}
  }
  rankGrid.addEventListener('click', (e) => {
    const tile = e.target.closest('.rank-tile');
    if (!tile) return;
    const idx = Number(tile.dataset.rank);
    selectedRank = RANK_PRESETS.find(p => p.idx === idx);
    updateRankUI();
  });
  updateRankUI();

  updateColorUI();
  updateModeUI();

  // === 進捗リセット ===
  document.getElementById('reset-progress').addEventListener('click', (e) => {
    e.preventDefault();
    if (!confirm('XP・LV・バッジ・戦績をすべてリセットします。よろしいですか？')) return;
    try {
      ['choversi.xp','choversi.badges','choversi.stats'].forEach(k => localStorage.removeItem(k));
    } catch (e) {}
    location.reload();
  });

  // === はじめる ===
  startBtn.addEventListener('click', (e) => {
    e.preventDefault();
    let actual = selected;
    if (actual === 'random') actual = Math.random() < 0.5 ? 'D' : 'L';
    const params = [`as=${actual}`, `mode=${mode}`];
    if (mode === 'single') params.push(`lv=${singleLv}`);
    if (begCheck.checked) params.push('beg=1');
    params.push(`v=${Date.now()}`);
    window.location.href = `game.html?${params.join('&')}`;
  });
})();
</script>

<div class="start-footer">CHOVERSI v0.1 · PROTOTYPE</div>

</body>
</html>
