/* ============================================================
   12. 背景・金網 (§4.1)
   ============================================================ */
function drawBackground(F){
  const {W,H}=V;
  // ベース
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#05070d'); g.addColorStop(0.42,C.bg1); g.addColorStop(1,'#04060b');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // リングライト
  const lx=W*0.5, ly=H*0.12;
  g=ctx.createRadialGradient(lx,ly,0,lx,ly,H*0.62);
  const heat=clamp((100-F.e.hp)/100,0,1);
  g.addColorStop(0,`rgba(${120+60*heat},${130},${170},0.34)`);
  g.addColorStop(0.45,'rgba(40,54,86,0.16)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // 観客席（情報量を抑える §4.1）
  ctx.save();
  ctx.globalAlpha=0.5;
  for(let r=0;r<3;r++){
    const y=H*(0.16+r*0.045), a=0.10-r*0.02;
    ctx.fillStyle=`rgba(232,226,212,${a})`;
    const n=Math.ceil(W/13);
    for(let i=0;i<n;i++){
      const x=i*13+((r%2)*6);
      const s=2+((i*7+r*3)%3);
      const flick = 0.6+0.4*Math.sin(Clock.real/900+i*1.7+r);
      ctx.globalAlpha=a*4*flick*0.5;
      ctx.fillRect(x,y,s,s*0.7);
    }
  }
  ctx.restore();

  // 床（距離に応じて視界から外れる）
  const fy=V.groundY;
  if(fy<V.H){
  g=ctx.createLinearGradient(0,fy-H*0.06,0,H);
  g.addColorStop(0,'#0b1020'); g.addColorStop(0.35,'#151d31'); g.addColorStop(1,'#080b14');
  ctx.fillStyle=g; ctx.fillRect(0,fy-2,W,H-fy+2);
  ctx.save();
  ctx.globalAlpha=0.10; ctx.fillStyle=C.ink;
  ctx.beginPath(); ctx.ellipse(W*0.5,fy+H*0.055,W*0.42,H*0.045,0,0,7); ctx.fill();
  ctx.restore();
  }
}

function drawCage(F){
  const {W,H}=V;
  const near=1-clamp(F.distVisual/2,0,1);          // 遠いほど金網がはっきり
  ctx.save();
  ctx.globalAlpha=0.16+0.16*near;
  ctx.strokeStyle=C.cage; ctx.lineWidth=1;
  const top=V.topH*0.75, bot=Math.min(V.groundY,H*1.02);
  const cell=Math.max(30,W*0.115*(0.7+0.6*near));
  const span=bot-top;
  ctx.beginPath();
  for(let x=-span;x<W+span;x+=cell){
    ctx.moveTo(x,top); ctx.lineTo(x+span,bot);
    ctx.moveTo(x+span,top); ctx.lineTo(x,bot);
  }
  ctx.stroke();
  // 支柱
  ctx.globalAlpha=0.20; ctx.lineWidth=3;
  ctx.beginPath();
  for(let i=0;i<=3;i++){ const x=W*(i+0.5)/3; ctx.moveTo(x,top); ctx.lineTo(x,bot); }
  ctx.stroke();
  ctx.restore();

  // 金網際の圧迫表現
  if(F.p.cage>=2){
    ctx.save();
    const a=0.18+0.10*Math.sin(Clock.real/220);
    let g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,`rgba(255,59,48,${a*0.5})`); g.addColorStop(0.5,'rgba(255,59,48,0)');
    g.addColorStop(1,`rgba(255,59,48,${a*0.7})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}

/* ============================================================
   13. 相手の描画  —  セルルック / 面で構成 (§4.1 §4.2)
   ============================================================ */
function drawOpponent(F){
  const e=F.e;
  const dv=F.distVisual;
  const sc=V.scale;
  const bh=V.bh;                              // 身長
  const feet=V.groundY;
  const breath=e.breath*bh*0.006
    + (F.inIntro()? Math.sin(Clock.game/BEAT*Math.PI*2)*bh*0.012 : 0);
  const stagX=e.stagger*Math.sin(Clock.real/45)*bh*0.03;
  const cx=V.W*0.5 + stagX + e.hipRot*bh*0.03;

  V.scale=sc; V.bh=bh; V.cx=cx;
  const headY=feet-bh*0.895+breath;
  const headR=bh*EB.head;
  const shY  =feet-bh*0.774+breath;   // 首が伸びて見えないよう肩をやや上げる
  const hipY =feet-bh*0.520;
  const hw   =bh*EB.shoulder;                  // 肩半幅
  V.faceX=cx; V.faceY=headY; V.bodyY=(shY+hipY)/2; V.shoulderY=shY; V.hw=hw;

  // --- 攻撃の進行度 ---
  const ex=F.exchange;
  let wind=0, strike=0, prog=0, m=null, side=0, arc='straight';
  if(ex && !ex.resolved){
    m=ex.data; arc=m.arc||'straight';
    side = m.side==='R' ? -1 : (m.side==='L' ? 1 : 0);   // 画面上の左右
    const tellEnd=ex.t0+ex.tell;
    prog=clamp((Clock.game-ex.t0)/Math.max(1,ex.impact-ex.t0),0,1);
    if(Clock.game<tellEnd) wind=clamp((Clock.game-ex.t0)/ex.tell,0,1);
    else { wind=1; strike=clamp((Clock.game-tellEnd)/Math.max(1,ex.impact-tellEnd),0,1); }
  }else if(e.state==='recover'){
    // 引き戻しは伸展より速い
    const back=clamp((Clock.game-e.stateT)/260,0,1);
    prog=1-easeOut(back); strike=prog; wind=prog>0?1:0;
    const lm=F.lastMove; if(lm){ m=lm; side=lm.side==='R'?-1:(lm.side==='L'?1:0); arc=lm.arc; }
  }
  const CH=chain(prog);

  ctx.save();

  // --- 影 ---
  ctx.globalAlpha=0.32; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(cx,feet+bh*0.012,bh*0.20,bh*0.028,0,0,7); ctx.fill();
  ctx.globalAlpha=1;

  // --- 半身（オーソドックス）の投影 ---
  // 体幹を約35度ひねると肩線は foreshorten し、前の肩はカメラに近いぶん
  // 外へ大きく、後ろの肩は中央寄りに小さく写る
  const BLADE=EB.blade, NEAR=EB.near, FAR=EB.far;
  const leadScale=EB.leadScale, rearScale=EB.rearScale;

  const lean = (wind*0.5+strike*0.5);
  // 体重移動：打ち出しで前脚へ乗る
  // 文献：打ち出しで体重が前足へ乗る。フックは前足が軸になる
  const wshift = (arc==='hook') ? 0.036 : 0.026;
  const bodyDX = arc==='tackle' ? 0
               : side*bh*0.022*CH.chamber - side*bh*wshift*CH.hip;
  // 文献：アッパーは膝を曲げて脚をバネにし、そこから伸び上がる
  const spring = (arc==='upper') ? (bh*0.050*CH.chamber - bh*0.030*CH.hip) : 0;
  const bodyDY = (arc==='tackle'? bh*0.12*lean : 0) + spring
               + (arc!=='tackle' ? bh*0.010*CH.chamber : 0)
               + bh*EB.crouch;                       // 低い構えの選手はここで沈む
  // 腰の回転。腕より先に回るのが本物の順序（§ 運動連鎖）
  // 後ろ手の技ほど大きく回る＝ストレート最大の予告
  const rearMove = (m && m.hand==='rear');
  // 文献：クロスでは腰が開始位置から約90度回る。パンチ最大の力源
  const rotK = rearMove ? 1 : (arc==='hook' ? 0.85 : 0.42);
  e.hipRot = (side||0)*(0.50*CH.chamber - 1.10*CH.hip)*rotK;
  // 半身のベースに、体幹のひねりを足す（肩は腰に遅れて回る）
  const twL = BLADE*(-1===LEAD?NEAR:FAR)
            + ((side===-1)? (-0.26*CH.chamber+0.34*CH.torso) : (0.12*CH.chamber-0.08*CH.torso));
  const twR = BLADE*( 1===LEAD?NEAR:FAR)
            + ((side=== 1)? (-0.26*CH.chamber+0.34*CH.torso) : (0.12*CH.chamber-0.08*CH.torso));

  // --- 脚（太腿→膝→脛→足を面で構成）---
  if(feet-bh*0.52 < V.H){
    const stepK=e.legStep;
    // 前脚（画面右）は前へ出て手前、後ろ脚（画面左）は引いて奥・やや外
    const legs=[[-1,bh*0.128,-bh*0.010*stepK],[1,bh*0.095,bh*0.02*wind]];
    for(const [sg,spread,off] of legs){
      const isLead = (sg===LEAD);
      const depth  = isLead ? 1.14 : 0.86;        // 手前ほど大きく
      const dy     = isLead ? bh*0.045 : -bh*0.055; // 手前ほど下に接地して見える
      const hipX=cx+sg*bh*0.052*depth, kneeX=cx+sg*spread*0.86+off*0.5;
      const kneeY=feet+dy-bh*0.255*depth, ankX=cx+sg*spread+off, ankY=feet+dy-bh*0.012;
      const tw=bh*0.050*depth, kw=bh*0.040*depth, aw=bh*0.024*depth;
      ctx.beginPath();
      ctx.moveTo(hipX-tw,hipY+bodyDY);
      ctx.lineTo(hipX+tw,hipY+bodyDY);
      ctx.quadraticCurveTo(kneeX+kw,(hipY+kneeY)/2,kneeX+kw*0.9,kneeY);
      ctx.lineTo(ankX+aw,ankY);
      ctx.lineTo(ankX-aw,ankY);
      ctx.quadraticCurveTo(kneeX-kw,(hipY+kneeY)/2,hipX-tw,hipY+bodyDY);
      ctx.closePath();
      ctx.fillStyle=C.bg2; ctx.fill();
      ctx.strokeStyle='rgba(10,13,22,0.7)'; ctx.lineWidth=Math.max(1,bh*0.005); ctx.stroke();
      // 脛のハイライト面
      ctx.fillStyle=isLead?'rgba(232,226,212,0.12)':'rgba(0,0,0,0.20)';
      ctx.beginPath();
      ctx.moveTo(kneeX-bh*0.030,kneeY); ctx.lineTo(kneeX-bh*0.006,kneeY);
      ctx.lineTo(ankX-bh*0.004,ankY); ctx.lineTo(ankX-bh*0.020,ankY);
      ctx.closePath(); ctx.fill();
      // 足。後ろ足は踵が浮き、打ち出しで返る
      // 文献：母趾球で押し込み、踵が外へ回る。これが運動連鎖の起点＝最も早い予告。
      // フックでは前足が軸になって回るので、前後が入れ替わる
      const pivotLead = (arc==='hook');
      const isPivot = pivotLead ? isLead : !isLead;
      const pv = isPivot ? CH.foot*(rearMove||pivotLead?1:0.5) : 0;
      const heel = bh*0.046*pv;                       // 踵が浮く
      const toe  = sg*(0.30+1.05*pv);                 // 爪先を軸に外へ回る
      ctx.fillStyle='#0f1424';
      ctx.beginPath();
      ctx.ellipse(ankX+sg*bh*0.014*depth, feet+dy-heel,
                  bh*0.048*depth*(1-0.22*pv), bh*0.016*depth*(1+0.5*pv),
                  isLead&&!pivotLead?0:toe, 0,7); ctx.fill();
    }
  }

  // --- キック軌道 ---
  if(arc==='kick' && strike>0){
    const kx=cx+side*bh*0.30*(1-strike)+side*bh*0.02;
    const ky=lerp(hipY, m.ja==='ハイキック'?headY:V.bodyY, easeOut(strike));
    ctx.strokeStyle=C.bg2; ctx.lineWidth=bh*0.062; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(cx+side*bh*0.045,hipY); 
    ctx.quadraticCurveTo(cx+side*bh*0.22,hipY-bh*0.02,kx,ky); ctx.stroke();
    ctx.fillStyle=C.bg2;
    ctx.beginPath(); ctx.arc(kx,ky,bh*0.045,0,7); ctx.fill();
  }

  // --- 胴（面で構成） ---
  const sx=cx+bodyDX, sy=shY+bodyDY, hy=hipY+bodyDY;
  // 頭の位置。打つ瞬間は顎を引き、前肩の内側へ入れる
  const hdX = sx + LEAD*headR*(0.10+0.07*CH.torso) + e.gaze.x*headR*0.10;
  const hdY = headY + headR*(0.06+0.10*CH.torso) + bodyDY*0.6;
  // 首（頭にぶら下げ、肩へ接続する）
  ctx.fillStyle=EC.skinShade;
  ctx.beginPath();
  ctx.moveTo(hdX-headR*0.34,hdY+headR*0.62); ctx.lineTo(hdX+headR*0.34,hdY+headR*0.62);
  ctx.lineTo(sx+headR*0.46,sy+bh*0.006); ctx.lineTo(sx-headR*0.46,sy+bh*0.006);
  ctx.closePath(); ctx.fill();
  // 顎の落ち影
  ctx.fillStyle='rgba(0,0,0,0.34)';
  ctx.beginPath();
  ctx.moveTo(hdX-headR*0.34,hdY+headR*0.62); ctx.lineTo(hdX+headR*0.34,hdY+headR*0.62);
  ctx.lineTo(hdX+headR*0.26,hdY+headR*0.96); ctx.lineTo(hdX-headR*0.26,hdY+headR*0.96);
  ctx.closePath(); ctx.fill();

  const hwL=hw*twL, hwR=hw*twR;
  const hipDX=e.hipRot*bh*0.020;
  const torso=new Path2D();
  torso.moveTo(sx-hwL,sy+bh*0.020);
  torso.quadraticCurveTo(sx-hwL*0.92,(sy+hy)/2,sx-hw*0.60+hipDX,hy);
  torso.lineTo(sx+hw*0.60+hipDX,hy);
  torso.quadraticCurveTo(sx+hwR*0.92,(sy+hy)/2,sx+hwR,sy+bh*0.020);
  // 僧帽筋のスロープ
  torso.quadraticCurveTo(sx+hwR*0.52,sy-bh*0.030,sx+headR*0.50,sy-bh*0.040);
  torso.lineTo(sx-headR*0.50,sy-bh*0.040);
  torso.quadraticCurveTo(sx-hwL*0.52,sy-bh*0.030,sx-hwL,sy+bh*0.020);
  torso.closePath();
  ctx.fillStyle=C.bg2; ctx.fill(torso);
  // 明面（リングライト側）
  ctx.save(); ctx.clip(torso);
  ctx.fillStyle='rgba(232,226,212,0.09)';
  ctx.fillRect(sx-hw,sy-bh*0.05,hw*0.85,bh*0.4);
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.fillRect(sx+hw*0.25,sy-bh*0.05,hw,bh*0.4);
  ctx.restore();
  // 抑制した輪郭線
  ctx.strokeStyle='rgba(10,13,22,0.85)'; ctx.lineWidth=Math.max(1,bh*0.006);
  ctx.stroke(torso);
  // ショーツのアクセント
  ctx.fillStyle=EC.trunks; ctx.globalAlpha=0.85;
  ctx.fillRect(sx-hw*0.64+hipDX,hy-bh*0.012,hw*1.28,bh*0.026);
  ctx.globalAlpha=1;

  // --- 腕 ---
  const armOpt={cx:sx,shY:sy,headY,headR,bh,hw,side,wind,strike,arc,m,prog,
                twL,twR,leadScale,rearScale};
  drawEnemyArm(F,-1,armOpt);
  drawEnemyArm(F,+1,armOpt);

  // --- 頭 ---
  drawEnemyHead(F,{cx:hdX, headY:hdY, headR,bh,wind,strike,arc});

  // 手前へ来た拳は顔より前
  if(side!==0 && CH.arm>0.30 && arc!=='kick' && arc!=='tackle') drawEnemyArm(F,side,armOpt);

  ctx.restore();
}

/* ============================================================
   打撃フォーム  —  実際の運動連鎖を再現する
   ------------------------------------------------------------
   本物の打撃は「腕から」始まらない。地面から順に力が伝わる。

     後ろ足の踵が返る → 腰が回る → 体幹が回る → 肩が出る → 腕は最後

   腕は上腕と前腕の2本の骨で、長さは変わらない。
   拳の位置を決めてから肘を逆算する（2関節IK）ので、
   ストレートでは肘が拳の真後ろを追い、フックでは肘が先行する。

   奥行き(z)を持たせ、カメラ軸（画面中央）へ向かう透視で投影する。
   拳が近づくほど中央へ寄って大きくなるのは、この投影の結果であって
   位置を直接描いているのではない。
   ============================================================ */
const ARM = {
  upper:0.172, fore:0.185,      // 骨の長さ（身長比）。合計 0.357 ＝ 実際のリーチ
  camD :0.44,                   // カメラから肩までの距離（身長比）
};

// 運動連鎖の時間差。a = 起こり開始(0) → 接触(1)
//
// 文献:
//  ・近位から遠位へ、体節が順に加速と制動を繰り返して末端速度を上げる
//    (proximal-to-distal sequencing)
//  ・クロスは「腰が先導し、肩が続き、腕が遅れ、拳が最後に弾ける」
//  ・腕そのものの伸展は 60〜100ms（接触時間は 10〜20ms）
//    → 右ストレート全体 480ms のうち、腕は最後の約 22%（106ms）
function chain(a){
  const sm=(x,s,e)=>clamp((x-s)/(e-s),0,1);
  return {
    chamber: 1-sm(a,0.00,0.40),   // 引き手（先に完了する）
    foot   : sm(a,0.34,0.66),     // 後ろ足の踵が外へ返る
    hip    : sm(a,0.46,0.84),     // 腰が回る（最大の力源。約90度）
    torso  : sm(a,0.56,0.90),     // 体幹が続く
    shldr  : sm(a,0.66,0.94),     // 肩が出る
    arm    : sm(a,0.78,1.00),     // 腕は最後（約106ms）
  };
}

// 肘が直角を保つときの、肩から拳までの距離。
// フックとアッパーは肘角90度を保つのが正しいフォームなので、この距離が一定になる
const R90 = Math.sqrt(0.172*0.172 + 0.185*0.185);

// カメラ軸（画面中央）へ向かう透視投影
function projArm(ax,ay,dx,dy,dz,bh){
  const k=clamp(ARM.camD/Math.max(0.085, ARM.camD-dz), 0.70, 5.0);
  const vx=V.W*0.5, vy=V.H*0.44;
  const x0=ax+dx*bh, y0=ay+dy*bh;
  return { x:vx+(x0-vx)*k, y:vy+(y0-vy)*k, k };
}

// 2関節IK：肩から拳までの距離に合わせて肘の位置を解く。
// hint は肘をどちら側へ逃がすか（ストレートは下、フックは上）
function solveElbow(px,py,pz,hx,hy,hz){
  const L1=ARM.upper, L2=ARM.fore;
  let d=Math.hypot(px,py,pz);
  const dmax=L1+L2-0.004;
  if(d>dmax){ const k=dmax/d; px*=k; py*=k; pz*=k; d=dmax; }
  if(d<0.02) d=0.02;
  const ux=px/d, uy=py/d, uz=pz/d;
  const a=(L1*L1-L2*L2+d*d)/(2*d);
  const h=Math.sqrt(Math.max(0,L1*L1-a*a));
  // hint から、肩→拳の軸に垂直な成分を作る
  let hd=hx*ux+hy*uy+hz*uz;
  let nx=hx-ux*hd, ny=hy-uy*hd, nz=hz-uz*hd;
  let nl=Math.hypot(nx,ny,nz);
  if(nl<1e-4){ nx=0; ny=1; nz=0; nl=1; }
  nx/=nl; ny/=nl; nz/=nl;
  return { ex:ux*a+nx*h, ey:uy*a+ny*h, ez:uz*a+nz*h, fx:px, fy:py, fz:pz };
}

// 技ごとの拳の軌道（肩を原点とした身長比の3D座標）と、肘の逃がし方
function fistPath(arc, s, u, lead){
  // u: 腕の伸展 0→1
  const e=easeOut(u);
  if(arc==='hook'){
    // フック：肘は90度を保つ。開くと「遅い振り回し」になる。
    // 拳・肘・肩が水平に一直線に並び、前腕は床と平行に回る。
    const th=(-0.08+1.12*e)*Math.PI*0.5;
    return { p:[ s*R90*Math.cos(th), -0.030, R90*Math.sin(th)*1.30 ],
             hint:[ s*0.85, -0.28, -0.60 ] };        // 肘は肩の高さで外へ、拳より先行
  }
  if(arc==='upper'){
    // アッパー：肘は90度のまま体側に近く、脚のバネと腰で下から突き上げる。
    // 肩が主働で、矢状面の円軌道を描く。
    const ph=(0.62+0.96*e);                          // 下から上への回転
    return { p:[ s*(0.052-0.026*e),
                 R90*Math.cos(ph)*0.92,
                 R90*Math.sin(ph)*0.86 ],
             hint:[ -s*0.30, 0.85, 0.45 ] };         // 肘は体側の前で下
  }
  // ストレート／ジャブ：肘はピストンのように矢状面で伸展し、回旋はほとんど無い。
  // 拳は顎の横から標的まで最短距離で進む。
  const reach = lead ? 0.300 : 0.335;              // 肩からの到達距離（骨の長さ以内）
  return { p:[ s*(0.040-0.150*e), -0.048-0.030*e, -0.03+ (reach+0.03)*e ],
           hint:[ 0, 1.00, -0.35 ] };                // 肘は下がったまま拳の真後ろ
}

// s: -1 = 画面左（相手の右手） / +1 = 画面右（相手の左手）
function drawEnemyArm(F,s,o){
  const {cx,shY,headY,headR,bh,side,arc,m}=o;
  const wind=o.wind, strike=o.strike, a=o.prog;         // a: 起こり(0)→接触(1)
  const isLead=(s===LEAD);
  const CH=chain(a);
  const punching=(side===s)&&arc!=='kick'&&arc!=='tackle'&&a>0;

  // 肩：体幹の回転に押されて前へ出る（＝腕より先に動く）
  const twist = punching ? (-0.26*CH.chamber + 0.34*CH.shldr)
                         : ((s===side)?0:(0.10*CH.torso));
  const hw  = o.hw*((s===-1?o.twL:o.twR)+twist);
  const dep = isLead ? o.leadScale : o.rearScale;
  const shx = cx+s*hw*0.92;
  // 文献：ジャブでは前肩が上がって顎を守る／クロスでは接触時に後ろ肩が顎に密着する
  const guardShrug = punching ? bh*0.052*CH.arm : 0;
  const shy = shY+bh*0.012+(isLead?bh*0.014:-bh*0.016)
            + (punching? bh*0.012*CH.chamber - guardShrug : 0);
  if(s===LEAD) V.shL={x:shx,y:shy}; else V.shR={x:shx,y:shy};

  // ---- 拳の3D位置を決める ----
  let P;
  if(punching){
    // 引き手 → 伸展。腕は運動連鎖の最後に動く
    const g=fistPath(arc, s, CH.arm, isLead);
    const gh=(EB.guardHigh-0.62)*0.10;
    const rest= isLead ? [ -s*0.014, -0.038+gh, 0.052 ]     // 前手：やや前、頬の高さ
                       : [ -s*0.030, -0.098+gh, 0.016 ];    // 後ろ手：頬の横
    const ch=CH.chamber;
    // 溜め：拳を顎の横へ引く（奥へ引くので小さく見える）
    const chP=[ -s*0.004, -0.062+gh, -0.032 ];
    const base=[ lerp(rest[0],chP[0],ch), lerp(rest[1],chP[1],ch), lerp(rest[2],chP[2],ch) ];
    const u=CH.arm;
    let px=lerp(base[0],g.p[0],u), py=lerp(base[1],g.p[1],u), pz=lerp(base[2],g.p[2],u);
    // 打撃は標的（＝カメラ＝こちらの顔）へ収束する。
    // 肩の延長線ではなく、狙点へ向かって伸びるのが正しい
    if(arc!=='hook'){
      const aimX=(V.W*0.5-shx)/bh, aimY=(V.H*0.44-shy)/bh;
      const w=easeOut(u)*0.80;
      px=lerp(px,aimX,w); py=lerp(py,aimY,w);
    }
    P={ p:[px,py,pz], hint:g.hint };
  }else{
    // 構え：前手は前へ低く、後ろ手は顎の横
    const gh=(EB.guardHigh-0.62)*0.10;
    P= isLead
      ? { p:[ -s*0.014, -0.038+gh, 0.052 ], hint:[ 0, 1.00, 0.18 ] }
      : { p:[ -s*0.030, -0.098+gh, 0.016 ], hint:[ 0, 0.35, 1.00 ] };
    // 相手が打っている間、反対の手は顎を締める
    if(side===s*-1 && a>0){
      P.p[1]-=0.022*CH.torso; P.p[0]-=s*0.010*CH.torso;
    }
  }

  // ---- 骨の長さを保ったまま肘を解く ----
  const k=solveElbow(P.p[0],P.p[1],P.p[2],P.hint[0],P.hint[1],P.hint[2]);
  const E=projArm(shx,shy,k.ex,k.ey,k.ez,bh);
  const Fp=projArm(shx,shy,k.fx,k.fy,k.fz,bh);
  const gr=bh*0.048*(0.9+0.1*dep)*Math.min(Fp.k,4.6);
  if(punching && CH.arm>0.25) V.fist={x:Fp.x,y:Fp.y,r:gr,active:true,s};

  // 拳の回転（インパクトへ向けて手の甲が下を向く）
  // 文献：ストレートは最後の1/3で前腕が回内し、接触時に掌が下を向く。
  // フックは掌が自分を向いたまま（前腕は床と平行）
  const pron = punching
    ? (arc==='hook' ? 0.12 : easeOut(clamp((CH.arm-0.62)/0.38,0,1)))
    : 0;

  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';

  // ---- 上腕：肩 → 肘 ----
  const dw=0.88+0.12*dep;
  const w1a=bh*0.039*dw, w1b=bh*0.034*dw*Math.min(E.k,2.2);
  tube(shx,shy,w1a, E.x,E.y,w1b, C.bg2, bh);
  // ---- 前腕：肘 → 拳 ----
  const w2a=bh*0.033*dw*Math.min(E.k,2.2), w2b=bh*0.028*dw*Math.min(Fp.k,3.0);
  tube(E.x,E.y,w2a, Fp.x,Fp.y,w2b, C.bg2, bh);
  // 肘の丸み
  ctx.fillStyle=C.bg2;
  ctx.beginPath(); ctx.arc(E.x,E.y,w1b*0.52,0,7); ctx.fill();

  // ---- グローブ ----
  drawEnemyGlove(Fp.x,Fp.y,gr,pron,s,bh);
  ctx.restore();
}

// 先細りの筒。手前ほど太く、奥ほど細く見える
function tube(x1,y1,w1,x2,y2,w2,fill,bh){
  const ang=Math.atan2(y2-y1,x2-x1), nx=-Math.sin(ang), ny=Math.cos(ang);
  const pth=new Path2D();
  pth.moveTo(x1+nx*w1,y1+ny*w1);
  pth.lineTo(x2+nx*w2,y2+ny*w2);
  pth.arc(x2,y2,w2,ang+Math.PI/2,ang-Math.PI/2,true);
  pth.lineTo(x1-nx*w1,y1-ny*w1);
  pth.arc(x1,y1,w1,ang-Math.PI/2,ang+Math.PI/2,true);
  pth.closePath();
  ctx.fillStyle=fill; ctx.fill(pth);
  ctx.strokeStyle='rgba(10,13,22,0.72)'; ctx.lineWidth=Math.max(1,bh*0.005); ctx.stroke(pth);
  ctx.save(); ctx.clip(pth);
  ctx.fillStyle='rgba(232,226,212,0.09)';
  ctx.fillRect(Math.min(x1,x2)-w1, Math.min(y1,y2)-w1, Math.abs(x2-x1)+w1*2, (Math.abs(y2-y1)+w1*2)*0.45);
  ctx.restore();
}

function drawEnemyGlove(gx,gy,gr,pron,s,bh){
  ctx.save();
  ctx.translate(gx,gy); ctx.rotate(s*pron*1.45);
  ctx.beginPath(); ctx.arc(0,0,gr,0,7);
  ctx.fillStyle=EC.glove; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,gr,0,7); ctx.clip();
  ctx.beginPath(); ctx.arc(gr*0.34,gr*0.30,gr*0.94,0,7);
  ctx.fillStyle=EC.gloveShade; ctx.globalAlpha=0.6; ctx.fill(); ctx.globalAlpha=1;
  // ナックル面：拳の向きが分かる
  ctx.fillStyle='rgba(255,255,255,0.16)';
  ctx.beginPath(); ctx.ellipse(-gr*0.10,-gr*0.30,gr*0.66,gr*0.34,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(90,20,16,0.22)'; ctx.lineWidth=Math.max(1,gr*0.030);
  ctx.beginPath();
  ctx.moveTo(-gr*0.66,gr*0.42);
  ctx.quadraticCurveTo(0,gr*0.58,gr*0.66,gr*0.40); ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.arc(-gr*0.34,-gr*0.36,gr*0.26,0,7);
  ctx.fillStyle='rgba(255,255,255,0.26)'; ctx.fill();
  ctx.strokeStyle='rgba(10,13,22,0.8)'; ctx.lineWidth=Math.max(1.2,bh*0.007);
  ctx.beginPath(); ctx.arc(0,0,gr,0,7); ctx.stroke();
  ctx.restore();
}

function drawEnemyHead(F,o){
  const {cx,headY,headR,bh,wind,strike,arc}=o;
  const e=F.e, R=headR, FA=(F.ftr&&F.ftr.face)||{eye:1,brow:0,jaw:1,hairDip:0.66};
  const shade=e.stagger, fat=e.fatigue;

  ctx.save();

  // ---- シルエット：頬骨で張り、顎へ向けて締まる (§4.2 面で認識させる) ----
  const head=new Path2D();
  head.moveTo(cx-R*0.86,headY-R*0.34);
  head.quadraticCurveTo(cx-R*0.92,headY-R*1.00,cx,headY-R*1.04);   // 頭頂
  head.quadraticCurveTo(cx+R*0.92,headY-R*1.00,cx+R*0.86,headY-R*0.34);
  head.lineTo(cx+R*0.82,headY+R*0.02);                              // 頬骨
  head.quadraticCurveTo(cx+R*0.66*FA.jaw,headY+R*0.50,cx+R*0.27*FA.jaw,headY+R*0.88); // 顎のライン
  head.quadraticCurveTo(cx,headY+R*1.00,cx-R*0.27*FA.jaw,headY+R*0.88);    // 顎先
  head.quadraticCurveTo(cx-R*0.66*FA.jaw,headY+R*0.50,cx-R*0.82,headY+R*0.02);
  head.closePath();
  ctx.fillStyle=EC.skin; ctx.fill(head);

  ctx.save(); ctx.clip(head);

  // ---- 面 ----
  // 影面：右側。境界を斜めにして彫刻的に
  ctx.fillStyle=EC.skinShade; ctx.globalAlpha=0.62;
  ctx.beginPath();
  ctx.moveTo(cx+R*0.26,headY-R*1.2); ctx.lineTo(cx+R*1.3,headY-R*1.2);
  ctx.lineTo(cx+R*1.3,headY+R*1.3);  ctx.lineTo(cx+R*0.40,headY+R*1.3);
  ctx.closePath(); ctx.fill();
  // 額の明面
  ctx.globalAlpha=0.34; ctx.fillStyle=EC.skinLit;
  ctx.beginPath();
  ctx.moveTo(cx-R*0.62,headY-R*0.80);
  ctx.quadraticCurveTo(cx-R*0.10,headY-R*0.92,cx+R*0.16,headY-R*0.74);
  ctx.lineTo(cx+R*0.10,headY-R*0.50);
  ctx.quadraticCurveTo(cx-R*0.20,headY-R*0.58,cx-R*0.60,headY-R*0.48);
  ctx.closePath(); ctx.fill();
  // 頬骨の明面：目の下を斜めに走らせる
  ctx.globalAlpha=0.40;
  ctx.beginPath();
  ctx.moveTo(cx-R*0.78,headY-R*0.10);
  ctx.quadraticCurveTo(cx-R*0.42,headY-R*0.20,cx-R*0.14,headY-R*0.02);
  ctx.quadraticCurveTo(cx-R*0.40,headY+R*0.28,cx-R*0.70,headY+R*0.22);
  ctx.closePath(); ctx.fill();
  // 頬のくぼみ（影側）
  ctx.globalAlpha=0.30; ctx.fillStyle=EC.skinShade;
  ctx.beginPath();
  ctx.moveTo(cx+R*0.44,headY+R*0.06); ctx.lineTo(cx+R*0.80,headY+R*0.02);
  ctx.lineTo(cx+R*0.60,headY+R*0.56); ctx.lineTo(cx+R*0.34,headY+R*0.44);
  ctx.closePath(); ctx.fill();
  // 顎下の影
  ctx.globalAlpha=0.34;
  ctx.beginPath();
  ctx.ellipse(cx,headY+R*0.90,R*0.46,R*0.16,0,0,7); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();

  // 輪郭は抑制する (§4.1)
  ctx.strokeStyle='rgba(14,17,26,0.72)'; ctx.lineWidth=Math.max(1,bh*0.0045);
  ctx.stroke(head);

  // ---- 髪：生え際を作り、面で光らせる ----
  const hair=new Path2D();
  hair.moveTo(cx-R*0.88,headY-R*0.40);
  hair.quadraticCurveTo(cx-R*0.94,headY-R*1.02,cx,headY-R*1.06);
  hair.quadraticCurveTo(cx+R*0.94,headY-R*1.02,cx+R*0.88,headY-R*0.40);
  hair.lineTo(cx+R*0.72,headY-R*0.52);
  hair.quadraticCurveTo(cx+R*0.56,headY-R*0.80,cx+R*0.20,headY-R*0.74);
  hair.quadraticCurveTo(cx+R*0.03,headY-R*0.70,cx,headY-R*FA.hairDip); // 生え際の深さは選手ごと
  hair.quadraticCurveTo(cx-R*0.03,headY-R*0.70,cx-R*0.20,headY-R*0.74);
  hair.quadraticCurveTo(cx-R*0.56,headY-R*0.80,cx-R*0.72,headY-R*0.52);
  hair.closePath();
  ctx.fillStyle=EC.hair; ctx.fill(hair);
  ctx.save(); ctx.clip(hair);
  // 面のハイライト：頭の丸みに沿わせて、貼り付いて見えないように
  ctx.fillStyle='rgba(152,172,212,0.16)';
  ctx.beginPath();
  ctx.moveTo(cx-R*0.80,headY-R*0.56);
  ctx.quadraticCurveTo(cx-R*0.60,headY-R*0.98,cx-R*0.10,headY-R*1.02);
  ctx.quadraticCurveTo(cx-R*0.48,headY-R*0.84,cx-R*0.62,headY-R*0.52);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.26)';                // 影側は締める
  ctx.beginPath();
  ctx.moveTo(cx+R*0.24,headY-R*1.2); ctx.lineTo(cx+R*1.3,headY-R*1.2);
  ctx.lineTo(cx+R*1.3,headY+R*0.2);  ctx.lineTo(cx+R*0.40,headY-R*0.5);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // ---- 眉：太い帯をやめ、внутрь厚く外へ細く ----
  const brow = FA.brow + wind*0.35 + shade*0.45 + fat*0.18;   // 選手ごとの既定＋集中・被弾・疲労
  const byy  = headY-R*0.50;
  ctx.fillStyle=EC.brow;
  for(const sgn of [-1,1]){
    const bx=cx+sgn*R*0.41;
    ctx.beginPath();
    ctx.moveTo(bx-sgn*R*0.28, byy+brow*R*0.11);                      // 眉頭（太い）
    ctx.quadraticCurveTo(bx+sgn*R*0.02, byy-R*0.09-brow*R*0.03,
                         bx+sgn*R*0.33, byy+R*0.02);                 // 眉尻（細く抜ける）
    ctx.quadraticCurveTo(bx+sgn*R*0.04, byy+R*0.005-brow*R*0.03,
                         bx-sgn*R*0.28, byy+R*0.055+brow*R*0.11);
    ctx.closePath(); ctx.fill();
  }

  // ---- 目：アーモンド型。白目を減らし、上瞼のラインで締める ----
  const gx=e.gaze.x, gy=e.gaze.y;
  const eyeY=headY-R*0.16, eyeDX=R*0.40, eyeW=R*0.255*FA.eye, eyeH=R*0.128*FA.eye;
  const blink=(Math.sin(Clock.game/2200)>0.982)?0.10:1;
  const open=blink*(1-clamp(shade*0.45+fat*0.25,0,0.5));
  for(const sgn of [-1,1]){
    const ex=cx+sgn*eyeDX;
    // 眼形
    const eye=new Path2D();
    eye.moveTo(ex-sgn*eyeW, eyeY+eyeH*0.10);
    eye.quadraticCurveTo(ex-sgn*eyeW*0.30, eyeY-eyeH*1.05*open, ex+sgn*eyeW*0.62, eyeY-eyeH*0.62*open);
    eye.quadraticCurveTo(ex+sgn*eyeW, eyeY-eyeH*0.30*open, ex+sgn*eyeW, eyeY+eyeH*0.02);
    eye.quadraticCurveTo(ex+sgn*eyeW*0.34, eyeY+eyeH*0.98*open, ex-sgn*eyeW, eyeY+eyeH*0.10);
    eye.closePath();
    ctx.fillStyle='#e9e2d6'; ctx.fill(eye);
    ctx.save(); ctx.clip(eye);
    // 虹彩
    const px=ex+gx*eyeW*0.34, py=eyeY+gy*eyeH*0.34+eyeH*0.06;
    ctx.fillStyle='#3d4a5c';
    ctx.beginPath(); ctx.arc(px,py,eyeH*1.10,0,7); ctx.fill();
    ctx.fillStyle='#14171f';
    ctx.beginPath(); ctx.arc(px,py,eyeH*0.52,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(px-eyeH*0.42,py-eyeH*0.46,eyeH*0.26,0,7); ctx.fill();
    // 上瞼の落ち影
    ctx.fillStyle='rgba(58,40,30,0.34)';
    ctx.fillRect(ex-eyeW*1.2, eyeY-eyeH*2.4, eyeW*2.4, eyeH*1.85);
    ctx.restore();
    // 上瞼のライン（内が太く外へ抜ける）
    ctx.strokeStyle='#23252f'; ctx.lineCap='round';
    ctx.lineWidth=Math.max(1.1,R*0.055);
    ctx.beginPath();
    ctx.moveTo(ex-sgn*eyeW*0.98, eyeY+eyeH*0.02);
    ctx.quadraticCurveTo(ex-sgn*eyeW*0.20, eyeY-eyeH*1.20*open, ex+sgn*eyeW*0.98, eyeY-eyeH*0.34*open);
    ctx.stroke();
    // 二重の線
    ctx.strokeStyle='rgba(120,86,66,0.40)'; ctx.lineWidth=Math.max(1,R*0.022);
    ctx.beginPath();
    ctx.moveTo(ex-sgn*eyeW*0.72, eyeY-eyeH*0.72);
    ctx.quadraticCurveTo(ex, eyeY-eyeH*1.70*open, ex+sgn*eyeW*0.86, eyeY-eyeH*0.86*open);
    ctx.stroke();
  }

  // ---- 鼻：影の塊ではなく、稜線の明面と小さな落ち影で立たせる ----
  ctx.fillStyle='rgba(240,206,174,0.34)';
  ctx.beginPath();
  ctx.moveTo(cx-R*0.07,headY-R*0.34); ctx.lineTo(cx+R*0.02,headY-R*0.34);
  ctx.lineTo(cx+R*0.06,headY+R*0.16); ctx.lineTo(cx-R*0.11,headY+R*0.16);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(120,86,66,0.34)';
  ctx.beginPath();
  ctx.moveTo(cx+R*0.06,headY-R*0.10); ctx.lineTo(cx+R*0.17,headY+R*0.20);
  ctx.lineTo(cx-R*0.02,headY+R*0.22); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(70,46,34,0.42)';
  ctx.beginPath(); ctx.ellipse(cx-R*0.10,headY+R*0.20,R*0.035,R*0.022,0.3,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+R*0.09,headY+R*0.20,R*0.035,R*0.022,-0.3,0,7); ctx.fill();

  // ---- 口：下向きの塊をやめ、結んだ線にする ----
  const mo=clamp(wind*0.35+fat*0.50+shade*0.75,0,1);
  const my=headY+R*0.52;
  if(mo<0.18){
    ctx.strokeStyle='rgba(96,58,46,0.75)'; ctx.lineCap='round';
    ctx.lineWidth=Math.max(1.2,R*0.045);
    ctx.beginPath();
    ctx.moveTo(cx-R*0.19,my-R*0.01);
    ctx.quadraticCurveTo(cx,my+R*0.035,cx+R*0.19,my-R*0.01);
    ctx.stroke();
  }else{
    ctx.fillStyle='#2c1712';
    ctx.beginPath();
    ctx.ellipse(cx,my+R*0.02,R*0.17+R*0.04*mo,R*0.03+R*0.13*mo,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(232,226,212,0.55)';            // マウスピース
    ctx.beginPath();
    ctx.ellipse(cx,my-R*0.02,R*0.145,R*0.028,0,0,7); ctx.fill();
  }
  // 下唇の明面と顎の割れ
  ctx.fillStyle='rgba(240,206,174,0.26)';
  ctx.beginPath(); ctx.ellipse(cx,my+R*0.15,R*0.16,R*0.055,0,0,7); ctx.fill();
  ctx.fillStyle='rgba(120,86,66,0.22)';
  ctx.beginPath(); ctx.ellipse(cx,my+R*0.30,R*0.10,R*0.045,0,0,7); ctx.fill();

  // ---- 汗（粒子として抽象化 §4.1）----
  if(fat>0.4){
    ctx.fillStyle='rgba(210,230,255,0.5)';
    for(let i=0;i<3;i++){
      const t=(Clock.real/700+i*0.33)%1;
      ctx.globalAlpha=0.5*(1-t);
      ctx.fillRect(cx-R*0.7+i*R*0.6, headY-R*0.6+t*R*1.6, R*0.05,R*0.16);
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

/* ============================================================
   14. 一人称の自分の腕 (§4 §4.1)
   長押し・スライド・タップに実時間で追従する
   ============================================================ */
const Arms = {
  L:{x:0,y:0,r:0,init:false}, R:{x:0,y:0,r:0,init:false},
  // 左＝リード：顔より前へ差し出しているのでカメラから遠い＝小さく、高く、中央寄り。
  // 右＝リア ：顎の横にあるのでカメラに近い＝大きく、低く、外側。
  base(side){
    return side==='L'
      ? {x:V.W*0.5-V.W*0.262, y:V.H*0.912, r:V.W*0.140}
      : {x:V.W*0.5+V.W*0.318, y:V.H*0.984, r:V.W*0.184};
  },
  update(F){
    const p=F.p, dt=Clock.realDt;
    for(const side of ['L','R']){
      const a=this[side], b=this.base(side);
      if(!a.init){ a.x=b.x; a.y=b.y; a.r=b.r; a.init=true; }
      let tx=b.x, ty=b.y, tr=b.r, rate=13;

      const f=Input.finger(side);
      const holding=Input.isHolding(side);

      if(holding||p.guard===side){
        // ガード：肘より先を画面中央へ入れ、視界を狭める (§4)
        const s=side==='L'?-1:1;
        const lead=(side==='L');
        tx=V.W*0.5+s*V.W*(lead?0.170:0.205);
        ty=V.H*(lead?0.585:0.630);
        tr=V.W*(lead?0.150:0.176);
        if(f){ ty=clamp(f.y-V.H*0.085, V.H*(lead?0.44:0.47), V.H*0.80); tx=lerp(tx,f.x,0.20); }
        rate=22;                      // 入力への即時追従
      }else if(f){
        // 指に軽く追従（構えの微調整）
        tx=lerp(b.x,f.x,0.30); ty=lerp(b.y,f.y+V.H*0.10,0.32); rate=18;
      }

      // ---- 攻撃中の腕 (§4 §14) ----
      const act=p.action;
      const s=side==='L'?-1:1;
      if(act && act.side===side){
        const tt=Clock.game-act.t0;
        const out=clamp(tt/act.dur,0,1);
        const back=clamp((tt-act.dur)/Math.max(1,act.recover),0,1);
        // 溜め(0-18%) → 伸展 → 接触 → 引き戻し
        const u = back>0 ? 1-easeIn(back)
                         : (out<0.18 ? 0 : easeOut((out-0.18)/0.82));
        const chamber = back>0 ? 0 : (out<0.18 ? Math.sin(out/0.18*Math.PI) : 0);

        // 発射点は顎の横。そこから相手へ伸ばす
        const lx = V.W*0.5 + s*V.W*(act.m.arc==='hook'?0.50:0.165);
        const ly = V.H*(act.m.arc==='hook'?0.615:0.665);
        const fx_= V.faceX + s*V.bh*0.010;
        const fy_= (act.m.arc==='kick'||act.m.arc==='upper') ? V.bodyY : V.faceY;
        // 構え → 顎の横 → 相手 の2次ベジェ
        const p0x=b.x - s*V.W*0.02*chamber, p0y=b.y + V.H*0.012*chamber;
        tx=(1-u)*(1-u)*p0x + 2*(1-u)*u*lx + u*u*fx_;
        ty=(1-u)*(1-u)*p0y + 2*(1-u)*u*ly + u*u*fy_;
        // 遠ざかるほど小さくなる。溜めの一瞬だけカメラへ寄って大きくなる
        tr = lerp(b.r*(1+0.12*chamber), V.bh*0.052, easeOut(u));
        rate=42;
      }else if(act){
        // 打っていない側の手は動かさず、わずかに締めて顎を守る
        tx=b.x+s*V.W*0.012; ty=b.y-V.H*0.028; tr=b.r; rate=16;
      }
      a.x=damp(a.x,tx,rate,dt); a.y=damp(a.y,ty,rate,dt); a.r=damp(a.r,tr,rate,dt);
    }
  },
  draw(F){
    const p=F.p;
    // 被弾時は腕とカメラを別々に揺らす (§4)
    const sh=p.shake, t=Clock.real;
    const ox=sh*Math.sin(t/23)*V.W*0.02, oy=sh*Math.cos(t/19)*V.H*0.008;
    for(const side of ['R','L']){
      const a=this[side];
      drawPlayerGlove(a.x+ox,a.y+oy,a.r,side, p.guard===side||Input.isHolding(side));
    }
  },
};

function drawPlayerGlove(x,y,r,side,guarding){
  const s=side==='L'?-1:1;
  const OUT='rgba(8,11,19,0.85)', LW=Math.max(1.2,r*0.042);
  ctx.save();
  ctx.lineJoin='round';

  // ---- 前腕（画面下から伸びる。手前ほど太い）----
  const wx=x + s*r*0.08, wy=y + r*0.72;
  const bx=lerp(x, V.W*0.5+s*V.W*0.40, 0.55), byy=V.H + r*0.9;
  const baseR=V.W*(side==='L'?0.140:0.184);
  const fore=new Path2D();
  fore.moveTo(wx - r*0.46, wy);
  fore.lineTo(wx + r*0.46, wy);
  // 前腕は肩側（画面下＝カメラに近い）が太く、手首側が細い。
  // 拳が遠ざかっても肩の太さは変わらないので、根元は一定に保つ
  const bw=baseR*0.74;
  fore.quadraticCurveTo(bx + bw*0.9, (wy+byy)/2, bx + bw, byy);
  fore.lineTo(bx - bw, byy);
  fore.quadraticCurveTo(bx - bw*0.9, (wy+byy)/2, wx - r*0.46, wy);
  fore.closePath();
  ctx.fillStyle=C.skin; ctx.fill(fore);
  ctx.save(); ctx.clip(fore);
  ctx.fillStyle=C.skinShade; ctx.globalAlpha=0.85;
  ctx.fillRect(bx + s*r*0.10, wy-r, r*2.0, V.H);     // 影面
  ctx.globalAlpha=0.5; ctx.fillStyle=C.skinLit;
  ctx.fillRect(bx - s*r*0.72, wy-r, r*0.34, V.H);    // 明面
  ctx.restore();
  ctx.strokeStyle=OUT; ctx.lineWidth=LW; ctx.stroke(fore);

  // ---- バンテージ（手首）----
  ctx.save(); ctx.clip(fore);
  ctx.fillStyle=C.accent;
  ctx.fillRect(x-r*1.3, wy-r*0.04, r*2.6, r*0.17);
  ctx.fillStyle='rgba(232,226,212,0.8)';
  ctx.fillRect(x-r*1.3, wy+r*0.18, r*2.6, r*0.055);
  ctx.restore();

  // ---- グローブ本体（親指を持つ形）----
  const g=new Path2D();
  g.moveTo(x - s*r*0.98, y + r*0.30);
  g.quadraticCurveTo(x - s*r*1.02, y - r*0.72, x - s*r*0.10, y - r*0.98);
  g.quadraticCurveTo(x + s*r*0.86, y - r*0.86, x + s*r*0.99, y - r*0.02);
  g.quadraticCurveTo(x + s*r*1.05, y + r*0.72, x + s*r*0.30, y + r*0.86);
  g.quadraticCurveTo(x - s*r*0.62, y + r*0.92, x - s*r*0.98, y + r*0.30);
  g.closePath();
  ctx.fillStyle=C.gloveP; ctx.fill(g);
  ctx.save(); ctx.clip(g);
  // 影面
  ctx.fillStyle=C.glovePShade; ctx.globalAlpha=0.55;
  ctx.beginPath(); ctx.ellipse(x+s*r*0.62,y+r*0.42,r*1.05,r*0.98,s*0.35,0,7); ctx.fill();
  ctx.globalAlpha=1;
  // ナックル部の面
  ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.ellipse(x-s*r*0.28,y-r*0.40,r*0.52,r*0.30,-s*0.25,0,7); ctx.fill();
  // 親指
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(x-s*r*0.62,y+r*0.26,r*0.30,r*0.44,s*0.42,0,7); ctx.fill();
  ctx.strokeStyle='rgba(10,13,22,0.30)'; ctx.lineWidth=LW*0.8;
  ctx.beginPath(); ctx.ellipse(x-s*r*0.62,y+r*0.26,r*0.30,r*0.44,s*0.42,0,7); ctx.stroke();
  // 縫い目
  ctx.strokeStyle='rgba(10,13,22,0.22)'; ctx.lineWidth=LW*0.7;
  ctx.beginPath();
  ctx.moveTo(x-s*r*0.72,y-r*0.06); ctx.quadraticCurveTo(x,y-r*0.20,x+s*r*0.72,y-r*0.02);
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle=OUT; ctx.lineWidth=LW; ctx.stroke(g);

  if(guarding){
    ctx.strokeStyle='rgba(255,59,48,0.45)'; ctx.lineWidth=Math.max(1.5,r*0.05);
    ctx.stroke(g);
  }
  ctx.restore();
}

/* ============================================================
   15. カメラ  —  頭・肩の動き (§4 §14)
   ============================================================ */
function updateCamera(F){
  const p=F.p, dt=Clock.realDt, t=Clock.real;
  let tx=0, ty=0, rot=0;

  // スリップ：頭が横へ抜ける
  const st=(t-p.slipT)/420;
  if(p.slip!==0 && st<1){
    const k=Math.sin(clamp(st,0,1)*Math.PI);
    tx += p.slip*V.W*0.17*k;
    rot += p.slip*0.045*k;
  }else if(st>=1) p.slip=0;

  // スウェー／しゃがみ
  const wt=(t-(p.swayT||-9999))/380;
  if(p.sway && wt<1){ ty += V.H*0.05*Math.sin(clamp(wt,0,1)*Math.PI); }
  else p.sway=0;
  if(Input.isDualHolding()) p.crouch=damp(p.crouch,1,12,dt); else p.crouch=damp(p.crouch,0,9,dt);
  ty += p.crouch*V.H*0.06;

  // ガード中は指の位置に応じて頭も僅かに動く
  const f=Input.finger(Input.isHolding('L')?'L':(Input.isHolding('R')?'R':null));
  if(f) tx += (f.x-V.W/2)*0.05;

  // 被弾シェイク
  tx += p.shake*Math.sin(t/17)*V.W*0.035;
  ty += p.shake*Math.cos(t/13)*V.H*0.012;
  rot += p.shake*Math.sin(t/29)*0.03;

  // 前進・後退の踏み込み
  if(F.stepping){
    const k=clamp((Clock.game-F.distT)/F.distDur,0,1);
    ty += Math.sin(k*Math.PI)*V.H*0.012*(F.distTarget>F.dist?-1:1);
  }

  p.camX=damp(p.camX,tx,26,dt);
  p.camY=damp(p.camY,ty,22,dt);
  p.camRot=damp(p.camRot,rot,24,dt);
}

/* ============================================================
   16. エフェクト  —  接触点・墨の一閃・PERFECT (§14)
   ============================================================ */
function drawFx(F){
  const now=Clock.real;
  for(const f of F.fx){
    if(f.a===undefined){ f.a=rnd(-1,1); f.seed=Math.random(); }
    const life = f.kind==='perfect'?520:360;
    const k=clamp((now-f.t)/life,0,1);
    if(k>=1) continue;
    const P=f.power;
    ctx.save();
    ctx.translate(f.x,f.y);

    if(f.kind==='perfect'||f.kind==='hit'){
      // 白フラッシュ
      const fl=1-easeOut(k);
      ctx.globalAlpha=(f.kind==='perfect'?0.9:0.55)*fl;
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(0,0,V.bh*(0.05+0.12*P)*(0.5+k*1.6),0,7); ctx.fill();
      // 放射線
      ctx.globalAlpha=0.7*fl; ctx.strokeStyle=f.kind==='perfect'?C.accent:C.ink;
      ctx.lineWidth=Math.max(1,V.bh*0.008);
      ctx.beginPath();
      for(let i=0;i<(f.kind==='perfect'?9:5);i++){
        const a=f.a*2+i*(Math.PI*2/(f.kind==='perfect'?9:5));
        const r0=V.bh*0.05*(1+k*3), r1=r0+V.bh*(0.10+0.16*P)*(1-k);
        ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);
        ctx.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);
      }
      ctx.stroke();
    }
    if(f.kind==='perfect'){
      // 墨の一閃（判定演出にのみ墨を使う §4.1）
      ctx.rotate(f.a*0.9);
      ctx.globalAlpha=0.92*(1-easeIn(k));
      ctx.fillStyle='#0a0d16';
      const L=V.W*1.3*(0.4+0.6*easeOut(k)), th=V.bh*0.055*P;
      ctx.beginPath();
      ctx.moveTo(-L/2,0);
      ctx.quadraticCurveTo(-L*0.1,-th, L/2, -th*0.15);
      ctx.quadraticCurveTo(L*0.1, th*0.7, -L/2, th*0.25);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha=0.5*(1-easeIn(k)); ctx.fillStyle=C.accent;
      ctx.fillRect(-L/2,-th*0.12,L*(1-k),th*0.16);
    }
    if(f.kind==='guard'){
      const fl=1-easeOut(k);
      ctx.globalAlpha=0.8*fl;
      ctx.strokeStyle=C.ink; ctx.lineWidth=Math.max(1.5,V.bh*0.010);
      ctx.beginPath(); ctx.arc(0,0,V.bh*0.06*(1+k*1.8),0,7); ctx.stroke();
      ctx.globalAlpha=0.5*fl;
      for(let i=0;i<6;i++){
        const a=i*1.05+f.a;
        const d=V.bh*(0.06+0.10*k);
        ctx.fillRect(Math.cos(a)*d,Math.sin(a)*d,3,3);
      }
    }
    if(f.kind==='hurt'){
      const fl=1-easeOut(k);
      ctx.globalAlpha=0.55*fl; ctx.fillStyle=C.accent;
      ctx.beginPath(); ctx.arc(0,0,V.bh*0.08*P*(0.6+k*1.5),0,7); ctx.fill();
    }
    ctx.restore();
  }
}

// ぼかしの上に鮮明な拳を描き直す（視線を集める焦点）
function drawSharpFist(f){
  const gr=f.r, gx=f.x, gy=f.y;
  ctx.save();
  ctx.beginPath(); ctx.arc(gx,gy,gr,0,7);
  ctx.fillStyle=EC.glove; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(gx,gy,gr,0,7); ctx.clip();
  ctx.beginPath(); ctx.arc(gx+gr*0.34,gy+gr*0.30,gr*0.94,0,7);
  ctx.fillStyle=EC.gloveShade; ctx.globalAlpha=0.6; ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,255,255,0.16)';
  ctx.beginPath(); ctx.ellipse(gx-gr*0.10,gy-gr*0.30,gr*0.66,gr*0.34,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(90,20,16,0.22)'; ctx.lineWidth=Math.max(1,gr*0.030);
  ctx.beginPath();
  ctx.moveTo(gx-gr*0.66,gy+gr*0.42);
  ctx.quadraticCurveTo(gx,gy+gr*0.58,gx+gr*0.66,gy+gr*0.40); ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.arc(gx-gr*0.34,gy-gr*0.36,gr*0.26,0,7);
  ctx.fillStyle='rgba(255,255,255,0.26)'; ctx.fill();
  ctx.strokeStyle='rgba(10,13,22,0.85)'; ctx.lineWidth=Math.max(1.4,gr*0.045);
  ctx.beginPath(); ctx.arc(gx,gy,gr,0,7); ctx.stroke();
  ctx.restore();
}

/* ============================================================
   16.5 主観時間の知覚  —  「遅くなった」を見せるための基準
   スローモーションは何かが遅く動いて初めて知覚できる。
   常に流れている塵と、拳の残像と、実時間で動く要素を用意する。
   ============================================================ */
const SlowFx = {
  motes:[], echo:[], sweat:[], enterT:-9999, exitT:-9999, zoom:1, letter:0, wasSlow:false,
  off:null, offCtx:null, acc:null, accCtx:null,

  init(){
    this.sweat=[];
    this.motes=[];
    for(let i=0;i<44;i++){
      this.motes.push({
        x:Math.random(), y:Math.random(),
        vx:rnd(-0.05,0.05), vy:rnd(-0.11,-0.03),
        r:rnd(0.6,2.1), a:rnd(0.10,0.34), ph:Math.random()*7,
      });
    }
    this.echo=[]; this.enterT=this.exitT=-9999; this.zoom=1; this.letter=0; this.wasSlow=false;
    if(!this.off){
      this.off =document.createElement('canvas'); this.offCtx =this.off.getContext('2d');
      this.acc =document.createElement('canvas'); this.accCtx =this.acc.getContext('2d');
    }
  },

  // 汗：ゲーム内時間で飛ぶので、減速すると目に見えて宙で止まる
  emitSweat(x,y,n,power){
    for(let i=0;i<n;i++){
      const a=rnd(-Math.PI,0), sp=rnd(0.10,0.42)*(power||1);
      this.sweat.push({
        x, y,
        vx:Math.cos(a)*sp*V.W + rnd(-40,40)/1000*V.W,
        vy:Math.sin(a)*sp*V.H*0.6 - rnd(0.02,0.12)*V.H,
        r:rnd(1.2,3.4), life:0, max:rnd(700,1500),
      });
    }
    if(this.sweat.length>Q.maxSweat) this.sweat.splice(0,this.sweat.length-Q.maxSweat);
  },

  update(F){
    const d=Clock.depth;
    // 塵はゲーム内時間で流れる → 減速すると目に見えて止まりかける
    const gs=Clock.gameDt/1000;
    for(const m of this.motes){
      m.x+=m.vx*gs; m.y+=m.vy*gs;
      if(m.y<-0.05){ m.y=1.05; m.x=Math.random(); }
      if(m.x<-0.05) m.x=1.05; else if(m.x>1.05) m.x=-0.05;
    }
    // 汗（ゲーム内時間）
    const sdt=Clock.gameDt/1000;
    for(let i=this.sweat.length-1;i>=0;i--){
      const w=this.sweat[i];
      w.life+=Clock.gameDt;
      w.vy += 900*sdt;                       // 重力
      w.x  += w.vx*sdt; w.y += w.vy*sdt;
      if(w.life>w.max || w.y>V.H+20) this.sweat.splice(i,1);
    }
    // 拳の残像
    if(V.fist && V.fist.active && d>0.15){
      this.echo.push({x:V.fist.x,y:V.fist.y,r:V.fist.r,t:Clock.real});
      if(this.echo.length>7) this.echo.shift();
    }else if(this.echo.length && Clock.real-this.echo[this.echo.length-1].t>220){
      this.echo.length=0;
    }
    // 入る／出る瞬間を記録する
    const slow = d>0.35;
    if(slow && !this.wasSlow){ this.enterT=Clock.real; Fight.hitstop=Clock.real+55; }
    if(!slow && this.wasSlow){ this.exitT=Clock.real; }
    this.wasSlow=slow;
    // カメラの寄りとレターボックス
    this.zoom  = damp(this.zoom, 1+0.085*d, 16, Clock.realDt);
    this.letter= damp(this.letter, d, 14, Clock.realDt);
  },

  // 世界の描画に掛ける寄り
  applyZoom(){
    const z=this.zoom;
    if(z<=1.001) return false;
    ctx.translate(V.W/2,V.H*0.44); ctx.scale(z,z); ctx.translate(-V.W/2,-V.H*0.44);
    return true;
  },

  // 世界のなかに描くもの（塵・残像）
  drawWorld(){
    const d=Clock.depth;
    ctx.save();
    // 塵：主観時間の速度計として常に流れている
    for(const m of this.motes){
      const x=m.x*V.W, y=m.y*V.H;
      ctx.globalAlpha=m.a*(0.45+0.55*d);
      ctx.fillStyle=d>0.4?'#cfe0ff':C.ink;
      ctx.beginPath(); ctx.arc(x,y,m.r*(1+0.5*d),0,7); ctx.fill();
    }
    // 拳の残像：遅いことを軌跡そのもので示す
    for(let i=0;i<this.echo.length;i++){
      const e=this.echo[i], k=(i+1)/this.echo.length;
      ctx.globalAlpha=0.16*k*d;
      ctx.fillStyle=EC.glove;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r*(0.72+0.28*k),0,7); ctx.fill();
    }
    ctx.restore();
  },

  // 汗は前景（ぼかしの後）に描く
  drawSweat(){
    if(!this.sweat.length) return;
    const d=Clock.depth;
    ctx.save();
    for(const w of this.sweat){
      const k=1-w.life/w.max;
      // 尾を引かせると「飛んでいる」ことが分かる
      if(Q.blur){
        const tx=-w.vx*0.035*(1-d*0.75), ty=-w.vy*0.035*(1-d*0.75);
        ctx.globalAlpha=0.20*k;
        ctx.strokeStyle='#cfe4ff'; ctx.lineWidth=w.r*0.8; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(w.x,w.y); ctx.lineTo(w.x+tx,w.y+ty); ctx.stroke();
      }
      ctx.globalAlpha=0.55*k;
      ctx.fillStyle='#e8f2ff';
      ctx.beginPath(); ctx.ellipse(w.x,w.y,w.r*0.9,w.r*1.15,0,0,7); ctx.fill();
      ctx.globalAlpha=0.9*k;
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(w.x-w.r*0.25,w.y-w.r*0.3,w.r*0.34,0,7); ctx.fill();
    }
    ctx.restore();
  },

  // 世界の色を抜く。この後に描くもの（拳・汗）は鮮やかなまま残る
  drawGrade(){
    const L=this.letter; if(L<0.02) return;
    const {W,H}=V;
    // 相手だけ薄く起こして、予備動作を読めるようにする
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const ly=(V.faceY+V.bodyY)/2;
    const g=ctx.createRadialGradient(V.faceX,ly,0,V.faceX,ly,V.bh*0.72);
    g.addColorStop(0,`rgba(104,118,158,${0.34*L})`);
    g.addColorStop(0.55,`rgba(88,100,136,${0.16*L})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    const R=V.bh*0.72;
    ctx.fillStyle=g;
    ctx.fillRect(V.faceX-R,ly-R,R*2,R*2);
    ctx.restore();
  },

  // ラジアルブラー：世界を中心へ流す。拳と自分のグローブは後から鮮明に描く
  radialBlur(){
    const d=Clock.depth;
    if(d<0.06 || !Q.blur) return;
    const W=V.W,H=V.H, sc=0.5;
    const ow=Math.max(2,Math.round(W*sc)), oh=Math.max(2,Math.round(H*sc));
    if(this.off.width!==ow||this.off.height!==oh){
      this.off.width=ow; this.off.height=oh; this.acc.width=ow; this.acc.height=oh;
    }
    const o=this.offCtx, a=this.accCtx;
    o.setTransform(1,0,0,1,0,0); o.clearRect(0,0,ow,oh);
    o.drawImage(cv,0,0,ow,oh);                    // 画面を1/2解像度で取り込む
    // 重ね合わせも1/2解像度で済ませ、画面全面への書き込みは最後の1回だけ
    const fx=ow*0.5, fy=oh*0.44;
    a.setTransform(1,0,0,1,0,0); a.clearRect(0,0,ow,oh);
    for(let i=1;i<=3;i++){
      const z=1+0.026*i*d;
      a.setTransform(1,0,0,1,0,0);
      a.globalAlpha=(0.42*d)/i;
      a.translate(fx,fy); a.scale(z,z); a.translate(-fx,-fy);
      a.drawImage(this.off,0,0);
    }
    a.setTransform(1,0,0,1,0,0); a.globalAlpha=1;
    ctx.drawImage(this.acc,0,0,ow,oh,0,0,W,H);
  },

  // 画面全体に掛けるもの（フラッシュ・レターボックス・減速リング）
  drawScreen(F){
    const {W,H}=V, d=Clock.depth;

    // --- 入った瞬間の一撃 ---
    const et=(Clock.real-this.enterT)/460;
    if(et>=0 && et<1){
      const k=easeOut(et);
      ctx.save();
      // 白の一瞬
      ctx.globalAlpha=0.5*(1-Math.min(1,et*6));
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
      // 外へ抜けていく衝撃波
      ctx.globalAlpha=0.7*(1-k);
      ctx.strokeStyle=C.accent; ctx.lineWidth=Math.max(2,W*0.012*(1-k));
      ctx.beginPath(); ctx.arc(W*0.5,H*0.44,W*(0.05+1.15*k),0,7); ctx.stroke();
      ctx.globalAlpha=0.35*(1-k);
      ctx.strokeStyle=C.ink; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(W*0.5,H*0.44,W*(0.05+0.85*k),0,7); ctx.stroke();
      ctx.restore();
    }
    // --- 出た瞬間の抜け ---
    const xt=(Clock.real-this.exitT)/300;
    if(xt>=0 && xt<1){
      ctx.save();
      ctx.globalAlpha=0.30*(1-xt);
      ctx.strokeStyle=C.ink; ctx.lineWidth=2;
      for(let i=0;i<16;i++){
        const a=i*0.3927, r0=W*(0.20+0.9*xt), r1=r0+W*0.28*(1-xt);
        ctx.beginPath();
        ctx.moveTo(W*0.5+Math.cos(a)*r0,H*0.44+Math.sin(a)*r0);
        ctx.lineTo(W*0.5+Math.cos(a)*r1,H*0.44+Math.sin(a)*r1);
        ctx.stroke();
      }
      ctx.restore();
    }

    if(this.letter<0.02) return;
    const L=this.letter;

    // --- レターボックス ---
    const bh=H*0.062*L;
    ctx.save();
    ctx.fillStyle='#05070d';
    ctx.fillRect(0,0,W,bh); ctx.fillRect(0,H-bh,W,bh);
    ctx.globalAlpha=0.5*L; ctx.strokeStyle=C.accent; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,bh); ctx.lineTo(W,bh);
    ctx.moveTo(0,H-bh); ctx.lineTo(W,H-bh); ctx.stroke();
    ctx.restore();

    // --- 判断できる残り時間（接触までの実時間） ---
    const ex=F.exchange;
    if(ex && !ex.resolved && ex.slowed){
      const left=clamp((ex.impact-Clock.game)/Math.max(1,ex.impact-ex.slowAt),0,1);
      ctx.save();
      ctx.globalAlpha=0.95*L;
      ctx.fillStyle = ex.choice ? 'rgba(232,226,212,0.5)' : C.accent;
      ctx.fillRect(0, H-bh-3, W*left, 3);
      ctx.globalAlpha=0.30*L; ctx.fillStyle=C.ink;
      ctx.fillRect(W*left, H-bh-3, W*(1-left), 3);
      ctx.restore();
    }
  },
};

/* ============================================================
   17. 主観時間の演出レイヤー (§9.1 §12)
   ============================================================ */
let slowVig=null, slowVigKey='';
function drawSlowLayer(F){
  const d=Clock.depth;
  const {W,H}=V;
  if(d>0.02){
    // 彩度を落とし、周辺を締める
    ctx.save();
    // 暗転と色抜きを1回にまとめる
    ctx.globalAlpha=0.34*d; ctx.fillStyle='#20263a'; ctx.fillRect(0,0,W,H);
    if(slowVigKey!==W+'x'+H){
      slowVigKey=W+'x'+H;
      slowVig=ctx.createRadialGradient(W*0.5,H*0.44,H*0.12,W*0.5,H*0.44,H*0.62);
      slowVig.addColorStop(0,'rgba(0,0,0,0)'); slowVig.addColorStop(1,'rgba(3,5,10,1)');
    }
    ctx.globalAlpha=0.44*d; ctx.fillStyle=slowVig; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
    // 集中線：中心へ吸い込まれる速度感
    const cx=W*0.5, cy=H*0.44;
    ctx.lineCap='round';
    for(let i=0;i<46;i++){
      const a=i*2.3999+Clock.real/14000;      // 黄金角で散らす
      const seed=(i*97%23)/23;
      const r0=H*(0.26+0.20*seed);
      const len=H*(0.10+0.34*seed);
      ctx.globalAlpha=(0.05+0.22*seed)*d;
      ctx.strokeStyle= seed>0.82 ? C.accent : C.ink;
      ctx.lineWidth=(0.6+1.9*seed);
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);
      ctx.lineTo(cx+Math.cos(a)*(r0+len),cy+Math.sin(a)*(r0+len));
      ctx.stroke();
    }
    ctx.restore();
  }
  // 「見えた」
  const ex=F.exchange;
  if(ex && ex.slowed && !ex.feint){
    const k=clamp((Clock.real-ex.slowRealT)/520,0,1);
    if(k<1){
      ctx.save();
      ctx.globalAlpha=(1-k)*0.9;
      ctx.fillStyle=C.ink; ctx.textAlign='center';
      ctx.font=`600 ${Math.round(V.W*0.052)}px -apple-system,sans-serif`;
      ctx.letterSpacing='0.42em';
      ctx.fillText('見 え た',V.W*0.5+V.W*0.01*k,V.H*0.235);
      ctx.letterSpacing='0px';
      ctx.restore();
    }
  }
}

/* ============================================================
   18. 視認補助 (§12)
   ============================================================ */
const ASSIST_LABEL={
  guard:'長押しでガード', slipL:'左へスリップ', slipR:'右へスリップ',
  sway:'両指下でスウェー', sprawl:'両指長押しでスプロール',
  retreat:'両指下で後退', intercept:'上スライドで迎撃',
};
function drawAssist(F,phase){
  const ex=F.exchange; if(!ex||ex.resolved) return;
  const m=ex.data, D=F.diff;
  const tellEnd=ex.t0+ex.tell;

  // 収束リング：接触の瞬間に拳の大きさへ収束する
  if(phase==='world' && D.showRing && V.fist && V.fist.active){
    const rest=clamp((ex.impact-Clock.game)/Math.max(1,ex.impact-tellEnd),0,1);
    const r=V.fist.r + V.W*0.30*rest;
    ctx.save();
    ctx.globalAlpha=0.30+0.45*(1-rest);
    ctx.strokeStyle=rest<0.18?C.accent:C.ink;
    ctx.lineWidth=Math.max(1.5,V.W*0.006);
    ctx.beginPath(); ctx.arc(V.fist.x,V.fist.y,r,0,7); ctx.stroke();
    ctx.restore();
  }
  // 起こりの一撃：溜めが始まった部位が一瞬だけ光る。
  // ここが「押していい合図」であることを難易度によらず示す
  if(phase==='world' && !ex.read){
    const el=Clock.game-ex.t0;
    const k=clamp(el/170,0,1);
    if(k<1){
      const sg=m.side==='R'?-1:(m.side==='L'?1:0);
      const sh = sg===LEAD ? V.shL : V.shR;
      const x = sh?sh.x:V.cx, y = sh?sh.y:V.shoulderY;
      ctx.save();
      ctx.globalAlpha=(1-k)*0.95;
      ctx.strokeStyle=C.accent; ctx.lineWidth=Math.max(2,V.bh*0.014*(1-k));
      ctx.beginPath(); ctx.arc(x,y,V.bh*(0.03+0.14*k),0,7); ctx.stroke();
      ctx.globalAlpha=(1-k)*0.55; ctx.fillStyle=C.accent;
      ctx.beginPath(); ctx.arc(x,y,V.bh*0.035*(1-k),0,7); ctx.fill();
      ctx.restore();
    }
  }

  // 見切りの受付（BEGINNER のみ）：ここで指を置く
  if(phase==='screen' && D.showArrow && !ex.read && !ex.resolved){
    const el=Clock.game-ex.t0;
    if(el <= ex.tell*D.readWindow + D.readGrace){
      const early = el <= ex.tell*0.35;
      const pulse=0.55+0.45*Math.sin(Clock.real/90);
      ctx.save();
      ctx.globalAlpha=0.9*pulse;
      ctx.textAlign='center'; ctx.fillStyle=early?C.good:C.ink;
      ctx.font=`700 ${Math.round(V.W*0.048)}px -apple-system,sans-serif`;
      ctx.letterSpacing='0.20em';
      ctx.fillText('押 す',V.W*0.5,V.H*0.70);
      ctx.letterSpacing='0px';
      ctx.globalAlpha=0.5*pulse;
      ctx.strokeStyle=C.accent; ctx.lineWidth=2;
      ctx.strokeRect(V.W*0.06,V.H*0.62,V.W*0.88,V.H*0.13);
      ctx.restore();
    }
  }
  // 予備動作の部位マーカー（HARD 相当は非表示）
  if(phase==='world' && D.showRing && Clock.game<tellEnd){
    const k=clamp((Clock.game-ex.t0)/ex.tell,0,1);
    ctx.save();
    ctx.globalAlpha=0.5*(1-k*0.4);
    ctx.strokeStyle=C.accent; ctx.lineWidth=2;
    const s=m.side==='R'?-1:(m.side==='L'?1:0);
    const sh = s===LEAD ? V.shL : V.shR;
    const x = sh ? sh.x : V.cx+s*V.hw, y = sh ? sh.y : V.shoulderY;
    ctx.beginPath(); ctx.arc(x,y,V.bh*0.050*(1.6-k*0.6),0,7); ctx.stroke();
    ctx.restore();
  }
  // BEGINNER：正しい移動方向と操作する腕を短時間表示 (§12)
  if(phase==='screen' && D.showArrow && ex.slowed && !ex.choice){
    const safe=m.safe&&m.safe[0];
    if(safe){
      const txt=ASSIST_LABEL[safe]||safe;
      ctx.save();
      ctx.globalAlpha=0.85;
      ctx.textAlign='center'; ctx.fillStyle=C.accent;
      ctx.font=`600 ${Math.round(V.W*0.036)}px -apple-system,sans-serif`;
      ctx.fillText(txt,V.W*0.5,V.H*0.795);
      // 方向矢印
      const dir = safe==='slipL'?-1:safe==='slipR'?1:0;
      if(dir!==0){
        const ax=V.W*0.5+dir*V.W*0.20, ay=V.H*0.745, s=V.W*0.035;
        ctx.strokeStyle=C.accent; ctx.lineWidth=3; ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(ax-dir*s,ay); ctx.lineTo(ax+dir*s,ay);
        ctx.moveTo(ax+dir*s,ay); ctx.lineTo(ax+dir*s*0.35,ay-s*0.55);
        ctx.moveTo(ax+dir*s,ay); ctx.lineTo(ax+dir*s*0.35,ay+s*0.55);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
  // 初心者モード：タッチ時に左右の入力領域を薄く表示 (§4)
  if(phase==='screen' && D.showIcon && Input.pts.size>0){
    ctx.save(); ctx.globalAlpha=0.06; ctx.fillStyle=C.ink;
    if(Input.finger('L')) ctx.fillRect(0,0,V.W/2,V.H);
    if(Input.finger('R')) ctx.fillRect(V.W/2,0,V.W/2,V.H);
    ctx.restore();
  }
}

// ガード帯と打撃帯の境界。触れている間と、BEGINNER では常に示す
function drawBands(F){
  const D=F.diff, y=V.H*BAND_Y;
  const touching=Input.pts.size>0;
  const a = D.showIcon ? (touching?0.30:0.14) : (touching?0.20:0);
  if(a<=0) return;
  ctx.save();
  ctx.globalAlpha=a;
  ctx.strokeStyle=C.ink; ctx.lineWidth=1; ctx.setLineDash([7,7]);
  ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(V.W,y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha=a*0.9;
  smallCaps('ガード',V.W*0.045,y-8,Math.round(V.W*0.026),C.ink,'left','0.20em');
  smallCaps('打撃',V.W*0.045,y+Math.round(V.W*0.055),Math.round(V.W*0.026),C.ink,'left','0.20em');
  if(touching){
    ctx.globalAlpha=a*0.22; ctx.fillStyle=C.ink;
    for(const q of Input.pts.values()){
      const x=q.side==='L'?0:V.W/2;
      if(q.band==='G') ctx.fillRect(x,0,V.W/2,y);
      else             ctx.fillRect(x,y,V.W/2,V.H-y);
    }
  }
  ctx.restore();
}

/* ============================================================
   19. HUD  —  上部15% / 下部15% (§4)
   ============================================================ */
let SAFE_TOP=0, SAFE_BOT=0;
(function(){
  const probe=document.createElement('div');
  probe.style.cssText='position:fixed;top:0;left:0;width:0;'+
    'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);'+
    'visibility:hidden;pointer-events:none';
  document.body.appendChild(probe);
  const read=()=>{const s=getComputedStyle(probe);
    SAFE_TOP=parseFloat(s.paddingTop)||0; SAFE_BOT=parseFloat(s.paddingBottom)||0;};
  read(); window.addEventListener('resize',read);
})();

function bar(x,y,w,h,v,color,rtl){
  ctx.fillStyle='rgba(232,226,212,0.13)'; ctx.fillRect(x,y,w,h);
  const fw=w*clamp(v,0,1);
  ctx.fillStyle=color;
  ctx.fillRect(rtl?x+w-fw:x, y, fw, h);
}
function smallCaps(text,x,y,size,color,align,track){
  ctx.save();
  ctx.fillStyle=color; ctx.textAlign=align||'left';
  ctx.font=`600 ${size}px -apple-system,"Helvetica Neue",sans-serif`;
  if(track) ctx.letterSpacing=track;
  ctx.fillText(text,x,y);
  ctx.letterSpacing='0px';
  ctx.restore();
}

function drawHUD(F){
  const {W,H}=V;
  const top=SAFE_TOP+10;
  const bx=W*0.175, bw=W*0.755;
  let tg=ctx.createLinearGradient(0,0,0,V.topH*1.35);
  tg.addColorStop(0,'rgba(7,9,16,0.85)'); tg.addColorStop(1,'rgba(7,9,16,0)');
  ctx.fillStyle=tg; ctx.fillRect(0,0,W,V.topH*1.35);

  ctx.save();
  ctx.textAlign='center';
  if(F.mode==='situation'){
    // 目標の進捗（残り時間ではなく、達成数を見せる）
    const [cur,need]=F.goalProgress();
    smallCaps(goalText(F.sit).toUpperCase(),W*0.5,top+W*0.030,Math.round(W*0.024),C.inkFaint,'center','0.20em');
    ctx.fillStyle=C.ink;
    ctx.font=`700 ${Math.round(W*0.062)}px -apple-system,sans-serif`;
    ctx.fillText(`${Math.min(cur,need)}`,W*0.5-W*0.028,top+W*0.088);
    ctx.fillStyle=C.inkFaint;
    ctx.font=`600 ${Math.round(W*0.032)}px -apple-system,sans-serif`;
    ctx.fillText(`/ ${need}`,W*0.5+W*0.042,top+W*0.088);
    // 残りの出題数
    const left=F.queue.length-F.qIdx;
    if(left>0){
      ctx.fillStyle='rgba(232,226,212,0.28)';
      for(let i=0;i<F.queue.length;i++){
        ctx.fillRect(W*0.5-(F.queue.length*5)/2+i*5, top+W*0.104, 3, 3);
      }
      ctx.fillStyle=C.accent;
      for(let i=0;i<F.qIdx;i++) ctx.fillRect(W*0.5-(F.queue.length*5)/2+i*5, top+W*0.104, 3, 3);
    }
  }else{
    const remain=Math.max(0,F.timeLimit-F.elapsed);
    const sec=Math.floor(remain/1000), cs=Math.floor((remain%1000)/10);
    ctx.fillStyle=C.ink;
    ctx.font=`700 ${Math.round(W*0.072)}px -apple-system,sans-serif`;
    ctx.fillText(String(sec).padStart(2,'0'),W*0.5,top+W*0.062);
    ctx.font=`600 ${Math.round(W*0.028)}px -apple-system,sans-serif`;
    ctx.fillStyle=C.inkFaint;
    ctx.fillText('.'+String(cs).padStart(2,'0'),W*0.5+W*0.062,top+W*0.062);
  }
  ctx.restore();

  // RIVAL
  let y=top+W*0.095;
  smallCaps(F.ftr?F.ftr.name:'RIVAL',W*0.045,y+5,Math.round(W*0.024),C.inkFaint,'left','0.16em');
  bar(bx,y,bw,4,F.e.hp/100,C.accent,true);
  bar(bx,y+6,bw,2,F.e.stam/100,'rgba(232,226,212,0.42)',true);

  // YOU
  y+=W*0.058;
  smallCaps('YOU',W*0.045,y+5,Math.round(W*0.024),C.inkFaint,'left','0.18em');
  bar(bx,y,bw,4,F.p.hp/100,C.ink,false);
  bar(bx,y+6,bw,2,F.p.stam/100,
      F.p.stam<20?'rgba(255,59,48,0.7)':'rgba(232,226,212,0.42)',false);

  // 有利状態（カウンター受付）
  if(F.advantage){
    const k=clamp((F.p.advUntil-Clock.game)/COUNTER_WINDOW,0,1);
    ctx.save();
    ctx.globalAlpha=0.9; ctx.strokeStyle=C.accent; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(bx,y+13); ctx.lineTo(bx+bw*k,y+13); ctx.stroke();
    smallCaps('COUNTER',W*0.045,y+17,Math.round(W*0.021),C.accent,'left','0.16em');
    ctx.restore();
  }

  // ---- 下部：距離表示 ----
  const by=H-SAFE_BOT-H*0.062;
  let sg=ctx.createLinearGradient(0,by-H*0.075,0,H);
  sg.addColorStop(0,'rgba(7,9,16,0)'); sg.addColorStop(0.6,'rgba(7,9,16,0.45)');
  sg.addColorStop(1,'rgba(7,9,16,0.72)');
  ctx.fillStyle=sg; ctx.fillRect(0,by-H*0.075,W,H-by+H*0.075);
  const segW=W*0.20, gap=W*0.035;
  const totalW=segW*3+gap*2, sx=(W-totalW)/2;
  for(let i=0;i<3;i++){
    const x=sx+i*(segW+gap);
    const on=Math.round(F.distVisual)===i;
    ctx.fillStyle=on?C.accent:'rgba(232,226,212,0.16)';
    ctx.fillRect(x,by,segW,2);
    smallCaps(DIST_NAME[i],x+segW/2,by+H*0.026,Math.round(W*0.026),
              on?C.ink:C.inkFaint,'center','0.10em');
  }
  // 移動中のマーカー
  const mx=sx+F.distVisual*(segW+gap)+segW/2;
  ctx.fillStyle=C.accent;
  ctx.beginPath(); ctx.moveTo(mx,by-5); ctx.lineTo(mx-4,by-11); ctx.lineTo(mx+4,by-11);
  ctx.closePath(); ctx.fill();

  // 金網圧力
  const cy=by-H*0.030;
  for(let i=0;i<2;i++){
    ctx.fillStyle=i<F.p.cage?C.accent:'rgba(232,226,212,0.18)';
    ctx.beginPath(); ctx.arc(W*0.075+i*10,cy,3,0,7); ctx.fill();
    ctx.fillStyle=i<F.e.cage?'rgba(232,226,212,0.8)':'rgba(232,226,212,0.18)';
    ctx.beginPath(); ctx.arc(W-W*0.075-i*10,cy,3,0,7); ctx.fill();
  }
  smallCaps('CAGE',W*0.075-4,cy-9,Math.round(W*0.019),C.inkFaint,'left','0.14em');

  // ---- 対峙：拍を刻みながら詰めてくる ----
  if(F.inIntro()){
    const k=Clock.game/F.introUntil;
    const beat=Clock.game/BEAT;
    const n=Math.min(4,Math.floor(beat)+1);
    ctx.save(); ctx.textAlign='center';
    // 文字が相手に重なっても読めるように、薄い帯を敷く
    const bg=ctx.createLinearGradient(0,H*0.755,0,H*0.905);
    bg.addColorStop(0,'rgba(7,9,16,0)');
    bg.addColorStop(0.45,'rgba(7,9,16,0.72)');
    bg.addColorStop(1,'rgba(7,9,16,0)');
    ctx.fillStyle=bg; ctx.fillRect(0,H*0.755,W,H*0.150);
    // 拍のマーカー：残り何拍で始まるか
    const dotW=W*0.030, gap=W*0.026, total=4*dotW+3*gap, sx0=(W-total)/2;
    for(let i=0;i<4;i++){
      const on=i<n, pop=on?clamp(1-(beat-i)*2.2,0,1):0;
      ctx.globalAlpha=on?1:0.20;
      ctx.fillStyle=on?C.accent:C.ink;
      const h=3+6*pop;
      ctx.fillRect(sx0+i*(dotW+gap), H*0.836-h/2, dotW, h);
    }
    ctx.globalAlpha=1;
    // 文字
    const late=k>0.72;
    ctx.fillStyle=late?C.accent:C.inkDim;
    ctx.font=`700 ${Math.round(W*(late?0.085:0.052))}px -apple-system,sans-serif`;
    ctx.letterSpacing=late?'0.30em':'0.42em';
    const pulse=late?(0.75+0.25*Math.sin(Clock.real/70)):1;
    ctx.globalAlpha=pulse;
    ctx.fillText(late?'来 る':'構 え ろ', W*0.5+(late?W*0.02:W*0.03), H*0.800);
    ctx.letterSpacing='0px'; ctx.globalAlpha=1;
    if(!late){
      ctx.fillStyle='rgba(232,226,212,0.32)';
      ctx.font=`500 ${Math.round(W*0.029)}px -apple-system,sans-serif`;
      ctx.fillText('指を置くと すぐ始まる', W*0.5, H*0.874);
    }
    ctx.restore();
  }

  // シチュエーションの操作ヒント（開始 3 秒）
  if(F.mode==='situation' && !F.inIntro() && F.elapsed<3000){
    ctx.save();
    ctx.globalAlpha=clamp((3000-F.elapsed)/900,0,1)*0.9;
    ctx.textAlign='center'; ctx.fillStyle=C.accent;
    ctx.font=`600 ${Math.round(W*0.034)}px -apple-system,sans-serif`;
    ctx.fillText(F.sit.hint,W*0.5,H*0.755);
    ctx.restore();
  }

  // ---- 判定表示：位置を固定して重ねない ----
  const now=Clock.real;
  const SLOT={ read:H*0.205, what:H*0.256, judge:H*0.310, info:H*0.352 };
  // 顔に文字が重なると読めないので、出ている間だけ薄い帯を敷く
  if(F.floats.length){
    let a=0;
    for(const f of F.floats) a=Math.max(a, 1-clamp((now-f.t)/(f.big?1600:1100),0,1));
    const mg=ctx.createLinearGradient(0,H*0.165,0,H*0.390);
    mg.addColorStop(0,'rgba(7,9,16,0)');
    mg.addColorStop(0.42,`rgba(7,9,16,${0.68*a})`);
    mg.addColorStop(1,'rgba(7,9,16,0)');
    ctx.fillStyle=mg; ctx.fillRect(0,H*0.165,W,H*0.225);
  }
  for(const f of F.floats){
    const life = f.big ? 1600 : 1100;
    const k=clamp((now-f.t)/life,0,1);
    ctx.save();
    ctx.globalAlpha=(1-easeIn(k))*0.98;
    ctx.textAlign='center'; ctx.fillStyle=f.color;
    const size=f.big?W*0.078:(f.slot==='what'?W*0.036:W*0.046);
    ctx.font=`${f.big?800:600} ${Math.round(size)}px -apple-system,sans-serif`;
    ctx.letterSpacing=f.big?'0.14em':(f.slot==='what'?'0.12em':'0.06em');
    ctx.fillText(f.text, W*0.5, (SLOT[f.slot]||SLOT.judge) - k*H*0.014);
    ctx.letterSpacing='0px';
    ctx.restore();
  }
}

const Progress = {
  data:{},
  load(){ try{ this.data=JSON.parse(localStorage.getItem('maai.progress')||'{}'); }catch(e){ this.data={}; } },
  save(){ try{ localStorage.setItem('maai.progress',JSON.stringify(this.data)); }catch(e){} },
  stars(id){ return this.data[id]||0; },
  set(id,st){ if(st>this.stars(id)){ this.data[id]=st; this.save(); } },
  unlocked(i){
    if(i===0) return true;
    return this.stars(SITUATIONS[i-1].id)>0;
  },
  cleared(){ return SITUATIONS.filter(s=>this.stars(s.id)>0).length; },
};

Object.assign(Fight,{
  // 出題順を組み立てる。プールから抽選するので、答えは毎回同じにならない
  buildQueue(sit){
    const q=[];
    for(const w of sit.waves){
      if(sit.combo){
        // 決まった連係をそのまま並べる
        for(let i=0;i<w.n;i++) q.push(sit.combo[0][i%sit.combo[0].length]);
      }else{
        let prev=null;
        for(let i=0;i<w.n;i++){
          let pool=w.pool;
          if(pool.length>1 && prev) pool=pool.filter(x=>x!==prev);
          const mv=pick(pool.length?pool:w.pool);
          q.push(mv); prev=mv;
        }
      }
      q.gap=w.gap;
    }
    this.queueGap=sit.waves[0].gap;
    return q;
  },

  sitUpdate(){
    const sit=this.sit; if(!sit) return;
    if(this.exchange || this.pending) return;
    if(Clock.game < this.ai.restUntil) return;

    if(this.qIdx>=this.queue.length){
      // 出題が尽きた → 少し待って判定
      if(!this.qDone) this.qDone=Clock.game;
      else if(Clock.game-this.qDone>700) this.judgeSituation();
      return;
    }
    const mv=this.queue[this.qIdx++];
    if(mv==='feint') this.startEnemyFeint(); else this.startEnemyAttack(mv);
    const g=this.queueGap;
    this.ai.restUntil=Clock.game + BEAT*rnd(g[0],g[1]);
  },

  goalProgress(){
    const sit=this.sit, g=sit.goal, st=this.sitStats;
    switch(g.kind){
      case 'defend' : return [st.defended, g.n];
      case 'counter': return [g.perfectOnly?st.perfectCounter:st.countered, g.n];
      case 'sprawl' : return [st.sprawled, g.n];
      case 'escape' : return [2-this.p.cage, 2];
      case 'reach'  : return [this.dist>=STRIKE?1:0, 1];
    }
    return [0,1];
  },

  judgeSituation(){
    const [cur,need]=this.goalProgress();
    const ok = cur>=need;
    let stars=0;
    if(ok){
      stars=1;
      if(this.sitStats.damage<=0) stars=2;
      if(stars===2 && this.stats.perfect>=(this.sit.star3?this.sit.star3.perfect:99)) stars=3;
      Progress.set(this.sit.id,stars);
    }
    this.sitStars=stars;
    this.finish(ok, ok?'CLEAR':'FAILED');
  },
});

/* ============================================================
   20. タイミング補正 (§9  ±200ms)
   ============================================================ */
const Calib = {
  active:false, t0:0, taps:[], count:0, total:12, offset:0, done:false,
  start(){ this.active=true; this.t0=Clock.real+900; this.taps=[]; this.count=0;
           this.done=false; this.lastBeat=-1; },
  update(){
    const b=Math.floor((Clock.real-this.t0)/BEAT);
    if(b>=0 && b!==this.lastBeat){ this.lastBeat=b; Audio_.step(b%4===0); this.pulse=Clock.real; }
    if(this.count>=this.total && !this.done){
      this.done=true;
      const s=this.taps.slice().sort((a,b)=>a-b);
      const med=s.length? s[Math.floor(s.length/2)] : 0;
      this.offset=clamp(Math.round(-med),-200,200);
      Fight.offsetMs=this.offset;
      try{ localStorage.setItem('maai.offset',String(this.offset)); }catch(e){}
      setTimeout(()=>{ this.active=false; go('title'); },1500);
    }
  },
  tap(){
    if(this.done||this.count>=this.total) return;
    const t=Clock.real-this.t0;
    if(t<-BEAT/2) return;
    const b=Math.round(t/BEAT);
    if(b<2) return;                       // 頭2拍はカウントイン
    const d=t-b*BEAT;
    if(Math.abs(d)>BEAT*0.45) return;
    this.taps.push(d); this.count++;
    Audio_.glove();
  },
  draw(){
    const {W,H}=V;
    ctx.fillStyle='rgba(7,9,16,0.86)'; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.textAlign='center';
    smallCaps('TIMING CALIBRATION',W/2,H*0.20,Math.round(W*0.030),C.inkFaint,'center','0.28em');
    ctx.fillStyle=C.inkDim; ctx.font=`500 ${Math.round(W*0.036)}px -apple-system,sans-serif`;
    ctx.fillText('足音に合わせて画面をタップ',W/2,H*0.26);

    const k=clamp((Clock.real-(this.pulse||0))/BEAT,0,1);
    const r=W*0.20*(1+0.25*(1-k));
    ctx.strokeStyle=C.ink; ctx.globalAlpha=0.25+0.6*(1-k); ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(W/2,H*0.48,r,0,7); ctx.stroke();
    ctx.globalAlpha=1;
    ctx.fillStyle=C.accent;
    ctx.beginPath(); ctx.arc(W/2,H*0.48,W*0.035*(1+0.5*(1-k)),0,7); ctx.fill();

    ctx.fillStyle=C.ink; ctx.font=`700 ${Math.round(W*0.06)}px -apple-system,sans-serif`;
    ctx.fillText(`${this.count} / ${this.total}`,W/2,H*0.68);
    if(this.done){
      ctx.fillStyle=C.accent; ctx.font=`700 ${Math.round(W*0.055)}px -apple-system,sans-serif`;
      ctx.fillText(`補正 ${this.offset>0?'+':''}${this.offset} ms`,W/2,H*0.76);
    }
    ctx.restore();
  },
};

   21. シーン管理・メインループ

let scene='title';
let curDiff='NORMAL';
let curFighter='arata';
const el=id=>document.getElementById(id);
const OV={title:el('ovTitle'),howto:el('ovHowto'),result:el('ovResult'),
          sit:el('ovSit'),brief:el('ovBrief')};

function go(s){
  scene=s;
  for(const k in OV) OV[k].classList.toggle('hidden', s!==k);
  if(s==='title'){
    el('sitCount').textContent=`${Progress.cleared()} / ${SITUATIONS.length}`;
    buildFighters();
  }
}

// 相手を選ぶ。体格・顔・色・打ち方・癖・リズムがまとめて入れ替わる
function buildFighters(){
  el('ftrRow').innerHTML = FIGHTER_ORDER.map(id=>{
    const f=FIGHTERS[id];
    return `<button class="fbtn" data-ftr="${id}" data-on="${id===curFighter?1:0}">
      <b>${f.name}</b><span>${f.style}</span>
      <i style="background:${f.color.glove}"></i></button>`;
  }).join('');
}

const STAR=(n)=>'★★★'.slice(0,n)+'<i>'+'★★★'.slice(0,3-n)+'</i>';
const GOAL_JA={defend:'捌く',counter:'カウンター',sprawl:'タックルを切る',
               escape:'金網から脱出',reach:'打撃距離まで入る'};
function goalText(sit){
  const g=sit.goal;
  if(g.kind==='escape'||g.kind==='reach') return GOAL_JA[g.kind];
  return `${GOAL_JA[g.kind]} × ${g.n}${g.perfectOnly?'（拍に乗せる）':''}`;
}

function buildSituations(){
  let h='<h2>SITUATIONS</h2>';
  for(const ch of CHAPTERS){
    const list=SITUATIONS.filter(x=>x.ch===ch.n);
    h+=`<div class="chgrp"><h3>CHAPTER ${ch.n}<b>${ch.ja}</b>${ch.sub}</h3>`;
    for(const sit of list){
      const i=SITUATIONS.indexOf(sit);
      const open=Progress.unlocked(i), st=Progress.stars(sit.id);
      h+=`<button class="sit" data-sit="${sit.id}" ${open?'':'disabled'}>
        <span class="no">${String(i+1).padStart(2,'0')}</span>
        <span class="tx"><b>${open?sit.title:'- - -'}</b><span>${open?goalText(sit):'前の局面をクリアで解放'}</span></span>
        <span class="st">${open?STAR(st):''}</span></button>`;
    }
    h+='</div>';
  }
  h+=`<div class="note">状況は固定ですが、<b>相手が何を出すかは毎回変わります</b>。
      順番を覚えるのではなく、肩と腰を見て決めてください。</div>`;
  el('sitBody').innerHTML=h;
}

let curSit=null;
function buildBrief(sit){
  curSit=sit;
  const i=SITUATIONS.indexOf(sit);
  el('briefBody').innerHTML=`
    <div class="sub">SITUATION ${String(i+1).padStart(2,'0')}　${DIST_NAME[sit.dist]}　vs ${FIGHTERS[sit.fighter||curFighter].name}</div>
    <div class="verdict" style="font-size:clamp(26px,8vw,40px)">${sit.title}</div>
    <div class="stars">${STAR(Progress.stars(sit.id))}</div>
    <div class="note" style="margin-top:20px;text-align:left">${sit.brief}</div>
    <div class="stats" style="margin:22px 0 0">
      <div class="stat"><span>目標</span><span>${goalText(sit)}</span></div>
      <div class="stat"><span>操作</span><span>${sit.hint}</span></div>
      <div class="stat"><span>★★</span><span>被弾なし</span></div>
      <div class="stat"><span>★★★</span><span>PERFECT ${sit.star3?sit.star3.perfect:'-'} 回以上</span></div>
    </div>`;
  go('brief');
}

function startFight(mode,sit){
  Audio_.resume();
  Fight.reset(mode, DIFF[curDiff], Fight.offsetMs, sit, curFighter);
  Input.clear(); Clock.reset(); SlowFx.init();
  Arms.L.init=Arms.R.init=false;
  go('fight');
}

function resultBtn(){ return el('ovResult').querySelector('[data-act],[data-act="situations"],[data-act="next-sit"]'); }

function showResult(){
  const F=Fight, s=F.stats;
  if(F.mode==='situation'){ showSitResult(); return; }
  const btn=el('ovResult').querySelectorAll('.btn')[1];
  btn.textContent='タイトルへ'; btn.dataset.act='title';
  const sc=F.score();
  const win=F.win;
  const reason={KO:'KO',TAKEDOWN:'TAKEDOWN',DECISION:'DECISION',SEQUENCE:'SEQUENCE'}[F.endReason]||'';
  const acc = s.perfect+s.good+s.early+s.late+s.miss;
  const rate = acc? Math.round((s.perfect+s.good)/acc*100):0;
  el('resultBody').innerHTML=`
    <div class="verdict ${win?'win':'lose'}">${win?'WIN':'LOSE'}</div>
    <div class="sub">${reason}</div>
    <div class="stats">
      <div class="stat hl"><span>PERFECT</span><span>${s.perfect}</span></div>
      <div class="stat"><span>GOOD</span><span>${s.good}</span></div>
      <div class="stat"><span>EARLY / LATE</span><span>${s.early} / ${s.late}</span></div>
      <div class="stat"><span>MISS</span><span>${s.miss}</span></div>
      <div class="stat"><span>防御成功率</span><span>${rate}%</span></div>
      <div class="stat hl"><span>見切り成功</span><span>${s.reads} / ${s.reads+s.noRead}</span></div>
      <div class="stat"><span>完全な見切り</span><span>${s.readPerfect}</span></div>
      <div class="stat"><span>最大連続</span><span>${F.streakBest||0}</span></div>
      <div class="stat"><span>ガード / スリップ</span><span>${s.guarded} / ${s.slipped}</span></div>
      <div class="stat"><span>距離変更</span><span>${s.distChanges} 回</span></div>

      <div class="stat hl"><span>SCORE</span><span>${sc}</span></div>
    </div>
    ${buildLog(F)}`;
  go('result');
}

const CH_JA={guard:'ガード',slipL:'左へ',slipR:'右へ',sway:'スウェー',sprawl:'スプロール',
             advance:'前進',intercept:'迎撃',attack:'攻撃'};
const READ_JA={PERFECT:'見切った',GOOD:'読んだ',LATE:'遅い'};
// 攻防を1行ずつ振り返れるようにする（§16 計測）
function buildLog(F){
  if(!F.log || !F.log.length) return '';
  const rows=F.log.map((r,i)=>{
    const rd = r.read ? `<span class="${r.read==='PERFECT'?'ok':'dim'}">${READ_JA[r.read]}</span>`
                      : '<span class="ng">押せず</span>';
    const res= r.ok ? `<span class="ok">${r.judge||'防いだ'}</span>`
                    : `<span class="ng">被弾 ${r.dmg||''}</span>`;
    return `<div class="lr"><span class="n">${i+1}</span>
      <span class="mv">${r.mv}</span>
      <span class="rd">${rd}</span>
      <span class="rs">${res}</span></div>`;
  }).join('');
  return `<div class="log"><div class="lh">攻防の内訳　　技 / 見切り / 結果</div>${rows}</div>`;
}

// ---- ループ ----
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const raw = last ? ts-last : 16; last=ts;
  Q.tick(raw);
  Clock.freeze = !!(Fight.hitstop && Clock.real<Fight.hitstop);
  Clock.tick(raw);
  Input.update();

  if(scene==='fight'){
    while(Input.queue.length) Fight.handleGesture(Input.queue.shift());
    Fight.update();
    if(Fight.over && Clock.real-Fight.overT>(Fight.mode==='situation'?1100:1700)) showResult();
  }else if(scene==='calib'){
    while(Input.queue.length){ const g=Input.queue.shift(); if(g.type==='TAP') Calib.tap(); }
    Calib.update();
  }else{
    Input.queue.length=0;
    Fight.demoUpdate();
  }

  updateCamera(Fight);
  Arms.update(Fight);
  SlowFx.update(Fight);
  render();
}

function computeLayout(F){
  const dv=F.distVisual;
  const ap=F.inIntro()? F.approachK() : 1;      // 対峙中は奥から詰めてくる
  V.approach=ap;
  V.scale=distScale(dv)*lerp(0.30,1,ap);
  V.bh=V.H*EB.height*V.scale;
  V.groundY=lerp(V.H*0.585, V.H*distLerp(DIST_GROUND,dv), ap);
}

function render(){
  const F=Fight;
  V.fist={x:0,y:0,r:0,active:false};
  computeLayout(F);
  drawBackground(F);
  ctx.save();
  SlowFx.applyZoom();                       // 減速に合わせて寄る
  ctx.translate(V.W/2 - F.p.camX, V.H/2 + F.p.camY);
  ctx.rotate(F.p.camRot);
  ctx.translate(-V.W/2, -V.H/2);
  drawCage(F);
  SlowFx.drawWorld();                       // 塵と残像
  drawOpponent(F);
  ctx.restore();

  // ---- ここまでが「ぼける世界」 ----
  SlowFx.radialBlur();
  drawSlowLayer(F);        // 暗転・集中線
  SlowFx.drawGrade();      // 彩度を抜き、相手だけ起こす

  // ---- ここから先は鮮明なまま重ねる ----
  ctx.save();
  SlowFx.applyZoom();
  ctx.translate(V.W/2 - F.p.camX, V.H/2 + F.p.camY);
  ctx.rotate(F.p.camRot);
  ctx.translate(-V.W/2, -V.H/2);
  if(V.fist && V.fist.active) drawSharpFist(V.fist);   // 迫る拳はぼかさない
  SlowFx.drawSweat();
  drawFx(F);
  drawAssist(F,'world');
  ctx.restore();

  if(scene==='fight'||scene==='result') Arms.draw(F);
  drawAssist(F,'screen');
  if(scene==='fight') drawBands(F);
  if(scene==='fight'||scene==='result') drawHUD(F);
  SlowFx.drawScreen(F);                     // フラッシュ・レターボックス・残り時間
  drawOverlayFx(F);
  if(scene==='calib') Calib.draw();
}

let vignetteCache=null, vignetteKey='';
function drawOverlayFx(F){
  const {W,H}=V;
  // 被弾フラッシュ
  const ht=(Clock.real-F.p.hurtT)/260;
  if(ht<1 && ht>=0){
    ctx.save(); ctx.globalAlpha=0.30*(1-ht);
    ctx.fillStyle=C.accent; ctx.fillRect(0,0,W,H); ctx.restore();
  }
  // ---- 縁の発光：成功／被弾／見切りを一目で ----
  const et=(Clock.real-(F.edgeT||-9999))/420;
  if(et>=0 && et<1){
    const col={read:'207,228,255', ok:'232,226,212', hurt:'255,59,48', dim:'127,147,181'}[F.edgeKind]||'232,226,212';
    const a=(1-easeOut(et))*(F.edgeKind==='hurt'?0.85:0.6);
    ctx.save();
    const th=Math.min(W,H)*0.085;
    const eg=ctx.createLinearGradient(0,0,0,th);
    eg.addColorStop(0,`rgba(${col},${a})`); eg.addColorStop(1,`rgba(${col},0)`);
    ctx.fillStyle=eg; ctx.fillRect(0,0,W,th);
    const eg2=ctx.createLinearGradient(0,H,0,H-th);
    eg2.addColorStop(0,`rgba(${col},${a})`); eg2.addColorStop(1,`rgba(${col},0)`);
    ctx.fillStyle=eg2; ctx.fillRect(0,H-th,W,th);
    const eg3=ctx.createLinearGradient(0,0,th,0);
    eg3.addColorStop(0,`rgba(${col},${a*0.8})`); eg3.addColorStop(1,`rgba(${col},0)`);
    ctx.fillStyle=eg3; ctx.fillRect(0,0,th,H);
    const eg4=ctx.createLinearGradient(W,0,W-th,0);
    eg4.addColorStop(0,`rgba(${col},${a*0.8})`); eg4.addColorStop(1,`rgba(${col},0)`);
    ctx.fillStyle=eg4; ctx.fillRect(W-th,0,th,H);
    ctx.restore();
  }

  // ビネット（毎フレーム作り直さない）
  const key=W+'x'+H;
  if(vignetteKey!==key){
    vignetteKey=key;
    vignetteCache=ctx.createRadialGradient(W*0.5,H*0.45,H*0.28,W*0.5,H*0.45,H*0.78);
    vignetteCache.addColorStop(0,'rgba(0,0,0,0)');
    vignetteCache.addColorStop(1,'rgba(3,5,10,0.55)');
  }
  ctx.fillStyle=vignetteCache; ctx.fillRect(0,0,W,H);
}

Object.assign(Fight,{
  demoUpdate(){
    const e=this.e;
    const bi=Math.floor(Clock.game/BEAT);
    if(bi!==this.lastBeatIdx){ this.lastBeatIdx=bi; e.legStep=1; }
    this.updateEnemyState();
    this.updateFx();
  },
});

document.addEventListener('click',ev=>{
  const fb=ev.target.closest('[data-ftr]');
  if(fb){ Audio_.resume(); Audio_.ui(); curFighter=fb.dataset.ftr;
          setFighter(curFighter); buildFighters(); return; }
  const sb=ev.target.closest('[data-sit]');
  if(sb && !sb.disabled){ Audio_.resume(); Audio_.ui();
    buildBrief(SITUATIONS.find(x=>x.id===sb.dataset.sit)); return; }
  const b=ev.target.closest('[data-act],[data-diff]'); if(!b) return;
  Audio_.resume(); Audio_.ui();
  if(b.dataset.diff){
    curDiff=b.dataset.diff;
    document.querySelectorAll('[data-diff]').forEach(x=>x.dataset.on = x.dataset.diff===curDiff?'1':'0');
    return;
  }
  switch(b.dataset.act){
    case 'start-single': startFight('single'); break;
    case 'start-match' : startFight('match');  break;
    case 'situations'  : buildSituations(); go('sit'); break;
    case 'brief-go'    : startFight('situation', curSit); break;
    case 'next-sit'    : {
      const n=SITUATIONS[SITUATIONS.indexOf(curSit)+1];
      if(n) buildBrief(n); else { buildSituations(); go('sit'); }
      break; }
    case 'howto': buildHowto(); go('howto'); break;
    case 'close-howto': go('title'); break;
    case 'calib': Calib.start(); go('calib'); break;
    case 'retry': startFight(Fight.mode, Fight.sit); break;
    case 'ftr': break;
    case 'title': go('title'); break;
  }
});

Input.bind(cv);
Input.onFirstTouch=()=>{ Audio_.resume(); Input.onFirstTouch=null; };
resize();
try{ const o=localStorage.getItem('maai.offset'); if(o!==null) Fight.offsetMs=parseInt(o,10)||0; }catch(e){}

Fight.reset('match',DIFF[curDiff],Fight.offsetMs,null,curFighter);
document.querySelectorAll('[data-diff]').forEach(x=>x.dataset.on = x.dataset.diff===curDiff?'1':'0');
go('title');
requestAnimationFrame(frame);
