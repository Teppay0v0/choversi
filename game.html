  const playerColor = getPlayerColor();
  const aiColor = playerColor === 'D' ? 'L' : 'D';
  const aiLevel = getAILevel();
  const mode = getCurrentMode();
  state = {
    board: createBoard(),
    turn: 'D',
    playerColor, // ユーザーが操作する色
    aiColor,     // AIが操作する色
    aiLevel,     // 1〜99
    mode,        // 'campaign' | 'single'
    hands: {
      D: ensureStrongCardInHand(shuffleDeck(DECK_TEMPLATES.D), HAND_SIZE_D)
           .map(s => ({ skill: s, used: false })),
      // 初心者モード時は白も強カード保証して連鎖が起きやすく
      L: (isBeginnerMode()
           ? ensureStrongCardInHand(shuffleDeck(DECK_TEMPLATES.L), HAND_SIZE_L)
           : shuffleDeck(DECK_TEMPLATES.L)
         ).map(s => ({ skill: s, used: false }))
    },
    selectedSkill: -1,
    pendingAction: null,            // 'vanish-target' | 'muko-target' | null
    chainCount: 0,
    triggeredThisChain: new Set(),
    nullifiedCells: new Set(),      // "r,c" of nullified skill stones
    // 視界制限：各プレイヤー（人間/AI）が見える "相手の" 異能石の座標
    revealedToD: new Set(),         // Dから見える相手(L)の異能石
    revealedToL: new Set(),         // Lから見える相手(D)の異能石
    // Phase 2: 各色が発動済みの異能（誰でも見えた発動の集合）
    firedAbilities: { D: new Set(), L: new Set() },
    busy: false,
    ended: false,
    passes: 0,
    log: [],
    aiMode: aiOn,
    // 試合中の統計（バッジ判定用）
    gameStats: {
      turns: 0,
      maxChain: 0,
      bakudanMaxFlip: 0,
      skillsFired: {},        // skill name → count
      cornersLost: 0,         // 試合中に相手に取られた角（一度でも）
      oppChains: 0,           // 相手の連鎖回数
      wasBehind: false,       // 一度でも劣勢になった
      aiLevel,
    },
  };
  // ロールラベル更新
  const roleD = document.getElementById('role-D');
  const roleL = document.getElementById('role-L');
  if (roleD) roleD.textContent = (playerColor === 'D' ? 'YOU' : 'CPU') + ' · D';
  if (roleL) roleL.textContent = (playerColor === 'L' ? 'YOU' : 'CPU') + ' · L';
  // パネル順序＆スタイル：プレイヤーは下（パネル内のスタイルもクラスで切替）
  document.body.dataset.player = playerColor;
  const dPanel = document.getElementById('panel-D');
  const lPanel = document.getElementById('panel-L');
  if (playerColor === 'D') {
    dPanel.classList.add('panel-player');    dPanel.classList.remove('panel-ai');
    lPanel.classList.add('panel-ai');        lPanel.classList.remove('panel-player');
  } else {
    dPanel.classList.add('panel-ai');        dPanel.classList.remove('panel-player');
    lPanel.classList.add('panel-player');    lPanel.classList.remove('panel-ai');
  }
  hideResult();
  log('NEW GAME', aiOn ? 'vs AI' : 'vs Human');
  // GA4: ゲーム開始イベント
  track('game_start', {
    mode: state.mode,
    ai_level: state.aiLevel,
    player_color: playerColor,
    beginner_mode: isBeginnerMode(),
  });
  render();
  triggerAIIfNeeded();
}

function toggleAI() {
  state.aiMode = document.getElementById('ai-mode').checked;
  log('AI mode', state.aiMode ? 'ON' : 'OFF');
  triggerAIIfNeeded();
}

function createBoard() {
  const b = [];
  for (let r = 0; r < N; r++) {
    const row = [];
    for (let c = 0; c < N; c++) row.push(emptyCell());
    b.push(row);
  }
  b[3][3] = stone('L'); b[3][4] = stone('D');
  b[4][3] = stone('D'); b[4][4] = stone('L');
  return b;
}
function emptyCell() { return { color: null, skill: null, owner: null, hantenUsed: false }; }
function stone(color, skill = null, owner = null) {
  return { color, skill, owner: owner || color, hantenUsed: false };
}

// ============================================================
//  REVERSI LOGIC
// ============================================================
function getFlipsForPlace(r, c, color) {
  const flips = [];
  const opp = color === 'D' ? 'L' : 'D';
  for (const [dr, dc] of DIRS_8) {
    const line = [];
    let nr = r + dr, nc = c + dc;
    while (inb(nr, nc)) {
      const cell = state.board[nr][nc];
      if (cell.color === opp) line.push([nr, nc]);
      else if (cell.color === color) { flips.push(...line); break; }
      else break;
      nr += dr; nc += dc;
    }
  }
  return flips;
}

function getValidMoves(color) {
  const moves = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (state.board[r][c].color === null) {
      if (getFlipsForPlace(r, c, color).length > 0) moves.push([r, c]);
    }
  }
  return moves;
}

function inb(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============================================================
//  PREVIEW (ホバーで影響範囲を可視化)
// ============================================================
function getAffectedCells(r, c, skill, color) {
  const cells = new Set();
  const opp = color === 'D' ? 'L' : 'D';
  switch (skill) {
    case 'hogeki': {
      // 縦横3マス先までの石を反転
      for (const [dr, dc] of DIRS_4) {
        for (let k = 1; k <= 3; k++) {
          const nr = r + dr*k, nc = c + dc*k;
          if (!inb(nr, nc)) break;
          if (state.board[nr][nc].color !== null) cells.add(`${nr},${nc}`);
        }
      }
      break;
    }
    case 'tanchi': {
      // 反転は発生しない — プレビューでは相手の異能石位置のみ示す（情報用）
      for (const [dr, dc] of DIRS_4) {
        for (let k = 1; k <= 3; k++) {
          const nr = r + dr*k, nc = c + dc*k;
          if (!inb(nr, nc)) break;
          const cell = state.board[nr][nc];
          if (cell.color === opp && cell.skill) cells.add(`${nr},${nc}`);
        }
      }
      break;
    }
    case 'muko': {
      // 隣接の相手異能石
      for (const [dr, dc] of DIRS_8) {
        const nr = r + dr, nc = c + dc;
        if (!inb(nr, nc)) continue;
        const cell = state.board[nr][nc];
        if (cell.color === opp && cell.skill && !state.nullifiedCells.has(`${nr},${nc}`)) {
          cells.add(`${nr},${nc}`);
        }
      }
      break;
    }
    case 'zoshoku': {
      // 隣接空マス候補（ランダムで1つ選ばれる）
      for (const [dr, dc] of DIRS_8) {
        const nr = r + dr, nc = c + dc;
        if (inb(nr, nc) && state.board[nr][nc].color === null) {
          cells.add(`${nr},${nc}`);
        }
      }
      break;
    }
    case 'gyakushu': {
      // 8方向 × 2マス先までの石
      for (const [dr, dc] of DIRS_8) {
        for (let k = 1; k <= 2; k++) {
          const nr = r + dr*k, nc = c + dc*k;
          if (!inb(nr, nc)) break;
          if (state.board[nr][nc].color !== null) cells.add(`${nr},${nc}`);
        }
      }
      break;
    }
    case 'bakudan': {
      // 周囲8マス（裏返されると爆発する範囲）
      for (const [dr, dc] of DIRS_8) {
        const nr = r + dr, nc = c + dc;
        if (inb(nr, nc) && state.board[nr][nc].color !== null) {
          cells.add(`${nr},${nc}`);
        }
      }
      break;
    }
    // 虚像・反転は影響範囲なし
  }
  return cells;
}

function showPreview(r, c) {
  if (state.busy || state.ended) return;

  // 1) 配置済みの発動可能逆襲をホバー時：影響範囲プレビュー
  if (state.selectedSkill < 0 && isGyakushuEligible(r, c, state.turn)) {
    const affected = getAffectedCells(r, c, 'gyakushu', state.turn);
    document.querySelectorAll('.cell').forEach((el, i) => {
      const row = Math.floor(i / N);
      const col = i % N;
      if (affected.has(`${row},${col}`)) {
        el.classList.add('preview', 'preview-gyakushu');
      }
    });
    return;
  }

  // 2) 異能石を選択中：配置時の影響範囲プレビュー
  if (state.selectedSkill < 0) return;
  const card = state.hands[state.turn][state.selectedSkill];
  if (!card || card.used) return;
  const skill = card.skill;
  // 消滅は別フロー、逆襲は配置時には何も起きない
  if (skill === 'shoshitsu' || skill === 'gyakushu') return;
  // 配置可能マスのみプレビュー表示
  if (state.board[r][c].color !== null) return;
  if (getFlipsForPlace(r, c, state.turn).length === 0) return;

  const affected = getAffectedCells(r, c, skill, state.turn);
  if (affected.size === 0) return;
  const previewClass = `preview-${skill}`;
  document.querySelectorAll('.cell').forEach((el, i) => {
    const row = Math.floor(i / N);
    const col = i % N;
    if (affected.has(`${row},${col}`)) {
      el.classList.add('preview', previewClass);
    }
  });
}

function clearPreview() {
  document.querySelectorAll('.cell').forEach(el => {
    el.classList.remove('preview',
      'preview-hogeki','preview-tanchi','preview-muko',
      'preview-zoshoku','preview-bakudan','preview-gyakushu');
  });
}

// ============================================================
//  MOVE EXECUTION
// ============================================================
async function makeMove(r, c) {
  if (state.busy || state.ended) return;

  // Pending special action
  if (state.pendingAction === 'vanish-target') return execVanish(r, c);

  // 配置済みの逆襲石（3方囲まれ）クリック → 発動
  if (state.selectedSkill < 0 && isGyakushuEligible(r, c, state.turn)) {
    return fireGyakushuAt(r, c);
  }

  // ★ 必須：空マスでなければ配置できない（バグ修正）
  if (state.board[r][c].color !== null) return;

  // Standard placement check
  const flips = getFlipsForPlace(r, c, state.turn);
  if (flips.length === 0) return;

  state.busy = true;
  state.chainCount = 0;
  state.triggeredThisChain.clear();

  // Place stone (with optional skill)
  let placedSkill = null;
  if (state.selectedSkill >= 0) {
    const card = state.hands[state.turn][state.selectedSkill];
    // 安全策：選択したカードが既に使用済み or 存在しないなら通常石として扱う
    if (!card || card.used) {
      state.selectedSkill = -1;
    } else {
      placedSkill = card.skill;
      card.used = true;
      log(`${labelOf(state.turn)} placed`, `${ABILITIES[placedSkill].name} @ ${coord(r, c)}`, 'skill');
    }
  }
  if (!placedSkill) {
    log(`${labelOf(state.turn)} placed`, `通常石 @ ${coord(r, c)}`);
  }
  state.board[r][c] = stone(state.turn, placedSkill, state.turn);
  // 着手音
  SoundManager.playSE('place');
  render();
  await delay(420);

  // Trigger placed-skill ability (returns extra cells to flip)
  let extraFlips = [];
  if (placedSkill && ABILITIES[placedSkill].trigger === 'placed') {
    state.chainCount++;
    updateChainUI();
    extraFlips = await fireAbility(r, c, placedSkill, state.turn);
  }

  // Process all flips (Reversi + ability)
  await processFlipQueue([...flips, ...extraFlips], state.turn);

  // 統計：手数 / 劣勢経験 / 角の取られ
  if (state.gameStats) {
    state.gameStats.turns++;
    const sc = countScores();
    if (sc[state.playerColor] < sc[state.aiColor]) state.gameStats.wasBehind = true;
    const corners = [[0,0],[0,7],[7,0],[7,7]];
    let lost = 0;
    for (const [cr, cc] of corners) if (state.board[cr][cc].color === state.aiColor) lost++;
    if (lost > state.gameStats.cornersLost) state.gameStats.cornersLost = lost;
  }

  // Cleanup
  state.selectedSkill = -1;
  state.busy = false;
  state.passes = 0;
  state.chainCount = 0;
  updateChainUI();
  switchTurn();
  render();
  checkPassOrEnd();
  triggerAIIfNeeded();
}

async function processFlipQueue(initial, byColor) {
  const queue = [...initial];
  while (queue.length > 0) {
    const [r, c] = queue.shift();
    const newFlips = await flipOne(r, c, byColor);
    queue.push(...newFlips);
  }
}

async function flipOne(r, c, byColor) {
  const cell = state.board[r][c];
  if (!cell || cell.color === null) return [];

  const key = `${r},${c}`;

  // 反転: skip flip once, fire visual flash
  if (cell.skill === 'hanten' && !cell.hantenUsed && !state.nullifiedCells.has(key)) {
    cell.hantenUsed = true;
    // 効果を使い切ったら nullifiedCells にも入れて以降は通常石として扱う
    state.nullifiedCells.add(key);
    state.triggeredThisChain.add(key);
    state.chainCount++;
    updateChainUI();
    showFlash(r, c, 'hanten');
    log('反転 発動', `@ ${coord(r,c)}（裏返らず元のまま）`, 'skill');
    await delay(280);
    return [];
  }

  // Invert color
  const before = cell.color;
  cell.color = cell.color === 'D' ? 'L' : 'D';
  // 反転音（連鎖中の連射でも、cloneNode で重なり再生される）
  SoundManager.playSE('flip');
  showCellFlip(r, c);
  await delay(280);

  // Fire flipped-trigger ability
  if (cell.skill && !state.triggeredThisChain.has(key) && !state.nullifiedCells.has(key)) {
    const ab = ABILITIES[cell.skill];
    if (ab && ab.trigger === 'flipped') {
      state.triggeredThisChain.add(key);
      state.chainCount++;
      updateChainUI();
      log(`${ab.name} 発動`, `@ ${coord(r,c)}`, 'chain');
      const out = await fireAbility(r, c, cell.skill, cell.color);
      return out;
    }
  }
  return [];
}

// ============================================================
//  ABILITIES
// ============================================================
async function fireAbility(r, c, skillKey, byColor) {
  // 統計：自分の異能発動回数を記録
  if (state.gameStats && byColor === state.playerColor) {
    state.gameStats.skillsFired[skillKey] = (state.gameStats.skillsFired[skillKey] || 0) + 1;
  }
  // Phase 2: 発動した異能をその色の firedAbilities に追加（誰でも見える情報）
  if (state.firedAbilities && state.firedAbilities[byColor]) {
    state.firedAbilities[byColor].add(skillKey);
  }
  // 異能ごとの効果音（無いものは ability.mp3 にフォールバック）
  SoundManager.playSkill(skillKey);
  // 大演出：技名をドーンと表示
  showSkillBurst(skillKey);
  // 該当マスに大きめのグロー
  showAbilityGlow(r, c, skillKey, true);
  // 爆弾は画面シェイク
  if (skillKey === 'bakudan') {
    document.querySelector('.game').classList.add('shake');
    setTimeout(() => document.querySelector('.game').classList.remove('shake'), 500);
  }
  await delay(700);

  switch (skillKey) {
    case 'kyozo':
      // 1回発動後は通常石化（マーカー消える、再発動なし）
      state.nullifiedCells.add(`${r},${c}`);
      return [];

    case 'zoshoku': {
      const empties = [];
      for (const [dr, dc] of DIRS_8) {
        const nr = r + dr, nc = c + dc;
        if (inb(nr, nc) && state.board[nr][nc].color === null) empties.push([nr, nc]);
      }
      if (empties.length > 0) {
        const [tr, tc] = empties[Math.floor(Math.random() * empties.length)];
        state.board[tr][tc] = stone(byColor, null, byColor);
        showCellFlip(tr, tc);
        log('増殖', `→ ${coord(tr, tc)}に石生成`, 'skill');
      }
      // 効果発動済みマーキング → アイコンを薄く表示
      state.nullifiedCells.add(`${r},${c}`);
      return [];
    }

    case 'hogeki': {
      const out = [];
      for (const [dr, dc] of DIRS_4) {
        for (let k = 1; k <= 3; k++) {
          const nr = r + dr*k, nc = c + dc*k;
          if (!inb(nr, nc)) break;
          if (state.board[nr][nc].color !== null) out.push([nr, nc]);
        }
      }
      log('砲撃', `${out.length}枚を反転`, 'skill');
      // 効果発動済みマーキング
      state.nullifiedCells.add(`${r},${c}`);
      return out;
    }

    case 'tanchi': {
      // 反転しない・相手の異能石を露出するだけ
      const opp = byColor === 'D' ? 'L' : 'D';
      const revealSet = byColor === 'D' ? state.revealedToD : state.revealedToL;
      let revealed = 0;
      for (const [dr, dc] of DIRS_4) {
        for (let k = 1; k <= 3; k++) {
          const nr = r + dr*k, nc = c + dc*k;
          if (!inb(nr, nc)) break;
          const cell = state.board[nr][nc];
          if (cell.color === opp && cell.skill && !revealSet.has(`${nr},${nc}`)) {
            revealSet.add(`${nr},${nc}`);
            revealed++;
            // 露出演出：少し光らせる
            showAbilityGlow(nr, nc, cell.skill, false);
          }
        }
      }
      log('探知', revealed > 0 ? `相手の異能石 ${revealed}枚を露出` : '露出なし（範囲内に隠し異能なし）', 'skill');
      // 効果発動済みマーキング
      state.nullifiedCells.add(`${r},${c}`);
      return [];
    }

    case 'bakudan': {
      const out = [];
      for (const [dr, dc] of DIRS_8) {
        const nr = r + dr, nc = c + dc;
        if (inb(nr, nc) && state.board[nr][nc].color !== null) out.push([nr, nc]);
      }
      // 統計：プレイヤーの爆弾最大フリップ数
      if (state.gameStats && byColor === state.playerColor) {
        state.gameStats.bakudanMaxFlip = Math.max(state.gameStats.bakudanMaxFlip, out.length);
      }
      // self destruct
      state.board[r][c] = emptyCell();
      log('爆弾', `${out.length}枚を反転、自己消滅`, 'chain');
      return out;
    }

    case 'gyakushu': {
      const out = [];
      for (const [dr, dc] of DIRS_8) {
        for (let k = 1; k <= 2; k++) {
          const nr = r + dr*k, nc = c + dc*k;
          if (!inb(nr, nc)) break;
          if (state.board[nr][nc].color !== null) out.push([nr, nc]);
        }
      }
      log('逆襲', `${out.length}枚を反転`, 'skill');
      // 効果発動済みマーキング
      state.nullifiedCells.add(`${r},${c}`);
      return out;
    }

    case 'muko': {
      // 隣接の相手異能石をすべて無効化
      const opp = byColor === 'D' ? 'L' : 'D';
      let count = 0;
      for (const [dr, dc] of DIRS_8) {
        const nr = r + dr, nc = c + dc;
        if (!inb(nr, nc)) continue;
        const tCell = state.board[nr][nc];
        if (tCell.color === opp && tCell.skill && !state.nullifiedCells.has(`${nr},${nc}`)) {
          state.nullifiedCells.add(`${nr},${nc}`);
          count++;
        }
      }
      log('無効', `隣接の相手異能石 ${count}枚を無効化`, 'skill');
      // 効果発動済みマーキング（自身も）
      state.nullifiedCells.add(`${r},${c}`);
      return [];
    }

    default:
      return [];
  }
}

function execVanish(r, c) {
  const cell = state.board[r][c];
  const turn = state.turn;
  if (!cell || cell.color === null || cell.color === turn) {
    state.pendingAction = null;
    state.selectedSkill = -1;
    log('消滅', `→ 取消`);
    render();
    return;
  }
  // Mark used
  const idx = state.hands[turn].findIndex(s => s.skill === 'shoshitsu' && !s.used);
  if (idx >= 0) state.hands[turn][idx].used = true;
  state.board[r][c] = emptyCell();
  log('消滅', `${coord(r, c)}の石を消去`, 'skill');
  state.pendingAction = null;
  state.selectedSkill = -1;
  state.passes = 0;  // 行動したので連続パスカウンタをリセット
  switchTurn();
  render();
  checkPassOrEnd();
  triggerAIIfNeeded();
}

function execMuko(r, c) {
  const cell = state.board[r][c];
  const turn = state.turn;
  if (!cell || cell.color === null || cell.color === turn || !cell.skill) {
    state.pendingAction = null;
    state.selectedSkill = -1;
    log('無効', `→ 取消（対象不正）`);
    render();
    return;
  }
  const idx = state.hands[turn].findIndex(s => s.skill === 'muko' && !s.used);
  if (idx >= 0) state.hands[turn][idx].used = true;
  state.nullifiedCells.add(`${r},${c}`);
  log('無効', `${coord(r, c)}の${ABILITIES[cell.skill].name}を無効化`, 'skill');
  cell.skill = null;
  state.pendingAction = null;
  state.selectedSkill = -1;
  render();
  // Note: muko doesn't end turn; player must still place a stone
  // If AI used muko, continue AI thinking for placement
  triggerAIIfNeeded();
}

// ============================================================
//  逆襲 (placed → click eligible stone to fire)
// ============================================================
function isGyakushuEligible(r, c, color) {
  const cell = state.board[r][c];
  if (!cell || cell.skill !== 'gyakushu' || cell.owner !== color) return false;
  if (state.nullifiedCells.has(`${r},${c}`)) return false;
  let blocked = 0;
  for (const [dr, dc] of DIRS_4) {
    const nr = r + dr, nc = c + dc;
    if (!inb(nr, nc) || state.board[nr][nc].color !== null) blocked++;
  }
  return blocked >= 3;
}

function findEligibleGyakushu(color) {
  const list = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (isGyakushuEligible(r, c, color)) list.push([r, c]);
  }
  return list;
}

async function fireGyakushuAt(r, c) {
  if (state.busy || state.ended) return;
  if (!isGyakushuEligible(r, c, state.turn)) return;

  state.busy = true;
  state.chainCount = 1;
  state.triggeredThisChain.clear();
  updateChainUI();

  const flips = await fireAbility(r, c, 'gyakushu', state.turn);
  state.nullifiedCells.add(`${r},${c}`); // mark as used
  await processFlipQueue(flips, state.turn);

  state.busy = false;
  state.chainCount = 0;
  state.selectedSkill = -1;
  state.passes = 0;  // 行動したので連続パスカウンタをリセット
  updateChainUI();
  switchTurn();
  render();
  checkPassOrEnd();
  triggerAIIfNeeded();
}

// ============================================================
//  TURN MANAGEMENT
// ============================================================
function selectSkill(idx) {
  if (state.busy || state.ended) return;
  const turn = state.turn;
  const card = state.hands[turn][idx];
  if (!card || card.used) return;

  // 既に同じカードが選ばれている場合は何もしない（iOS の二重発火対策・誤操作防止）
  // 解除したい時は別のカードをタップ or 盤面をタップ or RESET
  if (state.selectedSkill === idx) return;

  state.selectedSkill = idx;
  state.confirmCell = null; // スキル切替で確定待ち解除
  if (card.skill === 'shoshitsu') {
    state.pendingAction = 'vanish-target';
  } else {
    state.pendingAction = null;
  }
  render();
}

function switchTurn() { state.turn = state.turn === 'D' ? 'L' : 'D'; }

function triggerAIIfNeeded() {
  if (state && state.aiMode && state.turn === state.aiColor && !state.busy && !state.ended) {
    setTimeout(aiThink, 1500);
  }
}

// パスの実行（自動／手動 共通）
async function executePass(player) {
  if (state.ended || state.busy) return;
  state.busy = true;
  showPassBurst(player);
  log(`${labelOf(player)} パス`, '配置不可');
  await delay(950);
  state.passes++;
  if (state.passes >= 2) {
    state.busy = false;
    endGame();
    return;
  }
  state.selectedSkill = -1;
  state.pendingAction = null;
  state.busy = false;
  switchTurn();
  render();
  checkPassOrEnd();
  triggerAIIfNeeded();
}

// パス通知の大演出（skill-burst 要素を再利用）
function showPassBurst(player) {
  const el = document.getElementById('skill-burst');
  if (!el) return;
  document.getElementById('burst-name').textContent = 'パス';
  document.getElementById('burst-en').textContent = `${labelOf(player)}・PASS`;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function passTurn() {
  if (state.busy || state.ended) return;
  // 配置可能な手がある時はパス不可
  if (getValidMoves(state.turn).length > 0) {
    log('パス不可', '配置可能な手があります');
    return;
  }
  executePass(state.turn);
}

// PASSボタン用：AIの手番中は無視
function userPassTurn() {
  if (state.aiMode && state.turn === state.aiColor) return;
  passTurn();
}

function checkPassOrEnd() {
  if (state.busy || state.ended) return;
  // 盤面が埋まっていたら即終局（パスを挟まない）
  let empty = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (state.board[r][c].color === null) empty++;
  }
  if (empty === 0) {
    setTimeout(() => { if (!state.ended) endGame(); }, 400);
    return;
  }
  // 配置不可なら自動パス
  const moves = getValidMoves(state.turn);
  if (moves.length === 0) {
    const player = state.turn;
    setTimeout(() => {
      if (state.ended || state.busy) return;
      if (state.turn !== player) return;
      executePass(player);
    }, 400);
  }
}

function endGame() {
  state.ended = true;
  const s = countScores();
  const winner = s.D > s.L ? '黒の勝利' : s.L > s.D ? '白の勝利' : '引き分け';
  log('GAME END', `黒 ${s.D} - 白 ${s.L} ｜ ${winner}`);

  // === 戦績更新・XP計算・バッジ判定 ===
  const myScore = s[state.playerColor], oppScore = s[state.aiColor];
  const margin = myScore - oppScore;
  const win = margin > 0, draw = margin === 0;
  const stats = getStats();
  const stt = stats; // alias

  stt.games++;
  if (win) {
    stt.wins++;
    stt.streakWin = (stt.streakWin || 0) + 1;
    stt.streakLoss = 0;
    if (stt.streakWin > (stt.maxStreakWin||0)) stt.maxStreakWin = stt.streakWin;
    stt.byColor[state.playerColor].wins++;
    if (margin > (stt.biggestWinMargin||0)) stt.biggestWinMargin = margin;
    if (margin > 0 && margin < (stt.smallestWinMargin||99)) stt.smallestWinMargin = margin;
    if (margin <= 5) stt.closeWins = (stt.closeWins||0) + 1;
    // 同日連勝
    const today = new Date().toISOString().slice(0, 10);
    if (stt.sameDay.date === today) stt.sameDay.wins++;
    else stt.sameDay = { date: today, wins: 1 };
  } else if (draw) {
    stt.draws++;
    stt.streakWin = 0;
    stt.streakLoss = 0;
  } else {
    stt.losses++;
    stt.streakLoss = (stt.streakLoss || 0) + 1;
    stt.streakWin = 0;
    if (stt.streakLoss > (stt.maxStreakLoss||0)) stt.maxStreakLoss = stt.streakLoss;
    stt.byColor[state.playerColor].losses++;
  }

  // 異能の通算カウント
  for (const [k, v] of Object.entries(state.gameStats.skillsFired)) {
    stt.abilitiesUsed[k] = (stt.abilitiesUsed[k] || 0) + v;
  }
  // 連鎖の通算
  stt.maxChainEver = Math.max(stt.maxChainEver || 0, state.gameStats.maxChain);
  saveStats(stt);

  // XP / LV更新（キャンペーン時のみ）
  let xpDelta = 0, oldLv = null, newLv = null, oldXp = null, newXp = null;
  if (state.mode === 'campaign') {
    oldXp = loadNum(STORAGE.xp, 0);
    const before = xpToLevel(oldXp);
    oldLv = before.lv;
    if (win) xpDelta = margin;
    else if (draw) xpDelta = 2;
    else xpDelta = Math.floor(margin / 2); // negative, halved
    newXp = Math.max(0, oldXp + xpDelta);
    saveNum(STORAGE.xp, newXp);
    newLv = xpToLevel(newXp).lv;
  }

  // バッジ判定（lv = キャンペーンの累計LVを使う。シングルモードでもLV系バッジが暴発しないように）
  const cornersOwned = [[0,0],[0,7],[7,0],[7,7]]
    .filter(([r,c]) => state.board[r][c].color === state.playerColor).length;
  const campaignLv = xpToLevel(loadNum(STORAGE.xp, 0)).lv;
  const ctx = {
    stats: stt,
    lv: campaignLv,
    gameResult: { win, draw, margin, myScore, oppScore },
    gameStats: { ...state.gameStats, cornersOwned, prevLossStreak: stt.maxStreakLoss }
  };
  const newBadges = checkBadges(ctx);

  // GA4: ゲーム終了イベント
  track('game_end', {
    mode: state.mode,
    ai_level: state.aiLevel,
    result: win ? 'win' : (draw ? 'draw' : 'lose'),
    margin: margin,
    my_score: myScore,
    opp_score: oppScore,
    max_chain: state.gameStats.maxChain || 0,
    turns: state.gameStats.turns || 0,
    player_color: state.playerColor,
  });
  // GA4: LV up（キャンペーン時のみ）
  if (state.mode === 'campaign' && newLv != null && oldLv != null && newLv > oldLv) {
    track('lv_up', { from: oldLv, to: newLv });
  }
  // GA4: 新規バッジ獲得
  if (newBadges && newBadges.length > 0) {
    newBadges.forEach(b => track('badge_unlock', { badge_id: b.id, badge_name: b.name }));
  }

  showResult(s, winner, { xpDelta, oldLv, newLv, oldXp, newXp, newBadges, mode: state.mode });
}

function countScores() {
  let D = 0, L = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (state.board[r][c].color === 'D') D++;
    else if (state.board[r][c].color === 'L') L++;
  }
  return { D, L };
}

// ============================================================
//  AI OPPONENT
// ============================================================
const POS_WEIGHTS = [
  [120,-20, 20,  5,  5, 20,-20,120],
  [-20,-40, -5, -5, -5, -5,-40,-20],
  [ 20, -5, 15,  3,  3, 15, -5, 20],
  [  5, -5,  3,  3,  3,  3, -5,  5],
  [  5, -5,  3,  3,  3,  3, -5,  5],
  [ 20, -5, 15,  3,  3, 15, -5, 20],
  [-20,-40, -5, -5, -5, -5,-40,-20],
  [120,-20, 20,  5,  5, 20,-20,120],
];

const SKILL_BONUS = {
  bakudan: 12, hogeki: 11, gyakushu: 10,
  shoshitsu: 8, muko: 6,
  // 探知は情報カード — 反転しないので直接の評価は低め
  // （フェーズ2以降のAIで情報価値が上がる予定）
  tanchi: 4,
  zoshoku: 3, hanten: 2, kyozo: 1,
};

// レベル別のスコアリング設定を返す
function getAIProfile(lv) {
  // skillUseProb: 異能を使う確率 (0=絶対使わない, 1=必ず候補に入れる)
  // posWeightFactor: POS_WEIGHTSの倍率 (0=無視, 1=通常, 1.5=角を強く意識)
  // threatAvoid: X打ち / C打ち回避（角が空いている時に隣接マスを避ける）
  // lookahead: 0/1/2 — 先読み深さ
  // randomness: 候補から完全最善ではなくランダム性を加える割合（0=最善, 1=ランダム）
  // advFactor: LV85-99 で連続的に強くなる係数（1.0 → 1.8）
  // weightFactor: mobility/frontier/stable の評価重み倍率（1.0 → 3.0）— 鬼神を強化
  // lv: 評価関数で参照する元のレベル
  const advFactor    = lv >= 85 ? 1 + ((lv - 85) / 14) * 0.8 : 1;
  const weightFactor = lv >= 85 ? 1 + ((lv - 85) / 14) * 3.5 : 1;  // LV99 で 4.5 倍
  // LV1-9 でも異能を時々使う
  if (lv < 10)  return { skillUseProb: 0.25, posWeightFactor: 0,   threatAvoid: false, lookahead: 0, randomness: 0.95, advFactor, weightFactor, lv };
  if (lv < 20)  return { skillUseProb: 0.5,  posWeightFactor: 0.2, threatAvoid: false, lookahead: 0, randomness: 0.7, advFactor, weightFactor, lv };
  if (lv < 30)  return { skillUseProb: 0.7,  posWeightFactor: 0.5, threatAvoid: false, lookahead: 0, randomness: 0.4, advFactor, weightFactor, lv };
  if (lv < 50)  return { skillUseProb: 1.0,  posWeightFactor: 1.0, threatAvoid: false, lookahead: 0, randomness: 0.0, advFactor, weightFactor, lv };
  if (lv < 70)  return { skillUseProb: 1.0,  posWeightFactor: 1.0, threatAvoid: true,  lookahead: 0, randomness: 0.0, advFactor, weightFactor, lv };
  if (lv < 85)  return { skillUseProb: 1.0,  posWeightFactor: 1.2, threatAvoid: true,  lookahead: 1, randomness: 0.0, advFactor, weightFactor, lv };
  // LV85-99: 深い minimax 探索 + 強化された評価重み
  return                { skillUseProb: 1.0,  posWeightFactor: 1.3, threatAvoid: true,  lookahead: 2, randomness: 0.0, advFactor, weightFactor, lv };
}

// 角に隣接する危険マス（X打ち・C打ち）— 角が空いている時のみペナルティ
function isThreatCell(r, c, board) {
  // 4隅の各角について、角がまだ空いていればその隣接3マス（X1+C2）にペナルティ
  const corners = [[0,0],[0,7],[7,0],[7,7]];
  for (const [cr, cc] of corners) {
    if (board[cr][cc].color !== null) continue;
    const dr = cr === 0 ? 1 : -1, dc = cc === 0 ? 1 : -1;
    if ((r === cr+dr && c === cc) || (r === cr && c === cc+dc) || (r === cr+dr && c === cc+dc)) return true;
  }
  return false;
}

// === オセロ基礎評価ヘルパー ===
// Mobility（合法手数）— 多いほど選択肢が多く有利
function countMobility(board, color) {
  let count = 0;
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    if (board[r][c].color !== null) continue;
    for (const [dr, dc] of DIRS_8) {
      let nr = r + dr, nc = c + dc, found = false;
      while (inb(nr, nc) && board[nr][nc].color && board[nr][nc].color !== color) {
        nr += dr; nc += dc; found = true;
      }
      if (found && inb(nr, nc) && board[nr][nc].color === color) { count++; break; }
    }
  }
  return count;
}
// Frontier discs（空マスに隣接する自分の石）— 少ないほど良い
function countFrontier(board, color) {
  let count = 0;
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    if (board[r][c].color !== color) continue;
    for (const [dr, dc] of DIRS_8) {
      const nr = r + dr, nc = c + dc;
      if (inb(nr, nc) && board[nr][nc].color === null) { count++; break; }
    }
  }
  return count;
}
// 確定石（簡易：角から繋がる辺の同色連続）
function countStableEdgeStones(board, color) {
  const stable = new Set();
  const corners = [[0,0],[0,7],[7,0],[7,7]];
  for (const [cr, cc] of corners) {
    if (board[cr][cc].color !== color) continue;
    stable.add(`${cr},${cc}`);
    // 横方向の辺（角の行）に沿って同色を辿る
    const hdir = cc === 0 ? 1 : -1;
    for (let c = cc + hdir; c >= 0 && c < 8; c += hdir) {
      if (board[cr][c].color !== color) break;
      stable.add(`${cr},${c}`);
    }
    // 縦方向の辺（角の列）に沿って同色を辿る
    const vdir = cr === 0 ? 1 : -1;
    for (let r = cr + vdir; r >= 0 && r < 8; r += vdir) {
      if (board[r][cc].color !== color) break;
      stable.add(`${r},${cc}`);
    }
  }
  return stable.size;
}

// 1色から見たフラットな盤面評価値（オセロ基礎要素を統合）
function evaluateBoard(board, color, profile) {
  const opp = color === 'D' ? 'L' : 'D';
  const wf = profile.weightFactor || 1;
  let score = 0;
  // 位置の重み（角・X打ち・C打ちなど）
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    if (board[r][c].color === color)            score += POS_WEIGHTS[r][c] * profile.posWeightFactor;
    else if (board[r][c].color !== null)        score -= POS_WEIGHTS[r][c] * profile.posWeightFactor;
  }
  // Mobility（合法手の差）— LV85+ で大幅強化
  const myMob = countMobility(board, color);
  const oppMob = countMobility(board, opp);
  score += (myMob - oppMob) * 5 * wf;
  // Frontier（前線石の差）— 少ないほど良い
  const myFront = countFrontier(board, color);
  const oppFront = countFrontier(board, opp);
  score += (oppFront - myFront) * 2 * wf;
  // 確定石（多いほど絶対的に有利）
  const myStable = countStableEdgeStones(board, color);
  const oppStable = countStableEdgeStones(board, opp);
  score += (myStable - oppStable) * 10 * wf;
  // LV95+: 角の支配を強く評価（鬼神では特に重要）
  if (profile.lv >= 95) {
    const corners = [[0,0],[0,7],[7,0],[7,7]];
    const cornerBonus = (15 + ((profile.lv - 95) / 4) * 10) * wf;
    for (const [cr, cc] of corners) {
      if (board[cr][cc].color === color)         score += cornerBonus;
      else if (board[cr][cc].color !== null)     score -= cornerBonus;
    }
  }
  return score;
}

// 1手打った後の盤面をシミュレート（実stateを変えずに）
function simulatePlace(board, r, c, color) {
  // 簡易：通常の挟みフリップのみ。異能は計算外。
  const next = board.map(row => row.map(cell => ({ ...cell })));
  const flips = [];
  for (const [dr, dc] of DIRS_8) {
    const line = [];
    for (let k = 1; k < 8; k++) {
      const nr = r + dr*k, nc = c + dc*k;
      if (!inb(nr, nc)) break;
      const cell = next[nr][nc];
      if (cell.color === null) break;
      if (cell.color === color) { for (const p of line) flips.push(p); break; }
      line.push([nr, nc]);
    }
  }
  next[r][c] = { color, skill: null, owner: color };
  for (const [fr, fc] of flips) next[fr][fc].color = color;
  return next;
}

// 相手から見た最善応手のスコア（profile.lookahead == 1 なら1手読みに使う）
// 任意の盤面で color の合法手を返す（minimax 用）
function getValidMovesForBoard(board, color) {
  const moves = [];
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    if (board[r][c].color !== null) continue;
    for (const [dr, dc] of DIRS_8) {
      let nr = r + dr, nc = c + dc, found = false;
      while (inb(nr, nc) && board[nr][nc].color && board[nr][nc].color !== color) {
        nr += dr; nc += dc; found = true;
      }
      if (found && inb(nr, nc) && board[nr][nc].color === color) {
        moves.push([r, c]);
        break;
      }
    }
  }
  return moves;
}

// Move ordering：alpha-beta の枝刈り効率を上げるため、有望な手から試す
// POS_WEIGHTS が高い順にソート（角→辺→中央→X打ち）
function orderMoves(moves) {
  return moves.slice().sort((a, b) => POS_WEIGHTS[b[0]][b[1]] - POS_WEIGHTS[a[0]][a[1]]);
}

// Minimax with alpha-beta pruning + move ordering
function minimax(board, depth, alpha, beta, currentColor, me, profile) {
  if (depth === 0) {
    return evaluateBoard(board, me, profile);
  }
  const opp = me === 'D' ? 'L' : 'D';
  const otherColor = currentColor === 'D' ? 'L' : 'D';
  const moves = orderMoves(getValidMovesForBoard(board, currentColor));
  if (moves.length === 0) {
    const oppMoves = getValidMovesForBoard(board, otherColor);
    if (oppMoves.length === 0) return evaluateBoard(board, me, profile);
    return minimax(board, depth, alpha, beta, otherColor, me, profile);
  }
  if (currentColor === me) {
    let best = -Infinity;
    for (const [r, c] of moves) {
      const next = simulatePlace(board, r, c, currentColor);
      const v = minimax(next, depth - 1, alpha, beta, opp, me, profile);
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (const [r, c] of moves) {
      const next = simulatePlace(board, r, c, currentColor);
      const v = minimax(next, depth - 1, alpha, beta, me, me, profile);
      if (v < best) best = v;
      if (v < beta) beta = v;
      if (alpha >= beta) break;
    }
    return best;
  }
}

// LV と空マス数から探索深度を決定（鬼神は終盤でさらに深く）
function getSearchDepth(lv, emptyCount) {
  if (lv < 85) return 1;
  if (lv < 90) return 3;     // 旧 2 → 3
  if (lv < 95) return 4;     // 旧 3 → 4
  // LV95-99: 終盤拡張
  if (emptyCount <= 10) return 8;  // 終盤ほぼ完全読み（旧 6 → 8）
  if (emptyCount <= 14) return 6;  // 旧 5 → 6
  if (lv >= 99) return 5;          // LV99 中盤は 5（旧 4）
  return 4;
}

function opponentBestScore(board, oppColor, profile) {
  // 相手の有効手を全探索
  let oppMoves = [];
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    if (board[r][c].color !== null) continue;
    // 簡易validity check
    for (const [dr, dc] of DIRS_8) {
      let nr = r + dr, nc = c + dc, found = false;
      while (inb(nr, nc) && board[nr][nc].color && board[nr][nc].color !== oppColor) { nr+=dr; nc+=dc; found=true; }
      if (found && inb(nr, nc) && board[nr][nc].color === oppColor) { oppMoves.push([r,c]); break; }
    }
  }
  if (oppMoves.length === 0) return evaluateBoard(board, oppColor, profile);
  let best = -Infinity;
  for (const [r, c] of oppMoves) {
    const next = simulatePlace(board, r, c, oppColor);
    const s = evaluateBoard(next, oppColor, profile);
    if (s > best) best = s;
  }
  return best;
}

// Phase 4: LV85+ — 相手の最善応手を「異能の確率分布」を加味して評価
// AIは相手のプール（残デッキ）から、相手が異能を打った時の期待値を加算
function opponentBestScoreWithProbability(board, oppColor, profile, me) {
  const oppPool = getOpponentRemainingPool(me); // 自分視点での相手のプール
  let oppMoves = [];
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    if (board[r][c].color !== null) continue;
    for (const [dr, dc] of DIRS_8) {
      let nr = r + dr, nc = c + dc, found = false;
      while (inb(nr, nc) && board[nr][nc].color && board[nr][nc].color !== oppColor) { nr+=dr; nc+=dc; found=true; }
      if (found && inb(nr, nc) && board[nr][nc].color === oppColor) { oppMoves.push([r,c]); break; }
    }
  }
  if (oppMoves.length === 0) return evaluateBoard(board, oppColor, profile);

  let best = -Infinity;
  const oppPoolSize = Math.max(1, oppPool.length);
  const probBomb   = oppPool.includes('bakudan') ? 1 / oppPoolSize : 0;
  const probHogeki = oppPool.includes('hogeki')  ? 1 / oppPoolSize : 0;

  for (const [r, c] of oppMoves) {
    const next = simulatePlace(board, r, c, oppColor);
    let s = evaluateBoard(next, oppColor, profile);

    // 相手は1手で1異能しか使えないので、最も効果が高い1個を選ぶ想定で max を取る
    let abilityBonus = 0;
    if (probBomb > 0) {
      let blast = 0;
      for (const [dr, dc] of DIRS_8) {
        const nr = r + dr, nc = c + dc;
        if (inb(nr, nc) && board[nr][nc].color === me) blast++;
      }
      abilityBonus = Math.max(abilityBonus, probBomb * blast * 6 * profile.advFactor);
    }
    if (probHogeki > 0) {
      let cross = 0;
      for (const [dr, dc] of DIRS_4) {
        for (let k = 1; k <= 3; k++) {
          const nr = r + dr*k, nc = c + dc*k;
          if (!inb(nr, nc)) break;
          if (board[nr][nc].color === me) cross++;
        }
      }
      abilityBonus = Math.max(abilityBonus, probHogeki * cross * 3 * profile.advFactor);
    }
    s += abilityBonus;
    if (s > best) best = s;
  }
  return best;
}

function aiThink() {
  if (!state || state.busy || state.ended || state.turn !== state.aiColor || !state.aiMode) return;

  const me = state.aiColor;
  const opp = me === 'D' ? 'L' : 'D';
  const validMoves = getValidMoves(me);
  const profile = getAIProfile(state.aiLevel || 30);

  // No moves → pass
  if (validMoves.length === 0) {
    setTimeout(passTurn, 600);
    return;
  }

  const activeHand = getActiveHand(me);

  // === 高レベルのみ：消滅で高価値な石を消す（LV>=30） ===
  if (state.aiLevel >= 30) {
    const shoshitsuCard = activeHand.find(c => c.skill === 'shoshitsu');
    const shoshitsuIdx = shoshitsuCard ? shoshitsuCard.idx : -1;
    if (shoshitsuIdx >= 0) {
      const target = pickVanishTarget(me);
      if (target && target.score > 30) {
        log('AI', `消滅 → ${coord(target.r, target.c)}`);
        state.selectedSkill = shoshitsuIdx;
        state.pendingAction = 'vanish-target';
        setTimeout(() => execVanish(target.r, target.c), 800);
        return;
      }
    }
  }

  // === LV>=20：盤上の逆襲石が発動可能なら、まずそれを撃つ ===
  if (state.aiLevel >= 20) {
    const ready = findEligibleGyakushu(me);
    if (ready.length > 0) {
      const [gr, gc] = ready[0];
      log('AI', `逆襲 発動 @ ${coord(gr, gc)}`);
      setTimeout(() => fireGyakushuAt(gr, gc), 800);
      return;
    }
  }

  // === 候補手の評価（LV別重み付け） ===
  const useFlipRisk = (state.aiLevel || 30) >= 70; // Phase 3
  const useFrontierAvoid = (state.aiLevel || 30) >= 50; // オセロ基礎：自分が前線石にならない手を優先
  const candidates = []; // {score, move, skillIdx}
  for (const [r, c] of validMoves) {
    const flips = getFlipsForPlace(r, c, me);
    let baseScore = profile.posWeightFactor * POS_WEIGHTS[r][c] + flips.length * 2;
    // X/C打ち回避
    if (profile.threatAvoid && isThreatCell(r, c, state.board)) baseScore -= 30;
    // オセロ基礎：自分の置く石が前線（空マス隣接）になる手は減点
    if (useFrontierAvoid) {
      let emptyNeighbors = 0;
      for (const [dr, dc] of DIRS_8) {
        const nr = r + dr, nc = c + dc;
        if (inb(nr, nc) && state.board[nr][nc].color === null) emptyNeighbors++;
      }
      baseScore -= emptyNeighbors * 1.5;
    }
    // Phase 3: 確率的フリップリスク評価（LV70+）
    if (useFlipRisk) baseScore -= computeFlipRisk(me, r, c);
    // 先読み：LV85+ は alpha-beta minimax、LV70-84 は従来の 1-ply 評価
    if (profile.lookahead >= 1) {
      const next = simulatePlace(state.board, r, c, me);
      const lv = state.aiLevel || 30;
      if (lv >= 85) {
        // 鬼神級：深い minimax（空マスに応じて 2〜6 ply）
        let emptyCount = 0;
        for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) {
          if (next[rr][cc].color === null) emptyCount++;
        }
        const depth = getSearchDepth(lv, emptyCount);
        const score = minimax(next, depth, -Infinity, Infinity, opp, me, profile);
        baseScore = baseScore * 0.15 + score;
      } else {
        // LV70-84：軽量1-ply
        const myEval = evaluateBoard(next, me, profile);
        const oppBest = opponentBestScore(next, opp, profile);
        baseScore = baseScore * 0.3 + myEval - oppBest * 0.6;
      }
    }
    candidates.push({ score: baseScore, move: [r, c], skillIdx: -1 });

    // 異能を使う候補
    if (Math.random() < profile.skillUseProb) {
      activeHand.forEach((card) => {
        const skill = card.skill;
        if (skill === 'shoshitsu') return;
        const sScore = baseScore + (SKILL_BONUS[skill] || 0) + skillContextBonus(r, c, skill, me);
        candidates.push({ score: sScore, move: [r, c], skillIdx: card.idx });
      });
    }
  }

  if (candidates.length === 0) return;
  // ランダム性：低レベルでは上位N手から無作為選択
  candidates.sort((a, b) => b.score - a.score);
  let pickIdx = 0;
  if (profile.randomness > 0) {
    const poolSize = Math.max(1, Math.floor(candidates.length * profile.randomness));
    pickIdx = Math.floor(Math.random() * poolSize);
  }
  const best = candidates[pickIdx];

  if (best.move) {
    if (best.skillIdx >= 0) {
      state.selectedSkill = best.skillIdx;
      log('AI', `${ABILITIES[state.hands[me][best.skillIdx].skill].name} → ${coord(best.move[0], best.move[1])} (LV${state.aiLevel})`);
    } else {
      log('AI', `通常石 → ${coord(best.move[0], best.move[1])} (LV${state.aiLevel})`);
    }
    setTimeout(() => makeMove(best.move[0], best.move[1]), 800);
  }
}

function scoreMove(r, c, color) {
  const flips = getFlipsForPlace(r, c, color);
  return POS_WEIGHTS[r][c] + flips.length * 2;
}

function skillContextBonus(r, c, skill, color) {
  // Heuristic bonuses based on placement context
  if (skill === 'bakudan') {
    // Better when surrounded by enemies (likely to be flipped)
    let enemies = 0;
    for (const [dr, dc] of DIRS_8) {
      const nr = r + dr, nc = c + dc;
      if (inb(nr, nc) && state.board[nr][nc].color && state.board[nr][nc].color !== color) enemies++;
    }
    return enemies * 1.5;
  }
  if (skill === 'hogeki') {
    // 反転対象（敵石）が多いほど高評価
    let count = 0;
    for (const [dr, dc] of DIRS_4) {
      for (let k = 1; k <= 3; k++) {
        const nr = r + dr*k, nc = c + dc*k;
        if (!inb(nr, nc)) break;
        if (state.board[nr][nc].color && state.board[nr][nc].color !== color) count++;
      }
    }
    return count * 1.2;
  }
  if (skill === 'tanchi') {
    // 探知は情報カード：範囲内の未露出の相手異能石が多いほど価値が高い
    let infoCount = 0;
    const opp = color === 'D' ? 'L' : 'D';
    const known = color === 'D' ? state.revealedToD : state.revealedToL;
    for (const [dr, dc] of DIRS_4) {
      for (let k = 1; k <= 3; k++) {
        const nr = r + dr*k, nc = c + dc*k;
        if (!inb(nr, nc)) break;
        const cell = state.board[nr][nc];
        if (cell.color === opp && cell.skill && !known.has(`${nr},${nc}`)) infoCount++;
      }
    }
    // Phase 2: LV50+ は残デッキに強カード（コスト3）が多いほど探知の価値↑
    let perInfoBonus = 2;
    const lv = state.aiLevel || 30;
    if (lv >= 50) {
      const pool = getOpponentRemainingPool(color);
      const strongLeft = pool.filter(s => ABILITIES[s].cost >= 3).length;
      perInfoBonus = 2 + strongLeft * 1.5;
      // Phase 3: LV70+ は爆弾が残っている時に大幅ブースト
      if (lv >= 70 && pool.includes('bakudan')) perInfoBonus += 4;
      // Phase 4 強化: LV90+ は序盤に積極的に探知を打つ
      if (lv >= 90) {
        let empty = 0;
        for (let r2 = 0; r2 < N; r2++) for (let c2 = 0; c2 < N; c2++) {
          if (state.board[r2][c2].color === null) empty++;
        }
        if (empty >= 40) {
          // 序盤：盤上の未露出相手異能の総数に応じて加算
          const opp = color === 'D' ? 'L' : 'D';
          const known = color === 'D' ? state.revealedToD : state.revealedToL;
          let totalUnrevealed = 0;
          for (let r2 = 0; r2 < N; r2++) for (let c2 = 0; c2 < N; c2++) {
            const cell = state.board[r2][c2];
            if (cell.color === opp && cell.skill && !known.has(`${r2},${c2}`)) totalUnrevealed++;
          }
          perInfoBonus += Math.min(8, totalUnrevealed * 2);
        }
      }
    }
    return infoCount * perInfoBonus;
  }
  if (skill === 'kyozo' || skill === 'hanten') {
    // Defensive — better in less critical positions, slight bonus
    return 0;
  }
  if (skill === 'zoshoku') {
    // Better near edges/corners
    return (r === 0 || r === 7 || c === 0 || c === 7) ? 5 : 0;
  }
  if (skill === 'muko') {
    // Bonus for adjacent enemy 異能石
    const opp = color === 'D' ? 'L' : 'D';
    let count = 0;
    for (const [dr, dc] of DIRS_8) {
      const nr = r + dr, nc = c + dc;
      if (!inb(nr, nc)) continue;
      const cell = state.board[nr][nc];
      if (cell.color === opp && cell.skill && !state.nullifiedCells.has(`${nr},${nc}`)) count++;
    }
    return count * 12;
  }
  if (skill === 'gyakushu') {
    // 既に何方向か囲まれている場所＝発動条件に近い → ボーナス
    let blocked = 0;
    for (const [dr, dc] of DIRS_4) {
      const nr = r + dr, nc = c + dc;
      if (!inb(nr, nc) || state.board[nr][nc].color !== null) blocked++;
    }
    return blocked * 4; // 既に2方塞がっていれば+8
  }
  return 0;
}

// Phase 3: 候補手のリスク評価（LV70+）
// 不明な相手異能石をフリップする確率に応じてリスク値を返す
// 主に "爆弾" の自爆フリップを警戒する。LV85+ ほど慎重に
function computeFlipRisk(me, r, c) {
  const flips = getFlipsForPlace(r, c, me);
  if (flips.length === 0) return 0;
  const aiRevealed = me === 'D' ? state.revealedToD : state.revealedToL;
  const pool = getOpponentRemainingPool(me);
  if (pool.length === 0) return 0;
  const bombInPool = pool.includes('bakudan') ? 1 : 0;
  const probBomb = bombInPool / pool.length;
  const probMuko = pool.includes('muko') ? 1 / pool.length : 0;
  // LV85+ は LV に応じて 16 → 24 に連続増加、LV70-84 は固定 10
  const lv = state.aiLevel || 30;
  let intensity = 10;
  if (lv >= 85) intensity = 16 + ((lv - 85) / 14) * 8;
  let risk = 0;
  for (const [fr, fc] of flips) {
    const cell = state.board[fr][fc];
    if (cell.color !== me && cell.skill && !aiRevealed.has(`${fr},${fc}`)) {
      risk += probBomb * intensity + probMuko * 2;
    }
  }
  return risk;
}

// Phase 2: 相手の "残っている可能性のある異能の集合" を返す
// 全異能 - 既に発動した異能 - 露出済み盤上異能 = 推定プール（手札+伏せ盤上石）
function getOpponentRemainingPool(me) {
  const opp = me === 'D' ? 'L' : 'D';
  const fired = state.firedAbilities ? state.firedAbilities[opp] : new Set();
  const revealedTo = me === 'D' ? state.revealedToD : state.revealedToL;
  const knownOnBoard = new Set();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const cell = state.board[r][c];
    if (cell.color === opp && cell.skill && revealedTo && revealedTo.has(`${r},${c}`)) {
      knownOnBoard.add(cell.skill);
    }
  }
  return FULL_DECK.filter(s => !fired.has(s) && !knownOnBoard.has(s));
}

function pickVanishTarget(me) {
  // フェアAI：相手の伏せ異能の中身は見えない。
  // 露出済み（自分の探知 or 反転で発覚）の異能だけを高評価できる。
  const aiRevealed = me === 'D' ? state.revealedToD : state.revealedToL;
  // Phase 2: LV50+ なら残デッキの平均コストで「不明な異能」の期待値を計算
  const useDeckTracking = (state.aiLevel || 30) >= 50;
  let avgUnknownCost = 2;
  if (useDeckTracking) {
    const pool = getOpponentRemainingPool(me);
    if (pool.length > 0) {
      avgUnknownCost = pool.reduce((s, sk) => s + ABILITIES[sk].cost, 0) / pool.length;
    }
  }
  let best = null;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const cell = state.board[r][c];
    if (cell.color && cell.color !== me) {
      let score = POS_WEIGHTS[r][c];
      const skillKnown = cell.skill && aiRevealed.has(`${r},${c}`);
      if (skillKnown) {
        score += (ABILITIES[cell.skill].cost * 8);
      } else if (cell.skill) {
        // 不明異能：LV50+ は残デッキの平均コスト × 6 で期待値評価
        // それ未満は固定 +6 のままで「警戒だけ」
        score += useDeckTracking ? (avgUnknownCost * 6) : 6;
      }
      if (!best || score > best.score) best = { r, c, score };
    }
  }
  return best;
}

function pickMukoTarget(me) {
  // フェアAI：露出済みの異能か、自分が置いた異能だけを対象にできる
  const aiRevealed = me === 'D' ? state.revealedToD : state.revealedToL;
  const showAll = document.getElementById('show-all').checked;
  let best = null;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const cell = state.board[r][c];
    if (cell.color && cell.color !== me && cell.skill && !state.nullifiedCells.has(`${r},${c}`)) {
      const known = showAll || cell.owner === me || aiRevealed.has(`${r},${c}`);
      if (!known) continue;
      const score = ABILITIES[cell.skill].cost;
      if (score >= 2 && (!best || score > best.score)) best = { r, c, score };
    }
  }
  return best;
}

function countEligibleGyakushu(me) {
  let n = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const cell = state.board[r][c];
    if (cell.skill === 'gyakushu' && cell.owner === me) {
      let blocked = 0;
      for (const [dr, dc] of DIRS_4) {
        const nr = r + dr, nc = c + dc;
        if (!inb(nr, nc) || state.board[nr][nc].color !== null) blocked++;
      }
      if (blocked >= 3) n++;
    }
  }
  return n;
}

// ============================================================
//  RENDER
// ============================================================
function render() {
  renderBoard();
  renderHands();
  renderStatus();
  renderScores();
  renderActivePanel();
  renderPassButton();
}

function renderPassButton() {
  const btn = document.getElementById('pass-btn');
  if (!btn) return;
  const canPass = !state.busy && !state.ended &&
                  getValidMoves(state.turn).length === 0;
  btn.disabled = !canPass;
  btn.classList.toggle('btn-disabled', !canPass);
  btn.title = canPass ? '' : '配置可能な手があるときはパスできません';
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const validMoves = (state.busy || state.pendingAction) ? new Set()
    : new Set(getValidMoves(state.turn).map(([r,c]) => `${r},${c}`));
  const showAll = document.getElementById('show-all').checked;
  const targetMode = state.pendingAction !== null;

  // 逆襲発動可能バナー：自分の逆襲石が3方囲まれている時に表示
  const banner = document.getElementById('gyakushu-banner');
  if (banner) {
    const hasReadyGyakushu = !state.busy && !state.ended && (() => {
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        if (isGyakushuEligible(r, c, state.turn)) return true;
      }
      return false;
    })();
    banner.classList.toggle('show', hasReadyGyakushu);
  }

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const cell = state.board[r][c];
      const div = document.createElement('div');
      div.className = 'cell' + ((r + c) % 2 ? ' alt' : '');

      if (validMoves.has(`${r},${c}`)) div.classList.add('placeable');
      if (state.confirmCell && state.confirmCell.r === r && state.confirmCell.c === c) {
        div.classList.add('confirm-pending');
      }

      // For target-selection mode, highlight valid targets
      if (targetMode && cell.color !== null) {
        const turn = state.turn;
        const isEnemy = cell.color !== turn;
        if (state.pendingAction === 'vanish-target' && isEnemy) {
          div.classList.add('target-mode');
        }
      }

      if (cell.color) {
        const stoneEl = document.createElement('div');
        stoneEl.className = 'stone ' + (cell.color === 'D' ? 'dark' : 'light');
        // 自分の逆襲が発動可能ならグロー
        if (isGyakushuEligible(r, c, state.turn) && !state.busy) {
          stoneEl.classList.add('gyakushu-ready');
        }
        // 「アクティブな異能石」=効果未消費＆無効化されていない
        const isActiveSkill = cell.skill
          && !state.nullifiedCells.has(`${r},${c}`)
          && !(cell.skill === 'hanten' && cell.hantenUsed);
        // 「使用済みの異能石」=効果消費 or 無効化されたが、アイコンは薄く残す
        const isUsedSkill = cell.skill && !isActiveSkill;
        // 自分のものは中身まで表示、相手のものは
        // - 探知で露出済みなら表示
        // - 未露出ならマーカーのみ（DEBUG時は全表示）
        const playerRevealedSet = state.aiMode
          ? (state.playerColor === 'D' ? state.revealedToD : state.revealedToL)
          : null;
        const ownedByPlayer = state.aiMode
          ? cell.owner === state.playerColor
          : cell.owner === state.turn;
        const revealedToPlayer = state.aiMode
          && playerRevealedSet
          && playerRevealedSet.has(`${r},${c}`);
        const visibleSkill = (isActiveSkill || isUsedSkill)
          && (showAll || ownedByPlayer || revealedToPlayer);
        if (visibleSkill) {
          const icon = document.createElement('img');
          const folder = cell.color === 'D' ? 'icons-black' : 'icons';
          icon.src = `${folder}/${cell.skill}.png`;
          icon.className = 'stone-icon' + (isUsedSkill ? ' stone-icon-used' : '');
          stoneEl.appendChild(icon);
        } else if (isActiveSkill) {
          // 「何かある」だけ伝えるマーカードット
          const marker = document.createElement('div');
          marker.className = 'stone-mystery';
          stoneEl.appendChild(marker);
        }
        div.appendChild(stoneEl);
      }

      div.onclick = () => {
        // AIの手番中はプレイヤーのタップを無視（誤入力防止）
        if (state.aiMode && state.turn === state.aiColor) return;
        makeMove(r, c);
      };
      div.onmouseenter = () => showPreview(r, c);
      div.onmouseleave = () => clearPreview();
      board.appendChild(div);
    }
  }
}

          // setPointerCapture で同一カードに固定（指がドラッグしても暴発しない）

          (function(idx) {
            div.addEventListener('pointerdown', (e) => {

              e.preventDefault();
              e.stopPropagation();
              selectSkill(idx);
            });
            // 二重発火防止：click は完全に無視
            div.addEventListener('click', (e) => {

              e.stopPropagation();
            });
          })(card.idx);

      hand.appendChild(div);
    });

// ============================================================
//  CELEBRATION (XP / LV / RANK animation)
// ============================================================
// NOTE: RANK_THRESHOLDS / RANK_NAMES are also defined in index.html as
//       RANK_PRESETS. Two sources today; consolidation is a future task.
const RANK_THRESHOLDS = [5, 15, 30, 50, 70, 85, 99];
const RANK_NAMES = { 5: '入門', 15: '初級', 30: '中級', 50: '上級', 70: '達人', 85: '名人', 99: '鬼神' };
const KISHIN_LV = 99;

// localStorage flag — UI is intentionally not exposed yet.
function isCelebrationMuted() {
  try { return localStorage.getItem('choversi.muteCelebration') === '1'; } catch (e) { return false; }
}

// --- WebAudio (lazy, single context) ---------------------------------------
let _audioCtx = null;
function audioCtx() {
  if (_audioCtx) return _audioCtx;
  try {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    _audioCtx = new Ctor();
  } catch (e) { return null; }
  return _audioCtx;
}
function playTone({ freq = 440, dur = 120, vol = 0.15, type = 'sine', sweepTo = null } = {}) {
  if (isCelebrationMuted()) return;
  const ctx = audioCtx();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if (sweepTo) {
      osc.frequency.exponentialRampToValueAtTime(sweepTo, ctx.currentTime + dur / 1000);
    }
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur / 1000);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur / 1000 + 0.05);
  } catch (e) { /* swallow */ }
}
function playChord(freqs, dur, vol = 0.18, type = 'sine') {
  for (const f of freqs) playTone({ freq: f, dur, vol, type });
}
function safeVibrate(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}

// --- Segment generation ----------------------------------------------------
function buildSegments(oldXp, newXp) {
  const oldS = xpToLevel(oldXp);
  const newS = xpToLevel(newXp);
  const segs = [];
  if (oldXp === newXp) {
    return [{ lv: oldS.lv, from: oldS.intoLv, to: oldS.intoLv, needForNext: oldS.needForNext, kind: 'flat' }];
  }
  const ascending = newXp > oldXp;
  if (oldS.lv === newS.lv) {
    return [{ lv: oldS.lv, from: oldS.intoLv, to: newS.intoLv, needForNext: oldS.needForNext, kind: ascending ? 'flat' : 'lvdown-flat' }];
  }
  if (ascending) {
    // First: fill remainder of oldLv
    segs.push({
      lv: oldS.lv, from: oldS.intoLv, to: oldS.needForNext, needForNext: oldS.needForNext,
      kind: 'lvup',
      intoRankLv: oldS.lv + 1,
      isRankUp: RANK_THRESHOLDS.includes(oldS.lv + 1),
      isKishin: (oldS.lv + 1) === KISHIN_LV,
    });
    // Middle: full levels
    for (let lv = oldS.lv + 1; lv < newS.lv; lv++) {
      const need = xpToNext(lv);
      segs.push({
        lv, from: 0, to: need, needForNext: need,
        kind: 'lvup',
        intoRankLv: lv + 1,
        isRankUp: RANK_THRESHOLDS.includes(lv + 1),
        isKishin: (lv + 1) === KISHIN_LV,
      });
    }
    // Final segment at newLv (no LV up unless we land exactly at full = next level which xpToLevel handles)
    segs.push({
      lv: newS.lv, from: 0, to: newS.intoLv, needForNext: newS.needForNext, kind: 'final-up',
    });
  } else {
    // LV down — bar reverses through transitions, no celebration.
    segs.push({ lv: oldS.lv, from: oldS.intoLv, to: 0, needForNext: oldS.needForNext, kind: 'lvdown' });
    for (let lv = oldS.lv - 1; lv > newS.lv; lv--) {
      const need = xpToNext(lv);
      segs.push({ lv, from: need, to: 0, needForNext: need, kind: 'lvdown' });
    }
    segs.push({ lv: newS.lv, from: newS.needForNext, to: newS.intoLv, needForNext: newS.needForNext, kind: 'final-down' });
  }
  return segs;
}

// --- Duration scheduling (auto-compress for many LV ups) -------------------
function getDurations(segCount) {
  if (segCount <= 2) return { barFill: 600, lvUp: 400 };
  if (segCount <= 4) return { barFill: 450, lvUp: 350 };
  if (segCount <= 6) return { barFill: 350, lvUp: 280 };
  if (segCount <= 12) return { barFill: 250, lvUp: 220 };
  // Extreme (only reachable via dev trigger / pathological inputs)
  return { barFill: 40, lvUp: 30 };
}

// --- Cancellable celebration runner ----------------------------------------
let activeCelebration = null;

function skipCelebration() {
  if (activeCelebration) activeCelebration.skip();
}

function nextFrame() {
  return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
}

function cancellableSleep(ms, ctx) {
  return new Promise(resolve => {
    if (ctx.skipRequested) return resolve();
    const id = setTimeout(() => {
      const idx = ctx.timers.indexOf(id);
      if (idx >= 0) ctx.timers.splice(idx, 1);
      resolve();
    }, ms);
    ctx.timers.push(id);
    ctx._waiters.push(resolve);
  });
}

function rafCount(ctx, durMs, onTick, onDone) {
  const start = performance.now();
  const tick = (now) => {
    if (ctx.skipRequested) return;
    const t = Math.min(1, (now - start) / durMs);
    // ease-out cubic
    const eased = 1 - Math.pow(1 - t, 3);
    onTick(eased);
    if (t < 1) {
      const id = requestAnimationFrame(tick);
      ctx.rafs.push(id);
    } else if (onDone) onDone();
  };
  const id = requestAnimationFrame(tick);
  ctx.rafs.push(id);
}

function spawnParticles(layer, count, kind, ctx) {
  if (!layer) return;
  const baseClass = 'particle ' + (kind === 'kishin' ? 'kishin' : kind === 'rank' ? 'rank' : '');
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = baseClass.trim();
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
    const dist = 50 + Math.random() * 60 + (kind === 'kishin' ? 60 : kind === 'rank' ? 30 : 0);
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    layer.appendChild(p);
    requestAnimationFrame(() => p.classList.add('fire'));
    const id = setTimeout(() => p.remove(), kind === 'kishin' ? 1500 : 800);
    ctx.timers.push(id);
  }
}

function buildCelebrationDom(parentEl, extra) {

  const wrap = document.createElement('div');

    <div class="xp-counter" id="cel-xp-counter">

      </div>
      <div class="celebration-bar">
        <div class="celebration-bar-fill" id="cel-bar-fill"></div>
        <div class="particle-layer" id="cel-particles"></div>
        <div class="lvup-burst" id="cel-burst">LV UP!</div>
      </div>
      <div class="celebration-xp-text" id="cel-xp-text">0 / ${xpToLevel(extra.oldXp).needForNext} XP</div>
    </div>

function renderBadgeUnlocks(parentEl, badges) {

// Set bar to a given % using a CSS transition, returns Promise that resolves on transitionend (or skip)
function animateBarTo(fillEl, fromPct, toPct, durMs, ctx) {
  return new Promise(resolve => {
    if (ctx.skipRequested) {
      fillEl.style.transition = 'none';
      fillEl.style.width = toPct + '%';
      return resolve();
    }
    fillEl.style.transition = 'none';
    fillEl.style.width = fromPct + '%';
    // force reflow
    void fillEl.offsetWidth;
    fillEl.style.transition = `width ${durMs}ms cubic-bezier(.25,.8,.4,1)`;
    fillEl.style.width = toPct + '%';
    let done = false;
    const onEnd = () => {
      if (done) return; done = true;
      fillEl.removeEventListener('transitionend', onEnd);
      resolve();
    };
    fillEl.addEventListener('transitionend', onEnd);
    // Safety timeout in case transitionend doesn't fire
    const id = setTimeout(onEnd, durMs + 80);
    ctx.timers.push(id);
    ctx._waiters.push(onEnd);
  });
}

async function playCelebration(extra) {
  // Cancel any already-running celebration
  if (activeCelebration) activeCelebration.skip();
  const ctx = {
    skipRequested: false,
    timers: [],
    rafs: [],
    _waiters: [],
    skip() {
      this.skipRequested = true;
      this.timers.forEach(clearTimeout);
      this.rafs.forEach(cancelAnimationFrame);
      this.timers.length = 0;
      this.rafs.length = 0;
      this._waiters.forEach(fn => { try { fn(); } catch (e) {} });
      this._waiters.length = 0;
    },
  };
  activeCelebration = ctx;

  const ext = document.getElementById('modal-extra');
  const skipBtn = document.getElementById('celebration-skip');
  const modalContent = document.querySelector('#result-modal .modal-content');
  if (modalContent) modalContent.classList.remove('rankup-aura', 'kishin-aura');

  // Single mode → just static label
  if (extra.mode === 'single') {
    ext.innerHTML = `<div class="single-mode">フリー対戦（LV ${state?.aiLevel ?? '—'}）</div>`;
    if (extra.newBadges && extra.newBadges.length) renderBadgeUnlocks(ext, extra.newBadges);
    activeCelebration = null;
    return;
  }

  // Campaign with no XP delta or non-numeric → fallback static
  if (extra.xpDelta == null) { activeCelebration = null; return; }

  // Build DOM
  buildCelebrationDom(ext, extra);
  if (skipBtn) skipBtn.classList.remove('hidden');

  const counterEl = document.getElementById('cel-xp-counter');
  const numEl = document.getElementById('cel-xp-num');
  const barRowEl = document.getElementById('cel-bar-row');
  const barFillEl = document.getElementById('cel-bar-fill');
  const lvNumEl = document.getElementById('cel-lv-num');
  const xpTextEl = document.getElementById('cel-xp-text');
  const burstEl = document.getElementById('cel-burst');
  const particleLayer = document.getElementById('cel-particles');

  const xpDelta = extra.xpDelta;
  const isLoss = xpDelta < 0;
  const isFlatXp = xpDelta === 0;

  // Phase 1: counter + sound
  await cancellableSleep(400, ctx); if (ctx.skipRequested) return finalize();
  counterEl.classList.add('show');
  if (isLoss) counterEl.classList.add('xp-loss');
  numEl.textContent = (xpDelta > 0 ? '+' : '') + '0';
  if (!isLoss && !isFlatXp) playTone({ freq: 440, dur: 60, vol: 0.12, type: 'sine' });
  // count up/down
  await new Promise(resolve => {
    if (ctx.skipRequested) { numEl.textContent = (xpDelta > 0 ? '+' : '') + xpDelta; return resolve(); }
    rafCount(ctx, 800, (e) => {
      const v = Math.round(xpDelta * e);
      numEl.textContent = (xpDelta > 0 ? '+' : (xpDelta < 0 ? '' : '+')) + v;
    }, () => resolve());
  });
  numEl.textContent = (xpDelta > 0 ? '+' : '') + xpDelta;
  if (!isLoss && !isFlatXp) playTone({ freq: 660, dur: 80, vol: 0.15, type: 'sine' });
  if (isLoss) playTone({ freq: 220, dur: 250, vol: 0.10, type: 'triangle' });

  // Phase 2: bar slide-in
  await cancellableSleep(180, ctx); if (ctx.skipRequested) return finalize();
  const segments = buildSegments(extra.oldXp, extra.newXp);
  const dur = getDurations(segments.length);
  // Initialize bar to first segment's "from"
  const first = segments[0];
  lvNumEl.textContent = first.lv;
  const initPct = first.needForNext > 0 ? (first.from / first.needForNext) * 100 : 0;
  barFillEl.style.transition = 'none';
  barFillEl.style.width = initPct + '%';
  xpTextEl.textContent = `${first.from} / ${first.needForNext} XP`;
  barRowEl.classList.add('show');
  await cancellableSleep(260, ctx);

  // Phase 3: per-segment animation
  for (let i = 0; i < segments.length; i++) {
    if (ctx.skipRequested) break;
    const seg = segments[i];
    lvNumEl.textContent = seg.lv;
    const fromPct = seg.needForNext > 0 ? (seg.from / seg.needForNext) * 100 : 0;
    const toPct = seg.needForNext > 0 ? (seg.to / seg.needForNext) * 100 : 0;
    // Update XP text via parallel RAF (separate from bar transition)
    const textStart = performance.now();
    const animateText = () => {
      if (ctx.skipRequested) { xpTextEl.textContent = `${seg.to} / ${seg.needForNext} XP`; return; }
      const t = Math.min(1, (performance.now() - textStart) / dur.barFill);
      const eased = 1 - Math.pow(1 - t, 3);
      const cur = Math.round(seg.from + (seg.to - seg.from) * eased);
      xpTextEl.textContent = `${cur} / ${seg.needForNext} XP`;
      if (t < 1) {
        const id = requestAnimationFrame(animateText);
        ctx.rafs.push(id);
      }
    };
    const txtRaf = requestAnimationFrame(animateText);
    ctx.rafs.push(txtRaf);

    await animateBarTo(barFillEl, fromPct, toPct, dur.barFill, ctx);
    if (ctx.skipRequested) break;

    // LV UP / RANK UP / 鬼神 effect (only at end of "lvup" segments)
    if (seg.kind === 'lvup') {
      // Bar flash
      barFillEl.classList.add('flash');
      const flashOff = setTimeout(() => barFillEl.classList.remove('flash'), 320);
      ctx.timers.push(flashOff);

      // Floating burst text
      if (seg.isKishin) {
        burstEl.textContent = '鬼神 到達';
        burstEl.className = 'lvup-burst kishin-text';
      } else if (seg.isRankUp) {
        burstEl.textContent = `RANK UP! ${RANK_NAMES[seg.intoRankLv]}`;
        burstEl.className = 'lvup-burst rankup-text';
      } else {
        burstEl.textContent = 'LV UP!';
        burstEl.className = 'lvup-burst';
      }
      // re-trigger animation
      void burstEl.offsetWidth;
      burstEl.classList.add('show');

      // Number pop
      lvNumEl.classList.remove('pop', 'rankup', 'kishin');
      void lvNumEl.offsetWidth;
      const popClass = seg.isKishin ? 'kishin' : seg.isRankUp ? 'rankup' : 'pop';
      lvNumEl.classList.add(popClass);
      // After short hold, swap to new LV number
      await cancellableSleep(120, ctx);
      lvNumEl.textContent = seg.lv + 1;

      // Particles
      const pcount = seg.isKishin ? 28 : seg.isRankUp ? 20 : 8;
      const pkind = seg.isKishin ? 'kishin' : seg.isRankUp ? 'rank' : 'std';
      spawnParticles(particleLayer, pcount, pkind, ctx);

      // Modal aura for rank-up (kishin uses different class)
      if (seg.isKishin && modalContent) {
        modalContent.classList.add('kishin-aura');
        const off = setTimeout(() => modalContent.classList.remove('kishin-aura'), 1500);
        ctx.timers.push(off);
      } else if (seg.isRankUp && modalContent) {
        modalContent.classList.add('rankup-aura');
        const off = setTimeout(() => modalContent.classList.remove('rankup-aura'), 800);
        ctx.timers.push(off);
      }

      // Sounds + vibration
      if (seg.isKishin) {
        playChord([523.25, 659.25, 783.99, 1046.5], 1000, 0.20, 'sine');
        safeVibrate(40);
      } else if (seg.isRankUp) {
        playChord([523.25, 659.25, 783.99], 400, 0.20, 'sine');
        safeVibrate(30);
      } else {
        playTone({ freq: 660, dur: 200, vol: 0.18, type: 'sine', sweepTo: 880 });
        safeVibrate(8);
      }

      // Hold for the LV-UP effect (compressed for many segs; rank-up always >= 500)
      const holdMs = seg.isKishin ? 1100 : seg.isRankUp ? 600 : dur.lvUp;
      await cancellableSleep(holdMs, ctx);
      if (ctx.skipRequested) break;

      // Reset visuals before next segment
      lvNumEl.classList.remove('pop', 'rankup', 'kishin');
      burstEl.classList.remove('show');
    }

    if (seg.kind === 'final-up' || seg.kind === 'flat' || seg.kind === 'final-down' || seg.kind === 'lvdown-flat') {
      // Sit on the final state briefly so the user reads it
      await cancellableSleep(220, ctx);
    }
  }

  // Phase 4: badge reveal
  if (!ctx.skipRequested) await cancellableSleep(180, ctx);
  finalize();

  function finalize() {
    // Apply final state regardless of skip path
    const finalLv = extra.newLv;
    const finalState = xpToLevel(extra.newXp);
    if (lvNumEl) {
      lvNumEl.textContent = finalLv;
      lvNumEl.classList.remove('pop', 'rankup', 'kishin');
    }
    if (barFillEl) {
      barFillEl.style.transition = 'none';
      const pct = finalState.needForNext > 0 ? (finalState.intoLv / finalState.needForNext) * 100 : 100;
      barFillEl.style.width = pct + '%';
      barFillEl.classList.remove('flash');
    }
    if (xpTextEl) xpTextEl.textContent = `${finalState.intoLv} / ${finalState.needForNext} XP`;
    if (numEl) numEl.textContent = (xpDelta > 0 ? '+' : '') + xpDelta;
    if (counterEl) counterEl.classList.add('show');
    if (barRowEl) barRowEl.classList.add('show');
    if (burstEl) burstEl.classList.remove('show');
    if (skipBtn) skipBtn.classList.add('hidden');
    if (extra.newBadges && extra.newBadges.length) renderBadgeUnlocks(ext, extra.newBadges);
    if (activeCelebration === ctx) activeCelebration = null;
  }
}

// --- Public showResult / hideResult ----------------------------------------
function showResult(s, winner, extra) {
  document.getElementById('modal-winner').textContent = winner;
  document.getElementById('modal-score-D').textContent = s.D;
  document.getElementById('modal-score-L').textContent = s.L;
  // 勝敗音
  if (extra && extra.mode) {
    if (winner.includes(state.playerColor === 'D' ? '黒' : '白') && winner.includes('勝利')) {
      SoundManager.playSE('victory');
    } else if (!winner.includes('引き分け')) {
      SoundManager.playSE('defeat');
    }
    // バッジ獲得があったら少し遅らせて演出
    if (extra.newBadges && extra.newBadges.length > 0) {
      setTimeout(() => SoundManager.playSE('badge'), 800);
    }
  }
  const ext = document.getElementById('modal-extra');
  if (ext) ext.innerHTML = '';
  const skipBtn = document.getElementById('celebration-skip');
  if (skipBtn) skipBtn.classList.add('hidden');
  const modalContent = document.querySelector('#result-modal .modal-content');
  if (modalContent) modalContent.classList.remove('rankup-aura', 'kishin-aura');
  document.getElementById('result-modal').classList.remove('hidden');

  if (!extra) return;
  if (extra.mode === 'single') {
    ext.innerHTML = `<div class="single-mode">フリー対戦（LV ${state?.aiLevel ?? '—'}）</div>`;
    if (extra.newBadges && extra.newBadges.length) renderBadgeUnlocks(ext, extra.newBadges);
    return;
  }
  if (extra.mode === 'campaign' && extra.xpDelta != null) {
    playCelebration(extra);
  }
}

function hideResult() {
  document.getElementById('result-modal').classList.add('hidden');
  if (activeCelebration) activeCelebration.skip();
}

// --- Dev trigger ------------------------------------------------------------
// Usage from devtools console:
//   triggerCelebration({ oldXp: 0, newXp: 30 })           — campaign animation
//   triggerCelebration({ oldXp: 80, newXp: 50 })          — XP loss / LV down
//   triggerCelebration({ kishin: true })                  — preset to LV99 boundary
//   triggerCelebration({ rank: '初級' })                  — preset to specific rank-up
//   triggerCelebration({ oldXp: 0, newXp: 100, badges: [{name:'三連勝'}] })
window.triggerCelebration = function(opts = {}) {
  let { oldXp, newXp, badges, kishin, rank } = opts;
  if (kishin) {
    // Set up to enter LV99 from LV98
    let xp = 0;
    for (let lv = 1; lv < 98; lv++) xp += xpToNext(lv);
    oldXp = xp + Math.floor(xpToNext(98) / 2);
    newXp = oldXp + xpToNext(98); // exactly enough to hit LV99
  } else if (rank) {
    const lv = Object.entries(RANK_NAMES).find(([_, n]) => n === rank);
    if (lv) {
      const targetLv = parseInt(lv[0], 10);
      let xp = 0;
      for (let i = 1; i < targetLv - 1; i++) xp += xpToNext(i);
      oldXp = xp + Math.floor(xpToNext(targetLv - 1) / 2);
      newXp = oldXp + xpToNext(targetLv - 1);
    }
  }
  oldXp = oldXp ?? 0;
  newXp = newXp ?? oldXp;
  const winner = newXp >= oldXp ? '黒の勝利' : '白の勝利';
  document.getElementById('modal-winner').textContent = '【DEV】演出テスト';
  document.getElementById('modal-score-D').textContent = '—';
  document.getElementById('modal-score-L').textContent = '—';
  const ext = document.getElementById('modal-extra');
  if (ext) ext.innerHTML = '';
  document.getElementById('result-modal').classList.remove('hidden');
  const oldLv = xpToLevel(oldXp).lv;
  const newLv = xpToLevel(newXp).lv;
  const extra = {
    mode: 'campaign',
    xpDelta: newXp - oldXp,
    oldXp, newXp, oldLv, newLv,
    newBadges: badges || [],
  };
  playCelebration(extra);
  console.log('[triggerCelebration]', { oldXp, newXp, oldLv, newLv, segments: buildSegments(oldXp, newXp).length });
};

function labelOf(c) { return c === 'D' ? '黒' : '白'; }
function coord(r, c) { return `${String.fromCharCode(97 + c)}${r + 1}`; }
function log(label, detail = '', cls = '') {
  state.log.push({ label, detail, cls });
  const el = document.getElementById('log');
  if (state.log.length > 80) state.log.shift();
  el.innerHTML = state.log.slice(-30).map(l =>
    `<div class="log-entry ${l.cls}"><strong>${l.label}</strong>${l.detail ? ' · ' + l.detail : ''}</div>`
  ).join('');
  el.scrollTop = el.scrollHeight;
}
